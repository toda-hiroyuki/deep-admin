<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>催行回詳細 — DeepExperience 運営管理</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <style>
      :root {
        --bg: #fbf7f0;
        --bg-sunken: #f4efe5;
        --surface: #ffffff;
        --surface-warm: #fffdf8;
        --surface-tint: #f7f3eb;
        --ink: #1d1a17;
        --ink-soft: #3d3833;
        --muted: #756d63;
        --muted-soft: #9a9389;
        --line: #e8e0d3;
        --line-strong: #d4cabb;
        --line-soft: #efe9dc;
        --side-bg: #0f2e2b;
        --side-ink: #f3ebdb;
        --side-ink-soft: #aac3bf;
        --side-line: rgba(255, 255, 255, 0.12);
        --accent: #0a5e5a;
        --accent-strong: #064a47;
        --accent-soft: #d6ebe8;
        --blue: #2a5db0;
        --blue-soft: #e1ebfa;
        --teal-blue: #1f7a78;
        --teal-blue-soft: #d3eceb;
        --coral: #ba4530;
        --coral-soft: #f6dfd8;
        --amber: #8e5b00;
        --amber-soft: #f4e3bd;
        --amber-bg: #fdf4dd;
        --green: #1f6440;
        --green-soft: #d6ecdd;
        --radius: 6px;
        --radius-sm: 4px;
        --radius-lg: 10px;
        --field-h: 38px;
        --shadow-1: 0 1px 2px rgba(45, 30, 12, 0.04), 0 1px 0 rgba(45, 30, 12, 0.02);
        --shadow-pop: 0 8px 28px rgba(45, 30, 12, 0.12);
        --ring: 0 0 0 3px rgba(10, 94, 90, 0.18);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
        font-feature-settings: "ss01", "cv11";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body { background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.5; }
      button, input, select, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; }
      ::selection { background: var(--accent-soft); color: var(--accent-strong); }

      /* ── Shell ── */
      .app-shell { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; }
      .side-nav {
        background: var(--side-bg); color: var(--side-ink); padding: 20px 16px;
        display: flex; flex-direction: column; gap: 20px;
        position: sticky; top: 0; height: 100vh; min-height: 0; overflow-y: auto; border-right: 1px solid var(--side-line);
      }
      .brand-block { display: flex; align-items: center; gap: 10px; padding-bottom: 16px; border-bottom: 1px solid var(--side-line); }
      .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; background: var(--accent); color: #fff; font-weight: 800; font-size: 13px; border-radius: 8px; letter-spacing: -0.02em; }
      .brand-name { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
      .brand-caption { font-size: 11px; color: var(--side-ink-soft); margin-top: 2px; }
      .nav-group { display: flex; flex-direction: column; gap: 2px; }
      .nav-section-label { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--side-ink-soft); padding: 0 8px 6px; }
      .nav-item { appearance: none; border: 0; background: transparent; color: var(--side-ink); display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 6px 10px; border-radius: 7px; text-align: left; font-size: 13.5px; font-weight: 500; position: relative; transition: background 0.12s; width: 100%; }
      .nav-item:hover { background: rgba(255, 255, 255, 0.06); }
      .nav-item.active { background: rgba(255, 255, 255, 0.10); font-weight: 650; }
      .nav-item.active::before { content: ""; position: absolute; left: -16px; top: 8px; bottom: 8px; width: 3px; background: var(--accent); border-radius: 0 3px 3px 0; }
      .nav-icon { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 5px; background: rgba(255, 255, 255, 0.08); font-size: 10px; font-weight: 700; letter-spacing: 0.02em; color: var(--side-ink-soft); flex-shrink: 0; }
      .nav-item.active .nav-icon { background: var(--accent); color: #fff; }
      .nav-count { margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums; color: var(--side-ink-soft); background: rgba(255, 255, 255, 0.06); padding: 1px 6px; border-radius: 4px; }
      .nav-count.alert { background: var(--amber); color: #fff; font-weight: 700; }
      .side-note { margin-top: auto; border-top: 1px solid var(--side-line); padding-top: 16px; color: var(--side-ink-soft); font-size: 11.5px; line-height: 1.55; }
      .side-note strong { display: block; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--side-ink); margin-bottom: 6px; font-weight: 700; }

      /* ── Workspace ── */
      .workspace { padding: 20px 24px 56px; display: flex; flex-direction: column; gap: 16px; min-width: 0; max-width: 1100px; }
      .crumbs { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
      .crumbs .sep { color: var(--muted-soft); }
      .crumbs a { color: var(--muted); text-decoration: none; }
      .crumbs a:hover { color: var(--accent); text-decoration: underline; }
      .crumbs .current { color: var(--ink); font-weight: 600; font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; }
      .page-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-top: 2px; }
      .page-title h1 { margin: 0; font-size: 22px; font-weight: 750; letter-spacing: -0.01em; }
      .page-title .sub { font-size: 12.5px; color: var(--muted); }
      .title-mono { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }

      /* ── Badges & pills ── */
      .status-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 11px 4px 9px; border-radius: 999px; background: var(--bg-sunken); color: var(--muted); white-space: nowrap; }
      .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .status-pill.teal { background: var(--accent-soft); color: var(--accent-strong); }
      .status-pill.green { background: var(--green-soft); color: var(--green); }
      .status-pill.amber { background: var(--amber-soft); color: var(--amber); }
      .status-pill.blue { background: var(--blue-soft); color: var(--blue); }
      .status-pill.tealblue { background: var(--teal-blue-soft); color: var(--teal-blue); }
      .status-pill.muted { background: var(--bg-sunken); color: var(--muted); }
      .status-pill.coral { background: var(--coral-soft); color: var(--coral); }
      .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 4px; background: var(--bg-sunken); color: var(--ink-soft); white-space: nowrap; }
      .badge.blue { background: var(--blue-soft); color: var(--blue); }
      .badge.teal { background: var(--accent-soft); color: var(--accent-strong); }
      .badge.amber { background: var(--amber-soft); color: var(--amber); }
      .badge.green { background: var(--green-soft); color: var(--green); }
      .badge.muted { background: var(--bg-sunken); color: var(--muted); }
      .muted-dash { color: var(--muted-soft); }

      /* ── Buttons ── */
      .btn { height: var(--field-h); padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; font-weight: 600; transition: background 0.1s, border-color 0.1s; white-space: nowrap; }
      .btn:hover { background: var(--surface-tint); border-color: var(--ink-soft); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
      .btn.outline { background: var(--surface); border-color: var(--accent); color: var(--accent-strong); }
      .btn.outline:hover { background: var(--accent-soft); border-color: var(--accent); }
      .btn.sm { height: 32px; padding: 0 14px; font-size: 12.5px; }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; }
      .btn:disabled:hover { background: var(--surface); border-color: var(--accent); color: var(--accent-strong); }
      .btn-link { background: none; border: 0; color: var(--accent); font-size: 12.5px; font-weight: 600; padding: 0; height: auto; }
      .btn-link:hover { color: var(--accent-strong); text-decoration: underline; }

      /* ── Cards ── */
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); overflow: hidden; }
      .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line-soft); background: var(--surface-warm); }
      .card-title { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; letter-spacing: -0.005em; }
      .card-title .sec-no { width: 22px; height: 22px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; font-size: 11px; font-weight: 800; }
      .card-title .sec-hint { font-size: 11.5px; font-weight: 500; color: var(--muted); margin-left: 2px; }
      .card-body { padding: 18px 20px; }
      .card-body.flush { padding: 0; }
      .card-foot { padding: 14px 20px; border-top: 1px solid var(--line-soft); display: flex; gap: 8px; flex-wrap: wrap; }
      .card-foot.end { justify-content: flex-end; }

      /* ── Definition grid ── */
      .def-grid { display: grid; grid-template-columns: 160px 1fr 160px 1fr; gap: 0; }
      .def-grid .dt { color: var(--muted); font-size: 12px; font-weight: 600; padding: 11px 14px 11px 0; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; }
      .def-grid .dd { color: var(--ink); font-size: 13.5px; padding: 11px 0; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .def-grid .dd:not(.span) { padding-right: 18px; }
      .def-grid .dd.span { grid-column: 2 / -1; }
      .def-grid .code-mono { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; color: var(--ink-soft); font-weight: 650; }
      .def-grid .dd .sub { color: var(--muted); font-size: 12px; }
      .def-grid .dd .strong { font-weight: 650; }
      .def-grid .dt:nth-last-child(-n+2), .def-grid .dd:nth-last-child(-n+2) { border-bottom: 0; }
      .cap-meter { display: inline-flex; align-items: center; gap: 9px; }
      .cap-bar { width: 76px; height: 6px; border-radius: 999px; background: var(--bg-sunken); overflow: hidden; }
      .cap-bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
      @media (max-width: 860px) { .def-grid { grid-template-columns: 140px 1fr; } .def-grid .dd.span { grid-column: 2; } .def-grid .dt:nth-last-child(-n+2), .def-grid .dd:nth-last-child(-n+2) { border-bottom: 1px solid var(--line-soft); } }

      /* ── Tables in cards ── */
      .data-table { width: 100%; border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; }
      .data-table thead th { text-align: left; font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 9px 16px; border-bottom: 1px solid var(--line); background: var(--surface-tint); white-space: nowrap; }
      .data-table thead th.center { text-align: center; }
      .data-table thead th.right { text-align: right; }
      .data-table tbody td { padding: 12px 16px; border-bottom: 1px solid var(--line-soft); font-size: 13px; vertical-align: middle; }
      .data-table tbody td.center { text-align: center; }
      .data-table tbody td.right { text-align: right; }
      .data-table tbody tr:last-child td { border-bottom: 0; }
      .data-table tbody tr { transition: background 0.08s; }
      .data-table tbody tr:hover { background: var(--surface-warm); }
      .data-table tbody tr.is-selected { background: var(--accent-soft); }
      .data-table tbody tr.is-selected:hover { background: var(--accent-soft); }
      .data-table .code-mono { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--ink-soft); font-weight: 600; }
      .data-table .g-name { font-weight: 650; color: var(--ink); }
      .data-table tr.is-empty td { color: var(--muted-soft); }
      .check { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }
      .col-check { width: 44px; }

      /* ── Guide chip in table ── */
      .guide-cell { display: inline-flex; align-items: center; gap: 9px; }
      .g-ava { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; font-weight: 700; font-size: 12px; border: 1px solid var(--line-strong); flex-shrink: 0; }
      .g-ava.empty { background: var(--bg-sunken); color: var(--muted-soft); border-style: dashed; }
      .confirm-mark { color: var(--green); font-weight: 700; }

      /* ── Foot meta row ── */
      .settle-row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); }
      .settle-row strong { color: var(--ink-soft); font-weight: 650; }

      /* ── Form controls (settlement) ── */
      .ctrl { height: 34px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); color: var(--ink); padding: 0 10px; font-size: 13px; transition: border-color 0.1s, box-shadow 0.1s; width: 100%; }
      .ctrl::placeholder { color: var(--muted-soft); }
      .ctrl:hover { border-color: var(--ink-soft); }
      .ctrl:focus, .ctrl:focus-visible { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
      .ctrl:disabled { background: var(--surface-tint); color: var(--ink-soft); border-color: var(--line); cursor: not-allowed; }
      .input-affix { position: relative; display: flex; align-items: center; width: 150px; margin-left: auto; }
      .input-affix .pfx { position: absolute; left: 12px; color: var(--muted); font-size: 13px; pointer-events: none; }
      .input-affix .ctrl { padding-left: 22px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; }

      /* ── 区分 badges ── */
      .kbadge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; letter-spacing: 0.01em; }
      .kbadge.kb-fixed { background: var(--green-soft); color: var(--green); }
      .kbadge.kb-estimate { background: var(--amber-soft); color: var(--amber); }
      .kbadge.kb-auto { background: var(--accent-soft); color: var(--accent-strong); }
      .kbadge.kb-actual { background: var(--blue-soft); color: var(--blue); }

      /* ── Guide settlement (④) ── */
      .seg { display: inline-flex; background: var(--bg-sunken); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; }
      .seg button { border: 0; background: transparent; font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 12px; border-radius: 6px; transition: background 0.1s, color 0.1s; white-space: nowrap; }
      .seg button:hover { color: var(--ink-soft); }
      .seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

      .gs-banner { display: flex; gap: 11px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius); font-size: 12.5px; line-height: 1.55; margin-bottom: 18px; }
      .gs-banner .gb-ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 800; flex-shrink: 0; }
      .gs-banner .gb-title { font-weight: 700; }
      .gs-banner.info { background: var(--surface-tint); border: 1px solid var(--line); color: var(--ink-soft); }
      .gs-banner.info .gb-ic { background: var(--bg-sunken); color: var(--muted); }
      .gs-banner.blue { background: var(--blue-soft); border: 1px solid #cdddf5; color: #274b85; }
      .gs-banner.blue .gb-ic { background: var(--blue); color: #fff; }
      .gs-banner.coral { background: var(--coral-soft); border: 1px solid #ecccc3; color: #8f3322; }
      .gs-banner.coral .gb-ic { background: var(--coral); color: #fff; }
      .gs-banner.green { background: var(--green-soft); border: 1px solid #c4e2cd; color: var(--green); }
      .gs-banner.green .gb-ic { background: var(--green); color: #fff; }
      .gs-banner a { color: inherit; font-weight: 700; text-decoration: underline; }

      .calc-block { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; padding: 16px; background: var(--surface-warm); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 18px; }
      .calc-field { display: flex; flex-direction: column; gap: 6px; }
      .calc-field .cf-lab { font-size: 11.5px; font-weight: 600; color: var(--muted); }
      .calc-field .cf-sub { font-size: 11px; color: var(--muted-soft); }
      .calc-op { font-size: 18px; font-weight: 700; color: var(--muted-soft); padding-bottom: 8px; }
      .calc-field.result { margin-left: auto; align-items: flex-end; text-align: right; }
      .calc-field.result .cf-lab { color: var(--accent-strong); font-weight: 700; }
      .calc-field.result .cf-val { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; color: var(--accent-strong); line-height: 1.1; }
      .unit-input { position: relative; display: flex; align-items: center; }
      .unit-input .sfx { position: absolute; right: 11px; color: var(--muted); font-size: 12.5px; pointer-events: none; }
      .unit-input .ctrl { width: 124px; text-align: right; padding-right: 30px; font-variant-numeric: tabular-nums; font-weight: 650; }
      .calc-static { font-size: 18px; font-weight: 750; font-variant-numeric: tabular-nums; height: 34px; display: flex; align-items: center; }

      .fin-table { width: 100%; border-collapse: collapse; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
      .fin-table th { text-align: left; font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); background: var(--surface-tint); padding: 10px 16px; border-bottom: 1px solid var(--line); }
      .fin-table th.right { text-align: right; }
      .fin-table td { padding: 12px 16px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
      .fin-table tr:last-child td { border-bottom: 0; }
      .fin-table td.lab { font-size: 13.5px; font-weight: 650; color: var(--ink); }
      .fin-table td.lab .lab-sub, .fin-table td.total-lab .lab-sub { display: block; font-size: 11.5px; font-weight: 500; color: var(--muted); margin-top: 3px; line-height: 1.45; }
      .fin-table td.kb-cell { width: 132px; white-space: nowrap; }
      .fin-table td.val-cell { width: 200px; text-align: right; }
      .fin-table .val-amt { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
      .fin-table .val-amt.auto { color: var(--accent-strong); }
      .fin-table tr.total-row td { background: var(--surface-tint); border-top: 2px solid var(--line-strong); }
      .fin-table td.total-lab { font-size: 14px; font-weight: 800; color: var(--ink); }
      .fin-table .val-total { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; color: var(--accent-strong); font-variant-numeric: tabular-nums; }
      .delta-note { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--blue); margin-top: 4px; }

      .pax-step { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; background: var(--surface); vertical-align: middle; }
      .pax-step button { width: 26px; height: 26px; border: 0; background: var(--surface); font-size: 15px; font-weight: 700; color: var(--accent-strong); display: grid; place-items: center; padding: 0; }
      .pax-step button:hover { background: var(--accent-soft); }
      .pax-step button:disabled { color: var(--muted-soft); cursor: not-allowed; background: var(--surface); }
      .pax-step .pax-n { min-width: 32px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; border-left: 1px solid var(--line); border-right: 1px solid var(--line); height: 26px; display: grid; place-items: center; font-size: 12.5px; }
      .finalized-tag { font-size: 13px; font-weight: 800; color: var(--green); display: inline-flex; align-items: center; gap: 6px; }

      /* ── Actual comparison table (実績タブ) ── */
      .fin-table th.cmp-col { text-align: right; width: 150px; }
      .fin-table td.plan-cell { width: 150px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
      .fin-table td.plan-cell .pc-unit { font-size: 11.5px; color: var(--muted-soft); margin-left: 1px; }
      .fin-table td.act-cell { width: 170px; text-align: right; }
      .fin-table td.act-cell .input-affix, .fin-table td.act-cell .unit-input { width: 140px; margin-left: auto; }
      .fin-table td.act-cell .unit-input .ctrl { width: 140px; }
      .req-mark { color: var(--coral); font-weight: 800; margin-left: 2px; }
      .req-flag { display: inline-block; font-size: 10.5px; font-weight: 700; color: var(--coral); margin-top: 4px; }

      /* ── Cancel-confirm form (中止確定タブ) ── */
      .cx-grid { display: grid; grid-template-columns: 180px 1fr; gap: 16px 20px; align-items: start; max-width: 640px; }
      .cx-grid .cx-lab { font-size: 12.5px; font-weight: 650; color: var(--muted); padding-top: 8px; }

    <script type="text/babel" data-presets="react">
      const { useState, useRef } = React;

      const SESSION_ID = "TI-20260602-1000-G-AIC-005-1-GR-01";

      const BOOKINGS = [

        const operatedLike = sessionStatus === "operated" || sessionStatus === "not_operated" || sessionStatus === "aborted"; // 実績入力へ誘導する3値
        const [mode, setMode] = useState("estimate");       // 精算タブ：estimate | actual | cancelled
        const [edits, setEdits] = useState({});             // 見込みの編集値
        const [actEdits, setActEdits] = useState({});       // 実績の編集値
        const [confirmed, setConfirmed] = useState(false);  // 実績の確定フラグ
        // 中止確定タブ
        const [cxKind, setCxKind] = useState("zero");       // zero(0精算) | partial(一部精算)

        const estV = (f) => (edits[f] !== undefined ? num(edits[f]) : EST[f]);
        const estGuestAuto = PER_GUEST * pax;               // ゲスト立替経費（人数連動）
        const estGuest = edits.guest !== undefined ? num(edits.guest) : estGuestAuto;
        const estReward = Math.round(estV("rate") * estV("hours"));
        const estTotal = estReward + estV("meal") + estV("expense") + estV("commute") + estGuest;
        const estReadOnly = cancelled;                      // 中止時の「見込み」タブは参照のみ

        // ── 実績（actual）：空欄は見込み値を使用。通勤交通費は必須入力 ──
        const filled = (obj, f) => obj[f] !== undefined && obj[f] !== "";
        const actHours   = filled(actEdits, "hours")   ? num(actEdits.hours)   : estV("hours");

        const actExpense = filled(actEdits, "expense") ? num(actEdits.expense) : estV("expense");
        const actCommute = filled(actEdits, "commute") ? num(actEdits.commute) : estV("commute");
        const actGuest   = filled(actEdits, "guest")   ? num(actEdits.guest)   : estGuest;
        const actReward  = Math.round(estV("rate") * actHours);
        const actTotal   = actReward + actMeal + actExpense + actCommute + actGuest;
        const commuteMissing = !filled(actEdits, "commute"); // 必須未入力

        // ── 中止確定 ──
        const cxAmountVal = cxKind === "zero" ? 0 : num(cxAmount);
        const cxCanConfirm = cxKind === "zero" || filled({ a: cxAmount }, "a");

        const setField = (f, v) => setEdits(prev => ({ ...prev, [f]: v }));
        const setAct = (f, v) => setActEdits(prev => ({ ...prev, [f]: v }));
        const switchMode = (m) => setMode(m);

        // 催行回ステータス切替（開発用シナリオ）→ タブ構成と初期タブを決定

                        <td>
                          <span className="guide-cell">
                            <span className="g-ava">{b.initials}</span>
                            <span className="g-name">{b.guest}</span>
                          </span>
                        </td>
                        <td>{b.pax}</td>
                        <td><span className={`badge ${b.statusCls}`}>{b.status}</span></td>
                        <td><span className={`badge ${b.linkCls}`}>{b.link}</span></td>
                        <td className="right">
                          <a className="btn-link" href={`予約詳細.html?id=${b.id}`}
                            onClick={e => { e.preventDefault(); showToast(`予約 ${b.id} の詳細を開きます`); }}>
                            予約詳細を開く
                          </a>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </Card>

              {/* ── ③ ガイド手配情報 ── */}
              <Card no="3" title="ガイド手配情報" label="③ ガイド手配情報"
                action={<span className="status-pill tealblue"><span className="dot"></span>一部確定</span>}
                flush
                foot={
                  <React.Fragment>
                    <div className="settle-row" style={{ marginRight: "auto" }}>
                      <span>精算ステータス</span>
                      <span className="badge muted">見込み設定済み</span>
                    </div>
                    <button className="btn primary" onClick={() => showToast("手配操作画面を開きます")}>手配操作を開く</button>
                  </React.Fragment>
                }>
                <table className="data-table">
                  <thead>
                    <tr>
                      <th>ガイド名</th>
                      <th>役割</th>
                      <th>手配ステータス</th>
                      <th className="center">ガイド確認</th>
                      <th>確定日時</th>
                      <th className="right">適用時給</th>
                    </tr>
                  </thead>
                  <tbody>
                    {GUIDE_ARRANGE.map((g, i) => (
                      <tr key={i} className={g.name ? "" : "is-empty"}>
                        <td>
                          <span className="guide-cell">
                            <span className={`g-ava ${g.name ? "" : "empty"}`}>{g.initials || "—"}</span>
                            {g.name ? <span className="g-name">{g.name}</span> : <span className="muted-dash">未定</span>}
                          </span>
                        </td>
                        <td>{g.role}</td>
                        <td><span className={`badge ${g.statusCls}`}>{g.status}</span></td>
                        <td className="center">
                          {g.confirm
                            ? <span className="confirm-mark">{g.confirm} ✓</span>
                            : <span className="muted-dash">—</span>}
                        </td>
                        <td>{g.date ? <span className="code-mono">{g.date}</span> : <span className="muted-dash">—</span>}</td>
                        <td className="right">{g.rate ? <span className="strong" style={{ fontWeight: 650 }}>{g.rate}</span> : <span className="muted-dash">—</span>}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </Card>

              {/* ── ④ ガイド精算 ── */}
              {(() => {
                // ── 見込みタブ：金額入力セル ──
                const estMoney = (field, value) => estReadOnly
                  ? <span className="val-amt">{yen(value)}</span>
                  : <span className="input-affix">
                      <span className="pfx">¥</span>
                      <input className="ctrl" inputMode="numeric" placeholder="0"
                        value={edits[field] !== undefined ? edits[field] : value}
                        onChange={e => setField(field, e.target.value)} />
                    </span>;
                const estRow = (label, sub, field) => (
                  <tr>
                    <td className="lab">{label}<span className="lab-sub">{sub}</span></td>
                    <td className="kb-cell"><Kubun k="estimate" /></td>
                    <td className="val-cell">{estMoney(field, estV(field))}</td>
                  </tr>
                );

                // ── 実績タブ：見込み｜実績の比較セル ──
                const actRow = (label, sub, field, planVal, effVal) => (
                  <tr>
                    <td className="lab">{label}<span className="lab-sub">{sub}</span></td>
                    <td className="plan-cell">{yen(planVal)}</td>
                    <td className="act-cell">{confirmed
                      ? <span className="val-amt">{yen(effVal)}</span>
                      : <span className="input-affix"><span className="pfx">¥</span>
                          <input className="ctrl" inputMode="numeric" placeholder={String(planVal)}
                            value={actEdits[field] !== undefined ? actEdits[field] : ""}
                            onChange={e => setAct(field, e.target.value)} />
                        </span>}
                    </td>
                  </tr>
                );

                const banner = mode === "estimate"
                  ? (cancelled
                    ? <div className="gs-banner info"><span className="gb-ic">i</span><div><span className="gb-title">見込み精算（参照用）</span><br />催行回中止のため参照のみの表示です。確定額は「中止確定」タブをご確認ください。</div></div>
                    : <div className="gs-banner info"><span className="gb-ic">i</span><div><span className="gb-title">見込み精算</span><br />各項目を編集できます。ツアー実施後は「ツアー後（実績）」タブで実績を入力します。</div></div>)
                  : mode === "actual"
                  ? (confirmed
                    ? <div className="gs-banner green"><span className="gb-ic">✓</span><div><span className="gb-title">実績精算を確定しました</span><br />実績ベースの精算額を月次精算へ連携しました。確定後は編集できません。</div></div>
                    : <div className="gs-banner blue"><span className="gb-ic">実</span><div><span className="gb-title">{sessionStatus === "not_operated" ? "Not Operated（不催行） — ガイド実績入力" : sessionStatus === "aborted" ? "Aborted（中断） — ガイド実績入力" : "ツアー後 — 実績入力"}</span><br />{sessionStatus === "not_operated" ? "不催行ですが、ガイドの待機・移動などの実績を入力して精算します。" : sessionStatus === "aborted" ? "中断までの催行時間・経費の実績を入力して精算します。" : "見込みと差異がある項目のみ入力します。空欄の項目は見込み値を使用します。"}通勤交通費は必須です。</div></div>)
                  : (cxConfirmed
                    ? <div className="gs-banner green"><span className="gb-ic">✓</span><div><span className="gb-title">中止精算を確定しました</span><br />確定額を月次精算へ連携しました。確定後は編集できません。</div></div>
                    : <div className="gs-banner coral"><span className="gb-ic">!</span><div><span className="gb-title">催行回中止 — 精算確定</span><br /><a href="変更・キャンセル処理.html">キャンセル処理（STEP 5 精算確定）</a>で確定した精算額を登録します。精算区分・支払額を確認して確定してください。</div></div>);

                const headPill = mode === "estimate"
                  ? (cancelled
                    ? <span className="status-pill muted"><span className="dot"></span>参照（編集不可）</span>
                    : <span className="status-pill amber"><span className="dot"></span>見込み</span>)
                  : mode === "actual"
                  ? (confirmed
                    ? <span className="status-pill green"><span className="dot"></span>実績確定</span>
                    : <span className="status-pill blue"><span className="dot"></span>実績入力</span>)
                  : (cxConfirmed
                    ? <span className="status-pill green"><span className="dot"></span>中止精算確定</span>
                    : <span className="status-pill" style={{ background: "var(--coral-soft)", color: "var(--coral)" }}><span className="dot"></span>中止精算・要確定</span>);

                const foot = mode === "estimate"
                  ? (cancelled
                    ? <React.Fragment>
                        <div className="settle-row" style={{ marginRight: "auto" }}><span>参照用表示</span><span className="badge muted">編集不可</span></div>
                        <button className="btn-link" onClick={() => switchMode("cancelled")}>中止確定タブを開く →</button>
                      </React.Fragment>
                    : <React.Fragment>
                        <div className="settle-row" style={{ marginRight: "auto" }}><span>業務委託支払合計（見込み）</span><span className="badge amber" style={{ fontVariantNumeric: "tabular-nums" }}>{yen(estTotal)}</span></div>
                        <button className="btn outline" onClick={() => showToast("見込み精算を保存しました")}>見込みを保存</button>
                      </React.Fragment>)
                  : mode === "actual"
                  ? (confirmed
                    ? <span className="finalized-tag" style={{ marginRight: "auto" }}>✓ 実績精算確定済み（月次精算へ連携）</span>
                    : <React.Fragment>
                        <div className="settle-row" style={{ marginRight: "auto" }}><span>業務委託支払合計（実績）</span><span className="badge blue" style={{ fontVariantNumeric: "tabular-nums" }}>{yen(actTotal)}</span></div>
                        {commuteMissing && <span className="req-flag" style={{ marginRight: 8 }}>通勤交通費（実績）は必須です</span>}
                        <button className="btn primary" disabled={commuteMissing} onClick={() => { setConfirmed(true); showToast("実績精算を確定しました（月次精算へ連携）"); }}>実績を確認して確定する</button>
                      </React.Fragment>)
                  : (cxConfirmed
                    ? <React.Fragment>
                        <span className="finalized-tag" style={{ marginRight: "auto" }}>✓ 中止精算確定済み（月次精算へ連携）</span>
                        <a className="btn-link" href="変更・キャンセル処理.html" onClick={e => { e.preventDefault(); showToast("キャンセル処理を開きます"); }}>キャンセル処理を開く</a>
                      </React.Fragment>
                    : <React.Fragment>
                        <a className="btn-link" href="変更・キャンセル処理.html" style={{ marginRight: "auto" }} onClick={e => { e.preventDefault(); showToast("キャンセル処理を開きます"); }}>キャンセル処理を開く</a>
                        <button className="btn primary" disabled={!cxCanConfirm} onClick={() => { setCxConfirmed(true); showToast("中止精算を確定しました（月次精算へ連携）"); }}>精算を確定する</button>
                      </React.Fragment>);

                const tabs = cancelled
                  ? [["estimate", "見込み（参照）"], ["cancelled", "中止確定"]]
                  : [["estimate", "見込み"], ["actual", "ツアー後（実績）"]];

                return (
                  <Card no="4" title="ガイド精算" hint="業務委託支払の内訳" label="④ ガイド精算"
                    action={
                      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                        {headPill}
                        <div className="seg" role="tablist" aria-label="精算タブ">
                          {tabs.map(([m, label]) => (
                            <button key={m} className={mode === m ? "on" : ""} onClick={() => switchMode(m)}>{label}</button>
                          ))}
                        </div>
                      </div>
                    }
                    foot={foot}>
                    {banner}

                    {/* ═══ 見込みタブ ═══ */}
                    {mode === "estimate" && (
                      <React.Fragment>
                        <div className="calc-block">
                          <div className="calc-field">
                            <span className="cf-lab">適用時給{!estReadOnly && "（編集可）"}</span>
                            {estReadOnly
                              ? <span className="calc-static">{yen(estV("rate"))}<span style={{ fontSize: 12.5, fontWeight: 500, color: "var(--muted)", marginLeft: 2 }}>/h</span></span>
                              : <span className="input-affix" style={{ width: 132, margin: 0 }}>
                                  <span className="pfx">¥</span>
                                  <input className="ctrl" inputMode="numeric" style={{ paddingRight: 28 }}
                                    value={edits.rate !== undefined ? edits.rate : EST.rate}
                                    onChange={e => setField("rate", e.target.value)} />
                                  <span className="sfx" style={{ position: "absolute", right: 11, color: "var(--muted)", fontSize: 12.5, pointerEvents: "none" }}>/h</span>
                                </span>}
                            <span className="cf-sub">参照元：基本時給</span>
                          </div>
                          <span className="calc-op">×</span>
                          <div className="calc-field">
                            <span className="cf-lab">催行時間（見込み）{!estReadOnly && "（編集可）"}</span>
                            {estReadOnly
                              ? <span className="calc-static">{estV("hours")}<span style={{ fontSize: 12.5, fontWeight: 500, color: "var(--muted)", marginLeft: 2 }}>時間</span></span>
                              : <span className="unit-input">
                                  <input className="ctrl" inputMode="decimal"
                                    value={edits.hours !== undefined ? edits.hours : EST.hours}
                                    onChange={e => setField("hours", e.target.value)} />
                                  <span className="sfx">時間</span>
                                </span>}
                            <span className="cf-sub">10:00〜12:30</span>
                          </div>
                          <span className="calc-op">＝</span>
                          <div className="calc-field result">
                            <span className="cf-lab">ガイド時給報酬</span>
                            <span className="cf-val">{yen(estReward)}</span>
                            <span className="cf-sub">適用時給 × 催行時間（自動計算）</span>
                          </div>
                        </div>

                        <table className="fin-table">
                          <thead><tr><th>項目</th><th>区分</th><th className="right">金額</th></tr></thead>
                          <tbody>
                            <tr>
                              <td className="lab">ガイド時給報酬<span className="lab-sub">適用時給 × 催行時間（上記の自動計算）</span></td>
                              <td className="kb-cell"><Kubun k="auto" /></td>
                              <td className="val-cell"><span className="val-amt auto">{yen(estReward)}</span></td>
                            </tr>
                            {estRow("飲食費補助", "ツアー中の飲食補助", "meal")}
                            {estRow("ガイド経費・その他経費", "立替・消耗品などの実費", "expense")}
                            {estRow("通勤交通費", "集合場所までの往復交通費", "commute")}
                            <tr>
                              <td className="lab">ゲスト立替経費
                                <span className="lab-sub">
                                  {estReadOnly
                                    ? `¥${PER_GUEST.toLocaleString("ja-JP")} × ${pax}名 ＝ ${yen(estGuestAuto)}`
                                    : <span style={{ display: "inline-flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                                        <span>¥{PER_GUEST.toLocaleString("ja-JP")} × 参加人数</span>
                                        <span className="pax-step">
                                          <button onClick={() => changePax(pax - 1)} disabled={pax <= 1} aria-label="減らす">−</button>
                                          <span className="pax-n">{pax}</span>
                                          <button onClick={() => changePax(pax + 1)} disabled={pax >= CAPACITY} aria-label="増やす">＋</button>
                                        </span>
                                        <span>名 ＝ {yen(estGuestAuto)}（人数連動・自動再計算）</span>
                                      </span>}
                                </span>
                              </td>
                              <td className="kb-cell"><Kubun k="auto" /></td>
                              <td className="val-cell">{estMoney("guest", estGuest)}</td>
                            </tr>
                            <tr className="total-row">
                              <td className="total-lab">業務委託支払合計<span className="lab-sub" style={{ fontWeight: 500 }}>全項目の合計（自動計算・編集不可）</span></td>
                              <td className="kb-cell"><Kubun k="auto" /></td>
                              <td className="val-cell"><span className="val-total">{yen(estTotal)}</span></td>
                            </tr>
                          </tbody>
                        </table>
                      </React.Fragment>
                    )}

                    {/* ═══ ツアー後（実績）タブ ═══ */}
                    {mode === "actual" && (
                      <table className="fin-table">
                        <thead><tr><th>項目</th><th className="cmp-col">見込み</th><th className="cmp-col">実績</th></tr></thead>
                        <tbody>
                          <tr>
                            <td className="lab">催行時間<span className="lab-sub">適用時給 ¥{estV("rate").toLocaleString("ja-JP")}／h は見込みを使用</span></td>
                            <td className="plan-cell">{estV("hours")}<span className="pc-unit">h</span></td>
                            <td className="act-cell">{confirmed
                              ? <span className="val-amt">{actHours}h</span>
                              : <span className="unit-input">
                                  <input className="ctrl" inputMode="decimal" placeholder={String(estV("hours"))}
                                    value={actEdits.hours !== undefined ? actEdits.hours : ""}
                                    onChange={e => setAct("hours", e.target.value)} />
                                  <span className="sfx">時間</span>
                                </span>}
                            </td>
                          </tr>
                          <tr>
                            <td className="lab">ガイド時給報酬<span className="lab-sub">適用時給 × 催行時間（自動計算）</span></td>
                            <td className="plan-cell">{yen(estReward)}</td>
                            <td className="act-cell"><span className="val-amt auto">{yen(actReward)}</span></td>
                          </tr>
                          {actRow("飲食費補助", "空欄は見込み値を使用", "meal", estV("meal"), actMeal)}
                          {actRow("ガイド経費・その他経費", "空欄は見込み値を使用", "expense", estV("expense"), actExpense)}
                          <tr>
                            <td className="lab">通勤交通費<span className="req-mark">＊必須</span><span className="lab-sub">実績の往復交通費を入力</span></td>
                            <td className="plan-cell">{yen(estV("commute"))}</td>
                            <td className="act-cell">{confirmed
                              ? <span className="val-amt">{yen(actCommute)}</span>
                              : <React.Fragment>
                                  <span className="input-affix"><span className="pfx">¥</span>
                                    <input className="ctrl" inputMode="numeric" placeholder="必須"
                                      style={commuteMissing ? { borderColor: "var(--coral)" } : undefined}
                                      value={actEdits.commute !== undefined ? actEdits.commute : ""}
                                      onChange={e => setAct("commute", e.target.value)} />
                                  </span>
                                  {commuteMissing && <span className="req-flag">必須入力</span>}
                                </React.Fragment>}
                            </td>
                          </tr>
                          {actRow("ゲスト立替経費", "空欄は見込み値を使用", "guest", estGuest, actGuest)}
                          <tr className="total-row">
                            <td className="total-lab">業務委託支払合計<span className="lab-sub" style={{ fontWeight: 500 }}>実績ベースの合計（自動計算・編集不可）</span></td>
                            <td className="plan-cell">{yen(estTotal)}</td>
                            <td className="act-cell"><span className="val-total">{yen(actTotal)}</span></td>
                          </tr>
                        </tbody>
                      </table>
                    )}

                    {/* ═══ 中止確定タブ ═══ */}
                    {mode === "cancelled" && (
                      <div className="cx-grid">
                        <div className="cx-lab">ガイド精算区分<span className="cx-req">＊</span></div>
                        <div className="cx-field">
                          <span className="seg" role="group" aria-label="ガイド精算区分">
                            <button className={cxKind === "zero" ? "on" : ""} disabled={cxConfirmed} onClick={() => setCxKind("zero")}>0精算</button>
                            <button className={cxKind === "partial" ? "on" : ""} disabled={cxConfirmed} onClick={() => setCxKind("partial")}>一部精算</button>
                          </span>
                          <span className="cx-hint">{cxKind === "zero"
                            ? "中止に伴い支払なし（¥0）として確定します。"
                            : "発生済み経費など、一部を精算します。支払額を入力してください。"}</span>
                        </div>

                        <div className="cx-lab">支払額</div>
                        <div className="cx-field">
                          {cxConfirmed || cxKind === "zero"
                            ? <span className="cx-static">{yen(cxAmountVal)}</span>
                            : <span className="input-affix" style={{ margin: 0 }}><span className="pfx">¥</span>
                                <input className="ctrl" inputMode="numeric" placeholder="0"
                                  value={cxAmount} onChange={e => setCxAmount(e.target.value)} />
                              </span>}
                          {cxKind === "partial" && !cxConfirmed && <span className="cx-hint">例：発生済みの通勤交通費 {yen(EST.commute)} など</span>}
                        </div>

                        <div className="cx-lab">支払理由・メモ</div>
                        <div className="cx-field">
                          {cxConfirmed
                            ? <span className="cx-hint" style={{ color: "var(--ink-soft)", fontSize: 13 }}>{cxMemo || "—"}</span>
                            : <textarea className="ctrl" placeholder="支払理由・経緯などを記録（任意）"
                                value={cxMemo} onChange={e => setCxMemo(e.target.value)} />}
                        </div>

                        <div className="cx-lab">業務委託支払合計</div>
                        <div className="cx-field">
                          <span className="cx-static" style={{ color: "var(--accent-strong)" }}>{yen(cxAmountVal)}</span>
                          <span className="cx-hint">中止精算の確定額（自動）</span>
                        </div>
                      </div>
                    )}
                  </Card>
                );
              })()}
            </main>

            <div className={`toast ${toast ? "show" : ""}`}>
              <span className="t-dot"></span>{toast}
            </div>
            </div>
          </React.Fragment>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
