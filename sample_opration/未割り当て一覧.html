        const reset = () => {
          setQ(""); setTourQuery(""); setFrom("2026-06-15"); setTo("");
          setChannel("すべて"); setLang("すべて"); setStConfirm(true); setStPending(true);
          showToast("フィルターをリセットしました");
        };

        const allChecked = selected.length === ROWS.length && ROWS.length > 0;
        const toggleAll = () => setSelected(allChecked ? [] : ROWS.map(r => r.id));
        const toggleOne = (id) => setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);

        const bulkAssign = () => {
          showToast(<span>選択した <b>{selected.length}</b> 件の予約割り当て画面を開きます</span>);
        };
        const goAssign = (r) => {
          window.location.href = "予約割り当て.html";
        };

        return (
          <div className="app-shell">
            <nav className="side-nav">
              <div className="brand-block">
                <div className="brand-mark">DE</div>
                <div>
                  <div className="brand-name">DeepExperience</div>
                  <div className="brand-caption">運営管理</div>
                </div>
              </div>
              {[
                { grp: "ops",     label: "予約オペレーション" },
                { grp: "product", label: "商品管理" },
                { grp: "guide",    label: "ガイド管理" },
                { grp: "facility", label: "施設管理" },
                { grp: "pay",      label: "精算・経営" },
                { grp: "master",  label: "マスター管理" },
              ].map(({ grp, label }) => (
                <div className="nav-group" key={grp}>
                  <div className="nav-section-label">{label}</div>
                  {NAV.filter(n => n.group === grp).map(n => (
                    <button
                      key={n.key}
                      className={`nav-item${n.active ? " active" : ""}${n.child ? " nav-child" : ""}`}
                      onClick={() => n.href
                        ? (window.location.href = n.href)
                        : (!n.active && showToast(`「${n.label}」へ移動します`))
                      }
                    >
                      <span className="nav-icon">{n.icon}</span>
                      <span>{n.label}</span>
                      {n.count != null && (
                        <span className={`nav-count${n.alert ? " alert" : ""}`}>{n.count}</span>
                      )}
                    </button>
                  ))}
                </div>
              ))}
              <div className="side-note">
                <strong>運用メモ</strong>
                催行回にまだ紐付いていない予約を、ツアー日が近い順に表示します。割り当て後は本一覧から外れます。
              </div>
            </nav>

            <main className="workspace">
              <div className="topbar">
                <div>
                  <div className="crumbs">予約オペレーション</div>
                  <h1>未割り当て一覧</h1>
                  <div className="sub">催行回に未紐付けの予約を割り当てます</div>
                </div>
                <div className="topbar-right">
                  <div className="top-date"><span className="dot"></span>2026年6月8日（月）</div>
                  <div className="avatar" title="運営担当">OP</div>
                </div>
              </div>

              <div className="filter-bar">
                <div className="filter-grid">
                  <div className="filter-field">
                    <span className="filter-label">予約ID / 外部予約番号</span>
                    <input className="ctrl" style={{ width: 210 }} placeholder="BK-… / 外部番号で検索"
                      value={q} onChange={e => setQ(e.target.value)} />
                  </div>
                  <div className="filter-field">
                    <span className="filter-label">TourOption</span>
                    <input className="ctrl" style={{ width: 190 }} placeholder="コード・名称で検索"
                      value={tourQuery} onChange={e => setTourQuery(e.target.value)} />
                  </div>
                  <div className="filter-field">
                    <span className="filter-label">ツアー日</span>
                    <div className="date-range">
                      <input type="date" className="ctrl" value={from} onChange={e => setFrom(e.target.value)} />
                      <span className="sep">〜</span>
                      <input type="date" className="ctrl" value={to} onChange={e => setTo(e.target.value)} />
                    </div>
                  </div>
                  <div className="filter-field">
                    <span className="filter-label">予約元 / チャネル</span>
                    <select className="ctrl" style={{ width: 180 }} value={channel} onChange={e => setChannel(e.target.value)}>
                      <option>すべて</option>
                      <option>Viator</option>
                      <option>GetYourGuide</option>
                      <option>Klook</option>
                      <option>Airbnb</option>
                      <option>自社サイト</option>
                    </select>
                  </div>
                  <div className="filter-field">
                    <span className="filter-label">ゲスト言語</span>
                    <select className="ctrl" style={{ width: 140 }} value={lang} onChange={e => setLang(e.target.value)}>
                      <option>すべて</option>
                      <option>日本語</option>
                      <option>英語</option>
                      <option>中国語(簡体)</option>
                      <option>中国語(繁体)</option>
                      <option>韓国語</option>
                      <option>フランス語</option>
                      <option>その他</option>
                    </select>
                  </div>
                  <div className="filter-field">
                    <span className="filter-label">予約ステータス</span>
                    <div className="check-row">
                      <label className="check-opt"><input type="checkbox" checked={stConfirm} onChange={e => setStConfirm(e.target.checked)} />確定予約</label>
                      <label className="check-opt"><input type="checkbox" checked={stPending} onChange={e => setStPending(e.target.checked)} />確定待ち</label>
                    </div>
                  </div>
                  <div className="filter-actions">
                    <button className="btn-link" onClick={reset}>リセット</button>
                    <button className="btn primary" onClick={() => showToast("絞り込みを適用しました")}>絞り込む</button>
                  </div>
                </div>
              </div>

              <div className="result-meta">
                <span><strong>1–{ROWS.length}</strong> / {ROWS.length} 件の未紐付け予約</span>
                <span className="sort-tag">ツアー日 <span className="ar">昇順</span> で表示中（近い順）</span>
              </div>

              {selected.length > 0 && (
                <div className="bulk-bar">
                  <span className="bb-count"><b>{selected.length}</b> 件を選択中</span>
                  <span className="bb-hint">同一 TourOption・同一日時の予約は、まとめて同じ催行回に載せられます。</span>
                  <span className="bb-actions">
                    <button className="btn ghost sm" onClick={() => setSelected([])}>選択を解除</button>
                    <button className="btn primary" onClick={bulkAssign}>選択した {selected.length} 件を割り当て</button>
                  </span>
                </div>
              )}

              <div className="table-wrap">
                <div className="table-scroll">
                  <table>
                    <thead>
                      <tr>
                        <th className="check-col center">
                          <input type="checkbox" className="row-check" checked={allChecked}
                            ref={el => { if (el) el.indeterminate = selected.length > 0 && !allChecked; }}
                            onChange={toggleAll} />
                        </th>
                        <th>予約ID</th>
                        <th>ゲスト名</th>
                        <th>TourOption</th>
                        <th>ツアー日時<span className="sort-arrow">↑</span></th>
                        <th>参加人数</th>
                        <th>ゲスト言語</th>
                        <th>予約元 / チャネル</th>
                        <th>予約ステータス</th>
                        <th>催行回紐付け</th>
                        <th className="center">操作</th>
                      </tr>
                    </thead>
                    <tbody>
                      {ROWS.map(r => {
                        const isSel = selected.includes(r.id);
                        const isGrouped = keyCounts[groupKey(r)] > 1;
                        return (
                          <tr key={r.id} className={isSel ? "is-selected" : ""}>
                            <td className="check-col center">
                              <input type="checkbox" className="row-check" checked={isSel} onChange={() => toggleOne(r.id)} />
                            </td>
                            <td>
                              <div className="code-mono">{r.id}</div>
                              <div className="cell-sub">{r.ext}</div>
                            </td>
                            <td>
                              <span className="guest">
                                <span className="guest-av">{r.initials}</span>
                                <span className="guest-name">{r.guest}</span>
                              </span>
                            </td>
                            <td>
                              <div className="code-mono">{r.code}</div>
                              <div className="cell-sub">{r.tour}</div>
                            </td>
                            <td className="cell-date">
                              <div>{r.date.replace(/-/g, "/")}</div>
                              <div className="time">{r.time}</div>
                              {isGrouped && <span className="same-flag">同枠候補 {keyCounts[groupKey(r)]}件</span>}
                            </td>
                            <td className="pax">{r.pax}</td>
                            <td><span className="badge teal">{r.lang}</span></td>
                            <td><span className="badge blue">{r.channel}</span></td>
                            <td><span className={`status-pill ${r.status.cls}`}><span className="dot"></span>{r.status.label}</span></td>
                            <td><span className="status-pill muted"><span className="dot"></span>未紐付け</span></td>
                            <td className="center">
                              <button className="btn primary sm" onClick={() => goAssign(r)}>催行回へ割り当て</button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>

              <div className="pagination">
                <span>{ROWS.length} 件中 1–{ROWS.length} 件を表示</span>
                <div className="page-controls">
                  <button className="page-btn" disabled>‹</button>
                  <button className="page-btn active">1</button>
                  <button className="page-btn" disabled>›</button>
                </div>
              </div>
            </main>

            <div className={`toast ${toast ? "show" : ""}`}>
              <span className="t-dot"></span><span>{toast}</span>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
