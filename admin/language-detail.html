<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>言語マスター | deep_Admin</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="css/common.css">
  </head>
  <body data-density="regular" data-side="default">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <script src="js/master-data.js"></script>
    <script type="text/babel" data-presets="react">
const { useState } = React;

const SEED_LANGUAGES = [
  { id: "lang-1", name: "English(US)", code: "en" },
  { id: "lang-2", name: "日本語",      code: "ja" },
];

const params = new URLSearchParams(window.location.search);
const targetId = params.get("id");
const isCreate = params.get("mode") === "create" || !targetId;

// ── Sidebar ─────────────────────────────────────────────────────────────────
function Sidebar({ resource, counts = {} }) {
  const payItems = [
    { key: "settle",   href: "monthly-settlement.html",   icon: "ST", label: "月次締め確認" },
    { key: "ota",      href: "ota-payment-matching.html", icon: "OT", label: "OTA入金照合" },
    { key: "revenue",  href: "revenue-summary.html",      icon: "RV", label: "収支一覧" },
  ];
  const masterItems = [
    { key: "tourOption",     href: "tour-options.html",    icon: "TO", label: "TourOption",       count: counts.to },
    { key: "productPage",    href: "products.html",        icon: "PG", label: "商品ページ",          count: counts.pg },
    { key: "resource",       href: "resources.html",       icon: "RS", label: "リソース管理" },
    { key: "area",           href: "areas.html",           icon: "AR", label: "エリア管理" },
    { key: "facility",       href: "facilities.html",      icon: "FC", label: "施設管理" },
    { key: "language",       href: "languages.html",       icon: "LG", label: "言語マスター管理" },
    { key: "guideDoc",       href: "guide-materials.html", icon: "GD", label: "ガイド資料",         count: counts.gd },
    { key: "cancelTemplate", href: "cancel-policies.html", icon: "CP", label: "キャンセルポリシー" },
  ];
  return (
    <aside className="side-nav">
      <div className="brand-block">
        <div className="brand-mark">d.</div>
        <div>
          <div className="brand-name">deep_Admin</div>
          <div className="brand-caption">Product &amp; Sales · Phase 1</div>
        </div>
      </div>
      <div className="nav-group" style={{marginBottom:"8px"}}>
        <a href="index.html" className={`nav-item ${resource === "dashboard" ? "active" : ""}`} style={{textDecoration:"none"}}>
          <span className="nav-icon">⊞</span>
          <span style={{flex:1,minWidth:0}}><div>ダッシュボード</div></span>
        </a>
      </div>
      <div>
        <div className="nav-section-label">精算・経営</div>
        <div className="nav-group">
          {payItems.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${resource === it.key ? "active" : ""}`}
              style={{textDecoration:"none"}}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
            </a>
          ))}
        </div>
      </div>
      <div>
        <div className="nav-section-label">商品管理</div>
        <div className="nav-group">
          {masterItems.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${resource === it.key ? "active" : ""}`}
              style={{textDecoration:"none"}}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
              <span className="nav-count">{it.count}</span>
            </a>
          ))}
        </div>
      </div>
    </aside>
  );
}

// ── App ──────────────────────────────────────────────────────────────────────
function App() {
  const seed = SEED_LANGUAGES.find(l => l.id === targetId);
  const [form, setForm] = useState(seed ? { ...seed } : { id: "", name: "", code: "" });

  const update = patch => setForm(s => ({ ...s, ...patch }));
  const pageTitle = isCreate ? "新規登録" : (form.name || "言語マスター");

  return (
    <div className="app-shell">
      <Sidebar />
      <main className="workspace">
        <div className="topbar">
          <div className="topbar-left">
            <div className="crumbs">
              <a href="index.html" className="crumb-link">deep_Admin</a>
              <span className="sep">/</span>
              <a href="languages.html" className="crumb-link">言語マスター管理</a>
              <span className="sep">/</span>
              <span className="current">{pageTitle}</span>
            </div>
          </div>
        </div>

        <div className="status-strip">
          <div className="status-cell fill">
            <span className="status-label">言語名</span>
            <strong>{form.name || "—"}</strong>
          </div>
          <div className="status-actions">
            <a href="languages.html" className="btn">キャンセル</a>
            <button className="btn primary" onClick={() => window.location.href = "languages.html"}>
              {isCreate ? "保存" : "更新保存"}
            </button>
          </div>
        </div>

        <div className="content-grid" data-no-preview="true">
          <section className="editor-pane">
            <div className="editor-content">

          <div className="form-section">
            <div style={{background:'var(--surface)',border:'1px solid var(--line)',borderRadius:6,padding:'16px',display:'flex',flexDirection:'column',gap:16}}>
              <div className="field-wide">
                <label className="field-label">
                  <span>言語名</span>
                  <span className="req" aria-label="required" />
                </label>
                <input type="text" value={form.name} onChange={e => update({ name: e.target.value })}
                  placeholder="例：English(US)"
                  style={{width:'100%',padding:'7px 10px',border:'1px solid var(--line)',borderRadius:4,fontSize:13}} />
              </div>

              <div className="field-wide">
                <label className="field-label">
                  <span>言語コード</span>
                  <span className="req" aria-label="required" />
                </label>
                <input type="text" value={form.code} onChange={e => update({ code: e.target.value.replace(/[^a-z0-9_-]/g, "") })}
                  placeholder="例：en"
                  style={{width:'100%',padding:'7px 10px',border:'1px solid var(--line)',borderRadius:4,fontSize:13,fontFamily:'monospace'}} />
                <div className="field-help">※半角英数、ハイフン、アンダースコアのみで入力してください。</div>
              </div>
            </div>
          </div>

            </div>
          </section>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
