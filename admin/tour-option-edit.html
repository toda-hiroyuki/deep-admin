<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>紐付け設定 | deep_Admin</title>
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <link rel="stylesheet" href="css/simple-page.css">
</head>
<body>
<nav class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-name">deep_Admin</div>
    <div class="brand-sub">deep experience</div>
  </div>
  <div class="sidebar-nav">
    <div class="nav-section">メニュー</div>
    <a href="index.html" class="nav-item"><span class="nav-icon">⊞</span>ダッシュボード</a>
    <a href="tour-options.html" class="nav-item"><span class="nav-icon">◈</span>TourOption</a>
    <a href="products.html" class="nav-item active"><span class="nav-icon">◻</span>商品ページ</a>
      <a href="resources.html" class="nav-item"><span class="nav-icon">RS</span>リソース管理</a>
    <a href="guide-materials.html" class="nav-item"><span class="nav-icon">📄</span>ガイド向け資料</a>
    <a href="cancel-policies.html" class="nav-item"><span class="nav-icon">⚙</span>キャンセルポリシー</a>
  </div>
</nav>
  <div class="page-wrap">
    <div class="page-header">
      <div>
        <h1>紐付け設定</h1>
        <p class="sub-desc">「貸切3時間プラン」の紐付けレコードを編集します。表示名・説明・価格などの表示内容はTourOption画面で編集します。</p>
      </div>
    </div>

    <div class="section-card">
      <div class="field-grid">
        <div class="field">
          <label>紐付けID</label>
          <input type="text" value="link-01" readonly class="mono" />
        </div>
        <div class="field">
          <label>TourOptionコード</label>
          <input type="text" value="G-KYO-003-1-PR" readonly class="mono" />
        </div>
        <div class="field">
          <label>選択表示名（TO参照）</label>
          <input type="text" value="貸切3時間プラン" readonly />
        </div>
        <div class="field">
          <label>基準価格（TO参照）</label>
          <input type="text" value="¥18,000" readonly />
        </div>
        <div class="field">
          <label>表示順</label>
          <input type="number" value="1" min="1" />
        </div>
      </div>

      <div style="margin-bottom:8px;font-size:12px;color:var(--muted);font-weight:600;">表示・販売設定</div>
      <div class="check-cards">
        <label class="check-card">
          <input type="checkbox" checked />
          <div class="check-card-text">
            <strong>既定として表示</strong>
            <span>初期選択されるOption</span>
          </div>
        </label>
        <label class="check-card">
          <input type="checkbox" checked />
          <div class="check-card-text">
            <strong>商品ページ上に表示</strong>
            <span>OFFでも紐付けは保持</span>
          </div>
        </label>
        <label class="check-card">
          <input type="checkbox" checked />
          <div class="check-card-text">
            <strong>商品ページ上で販売</strong>
            <span>OFF時は閲覧のみ</span>
          </div>
        </label>
      </div>

      <div class="field field-full" style="margin-bottom:16px;">
        <label>備考（紐付け固有）</label>
        <textarea placeholder="この紐付けに関するメモがあれば入力"></textarea>
      </div>

      <div class="info-note">
        <span>ⓘ</span>
        <div>
          <strong>TourOption自体が非公開の場合、この商品ページの販売設定にかかわらず販売OFFになります。</strong><br/>
          表示内容を変更する場合はTourOption画面で編集してください。同じTourOptionを掲載している全商品ページに反映されます。
        </div>
      </div>

      <div class="footer">
        <button class="btn danger" onclick="location.href='product-detail.html#links'">この紐付けを解除</button>
        <div class="footer-right">
          <a href="product-detail.html#links" class="btn">キャンセル</a>
          <button class="btn primary" onclick="location.href='product-detail.html#links'">保存</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
