<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>紐付け設定 | deep_Admin</title>
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <style>
    :root {
      --bg: #fbf7f0; --bg-sunken: #f4efe5; --surface: #ffffff;
      --ink: #1a1714; --muted: #7c7066; --line: #e8e0d4; --line-strong: #cec5b5;
      --accent: #2b7a6f; --accent-soft: #e8f4f2; --amber: #b45309; --amber-soft: #fef3c7;
      --red: #dc2626; --red-soft: #fef2f2;
      --side-bg: #1e1a16; --side-ink: #f5f0e8; --side-ink-soft: rgba(245,240,232,0.55); --side-line: rgba(255,255,255,0.08);
      --font: "Inter var", "Hiragino Sans", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--ink); min-height: 100vh; display: flex; }
    .sidebar { width: 220px; background: var(--side-bg); color: var(--side-ink); display: flex; flex-direction: column; flex-shrink: 0; position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; z-index: 100; }
    .sidebar-brand { padding: 20px 16px 16px; border-bottom: 1px solid var(--side-line); }
    .brand-name { font-size: 16px; font-weight: 700; color: var(--side-ink); }
    .brand-sub { font-size: 11px; color: var(--side-ink-soft); margin-top: 2px; }
    .sidebar-nav { padding: 12px 0; flex: 1; }
    .nav-section { padding: 16px 16px 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: var(--side-ink-soft); text-transform: uppercase; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 16px; color: var(--side-ink-soft); text-decoration: none; font-size: 13.5px; font-weight: 500; }
    .nav-item:hover { background: rgba(255,255,255,0.07); color: var(--side-ink); }
    .nav-item.active { background: rgba(255,255,255,0.12); color: var(--side-ink); }
    .nav-icon { width: 20px; text-align: center; font-size: 14px; opacity: 0.8; }
    .page-wrap { margin-left: 220px; max-width: 900px; padding: 24px 24px 64px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
    h1 { font-size: 22px; font-weight: 700; }
    .sub-desc { font-size: 13px; color: var(--accent); margin-top: 4px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.danger { color: var(--red); border-color: var(--red); }
    .section-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 24px; margin-bottom: 16px; }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 12px; color: var(--muted); font-weight: 500; }
    .field input, .field textarea { padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; font-size: 13.5px; background: var(--bg-sunken); color: var(--ink); font-family: inherit; }
    .field input.mono { font-family: monospace; color: var(--accent); }
    .field textarea { resize: vertical; min-height: 72px; background: var(--surface); }
    .field input[readonly] { background: var(--bg-sunken); color: var(--muted); }
    .field-full { grid-column: 1 / -1; }
    .check-cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 16px; }
    .check-card { display: flex; align-items: flex-start; gap: 10px; padding: 12px; border: 1.5px solid var(--accent-soft); background: var(--accent-soft); border-radius: 8px; cursor: pointer; }
    .check-card input[type=checkbox] { margin-top: 2px; accent-color: var(--accent); width: 15px; height: 15px; flex-shrink: 0; }
    .check-card-text strong { display: block; font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    .check-card-text span { font-size: 11.5px; color: var(--muted); }
    .info-note { display: flex; gap: 10px; padding: 12px 14px; border-radius: 7px; font-size: 12.5px; background: var(--amber-soft); border: 1px solid #fcd34d; color: var(--amber); margin-bottom: 16px; }
    .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; border-top: 1px solid var(--line); margin-top: 8px; }
    .footer-right { display: flex; gap: 8px; }
  </style>
</head>
<body>
<nav class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-name">deep_Admin</div>
    <div class="brand-sub">deep experience</div>
  </div>
  <div class="sidebar-nav">
    <div class="nav-section">メニュー</div>
    <a href="index.html" class="nav-item"><span class="nav-icon">⊞</span>ダッシュボード</a>
    <a href="tour-options.html" class="nav-item"><span class="nav-icon">◈</span>TourOption</a>
    <a href="products.html" class="nav-item active"><span class="nav-icon">◻</span>商品ページ</a>
    <a href="guide-materials.html" class="nav-item"><span class="nav-icon">📄</span>ガイド向け資料</a>
    <a href="cancel-policies.html" class="nav-item"><span class="nav-icon">⚙</span>キャンセルポリシー</a>
  </div>
</nav>
  <div class="page-wrap">
    <div class="page-header">
      <div>
        <h1>紐付け設定</h1>
        <p class="sub-desc">「貸切3時間プラン」の紐付けレコードを編集します。表示名・説明・価格などの表示内容はTourOption画面で編集します。</p>
      </div>
    </div>

    <div class="section-card">
      <div class="field-grid">
        <div class="field">
          <label>紐付けID</label>
          <input type="text" value="link-01" readonly class="mono" />
        </div>
        <div class="field">
          <label>TourOptionコード</label>
          <input type="text" value="G-KYO-003-1-PR" readonly class="mono" />
        </div>
        <div class="field">
          <label>選択表示名（TO参照）</label>
          <input type="text" value="貸切3時間プラン" readonly />
        </div>
        <div class="field">
          <label>基準価格（TO参照）</label>
          <input type="text" value="¥18,000" readonly />
        </div>
        <div class="field">
          <label>表示順</label>
          <input type="number" value="1" min="1" />
        </div>
      </div>

      <div style="margin-bottom:8px;font-size:12px;color:var(--muted);font-weight:600;">表示・販売設定</div>
      <div class="check-cards">
        <label class="check-card">
          <input type="checkbox" checked />
          <div class="check-card-text">
            <strong>既定として表示</strong>
            <span>初期選択されるOption</span>
          </div>
        </label>
        <label class="check-card">
          <input type="checkbox" checked />
          <div class="check-card-text">
            <strong>商品ページ上に表示</strong>
            <span>OFFでも紐付けは保持</span>
          </div>
        </label>
        <label class="check-card">
          <input type="checkbox" checked />
          <div class="check-card-text">
            <strong>商品ページ上で販売</strong>
            <span>OFF時は閲覧のみ</span>
          </div>
        </label>
      </div>

      <div class="field field-full" style="margin-bottom:16px;">
        <label>備考（紐付け固有）</label>
        <textarea placeholder="この紐付けに関するメモがあれば入力"></textarea>
      </div>

      <div class="info-note">
        <span>ⓘ</span>
        <div>
          <strong>TourOption自体が非公開の場合、この商品ページの販売設定にかかわらず販売OFFになります。</strong><br/>
          表示内容を変更する場合はTourOption画面で編集してください。同じTourOptionを掲載している全商品ページに反映されます。
        </div>
      </div>

      <div class="footer">
        <button class="btn danger">この紐付けを解除</button>
        <div class="footer-right">
          <a href="product-detail.html" class="btn">キャンセル</a>
          <button class="btn primary">保存</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
