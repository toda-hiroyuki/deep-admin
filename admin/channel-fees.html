<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>チャネル・手数料設定 — deep_Admin</title>
    <link rel="stylesheet" href="css/common.css" />
    <style>
      .rate-val { font-weight: 700; }
      .fixed-sub { font-size: 11px; color: var(--muted-soft); font-weight: 500; margin-left: 4px; }
      .ch-name { font-weight: 650; color: var(--ink); }
      .muted-dash { color: var(--muted-soft); }

      /* slide-over */
      .so-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(29,26,23,0.28); z-index: 380; opacity: 0; pointer-events: none; transition: opacity 0.22s; }
      .so-overlay.open { opacity: 1; pointer-events: auto; }
      .slide-over { position: fixed; top: 0; right: 0; bottom: 0; width: 460px; max-width: 94vw; background: var(--surface); box-shadow: var(--shadow-pop); border-left: 1px solid var(--line); z-index: 390; transform: translateX(104%); transition: transform 0.26s cubic-bezier(0.32,0.72,0.28,1); display: flex; flex-direction: column; }
      .slide-over.open { transform: translateX(0); }
      .so-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line-soft); background: var(--surface-warm); flex-shrink: 0; }
      .so-head h2 { margin: 0; font-size: 15.5px; font-weight: 750; letter-spacing: -0.01em; }
      .so-close { margin-left: auto; width: 30px; height: 30px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); display: grid; place-items: center; font-size: 14px; color: var(--muted); transition: background 0.1s; cursor: pointer; }
      .so-close:hover { background: var(--surface-tint); color: var(--ink); }
      .so-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
      .so-foot { flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line-soft); background: var(--surface-warm); }
      .so-foot .spacer { flex: 1; }

      .fld { display: flex; flex-direction: column; gap: 6px; }
      .fld > label { font-size: 11.5px; font-weight: 650; color: var(--muted); letter-spacing: 0.02em; }
      .fld .req { color: var(--coral); margin-left: 3px; font-weight: 700; }
      .fld .opt { color: var(--muted-soft); margin-left: 5px; font-weight: 500; }
      .fld-static { height: 36px; display: flex; align-items: center; padding: 0 10px; background: var(--bg-sunken); border: 1px solid var(--line); border-radius: var(--radius); font-size: 13px; color: var(--ink-soft); font-weight: 600; }
      .fld-static small { margin-left: 8px; color: var(--muted-soft); font-weight: 500; }
      .switch-row { display: flex; align-items: center; gap: 10px; }
      .switch-row .sw-state { font-size: 13px; font-weight: 650; color: var(--ink-soft); }
      .switch { appearance: none; width: 42px; height: 24px; border-radius: 999px; background: var(--line-strong); border: 0; position: relative; transition: background 0.15s; padding: 0; flex-shrink: 0; cursor: pointer; }
      .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,0.22); }
      .switch.on { background: var(--accent); }
      .switch.on::after { left: 21px; }
      .switch.amber.on { background: var(--amber); }

      .verify-note { background: var(--amber-soft); border: 1px solid color-mix(in srgb, var(--amber) 24%, transparent); border-radius: var(--radius); padding: 10px 13px; font-size: 12px; line-height: 1.65; color: #5c3c04; display: flex; gap: 9px; }
      .verify-note .vn-ic { flex-shrink: 0; color: var(--amber); font-weight: 800; }

      .expand { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.24s ease; }
      .expand.open { grid-template-rows: 1fr; }
      .expand > .expand-inner { overflow: hidden; min-height: 0; display: flex; flex-direction: column; gap: 16px; }
      .sub-flds { border-left: 2px solid var(--amber-soft); padding-left: 14px; margin-left: 4px; display: flex; flex-direction: column; gap: 16px; }

      .hist { border-top: 1px solid var(--line-soft); padding-top: 14px; }
      .hist-toggle { background: none; border: 0; padding: 0; display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 650; color: var(--ink-soft); cursor: pointer; }
      .hist-toggle:hover { color: var(--accent-strong); }
      .hist-toggle .tri { display: inline-block; transition: transform 0.16s; font-size: 10px; color: var(--muted-soft); }
      .hist-toggle.open .tri { transform: rotate(90deg); }
      .hist-table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 10px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
      .hist-table th { text-align: left; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; padding: 7px 11px; background: var(--surface-tint); border-bottom: 1px solid var(--line); }
      .hist-table td { padding: 8px 11px; font-size: 12.5px; border-bottom: 1px solid var(--line-soft); color: var(--ink-soft); }
      .hist-table tr:last-child td { border-bottom: 0; }
      .hist-table .h-old { color: var(--muted); }
      .hist-table .h-new { font-weight: 700; color: var(--ink); }

      .num-affix { position: relative; display: inline-flex; align-items: center; }
      .num-affix .pfx { position: absolute; left: 10px; color: var(--muted); font-size: 13px; pointer-events: none; font-weight: 600; }
      .num-affix .sfx { position: absolute; right: 10px; color: var(--muted); font-size: 13px; pointer-events: none; font-weight: 600; }
      .num-affix input { padding-left: 22px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; width: 120px; }
      .num-affix.pct input { padding-left: 10px; padding-right: 24px; width: 90px; }

      .disable-lnk { background: none; border: 0; padding: 0; color: var(--coral); font-size: 12.5px; font-weight: 600; cursor: pointer; }
      .disable-lnk:hover { text-decoration: underline; }
      .url-ic { background: none; border: 0; padding: 0; font-size: 14px; text-decoration: none; cursor: pointer; }
      .url-ic:hover { opacity: 0.7; }

      .m-table tbody tr.inactive td { color: var(--muted-soft); }
      .m-table tbody tr.inactive .ch-name { color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <script type="text/babel" data-presets="react">
      const { useState, useRef, useEffect, useMemo } = React;

      const num = (v) => { const n = Number(String(v).replace(/[^0-9.\-]/g,"")); return isNaN(n) ? 0 : n; };
      const pct = (n) => (Number.isInteger(n) ? n : n.toFixed(1)) + "%";
      const yen = (n) => "¥" + Math.abs(Math.round(n)).toLocaleString("ja-JP");

      /* ── Sidebar ── */
      function Sidebar() {
        const opsItems = [
          { key: "bookings",      href: "bookings.html",       icon: "BK", label: "予約一覧" },
          { key: "unassigned",    href: "unassigned.html",     icon: "↳",  label: "未割り当て一覧", child: true },
          { key: "sessions",      href: "sessions.html",       icon: "SS", label: "催行回一覧" },
          { key: "unarranged",    href: "unarranged.html",     icon: "↳",  label: "未手配一覧", child: true },
          { key: "todayTomorrow", href: "today-tomorrow.html", icon: "↳",  label: "当日/翌日案件", child: true },
        ];
        const payItems = [
          { key: "settlement", href: "monthly-settlement.html", icon: "ST", label: "月次締め確認" },
          { key: "ota",        href: "ota-payment-matching.html", icon: "OT", label: "OTA入金照合" },
          { key: "revenue",    href: "revenue-summary.html",    icon: "RV", label: "収支一覧" },
        ];
        const guideItems = [
          { key: "guides", href: "guides.html", icon: "GM", label: "ガイド一覧" },
        ];
        const facilityItems = [
          { key: "facility",       href: "facilities.html",      icon: "FC", label: "施設一覧" },
        ];
        const masterMainItems = [
          { key: "tourOption",     href: "tour-options.html",    icon: "TO", label: "TourOption" },
          { key: "productPage",    href: "products.html",        icon: "PG", label: "商品ページ" },
        ];
        const masterSubItems = [
          { key: "resource",       href: "resources.html",       icon: "RS", label: "リソース管理" },
          { key: "area",           href: "areas.html",           icon: "AR", label: "エリア管理" },
          { key: "language",       href: "languages.html",       icon: "LG", label: "言語マスター管理" },
          { key: "guideDoc",       href: "guide-materials.html", icon: "GD", label: "ガイド資料" },
          { key: "cancelTemplate", href: "cancel-policies.html", icon: "CP", label: "キャンセルポリシー" },
          { key: "channelFee",     href: "channel-fees.html",    icon: "FE", label: "チャネル・手数料設定" },
        ];
        return (
          <aside className="side-nav">
            <div className="brand-block">
              <div className="brand-mark">d.</div>
              <div>
                <div className="brand-name">deep_Admin</div>
                <div className="brand-caption">Product &amp; Sales · Phase 1</div>
              </div>
            </div>
            <div className="nav-group" style={{marginBottom:"8px"}}>
              <a href="index.html" className="nav-item" style={{textDecoration:"none"}}>
                <span className="nav-icon">⊞</span>
                <span style={{flex:1,minWidth:0}}><div>ダッシュボード</div></span>
              </a>
            </div>
            <div>
              <div className="nav-section-label">予約オペレーション</div>
              <div className="nav-group">
                {opsItems.map(it => (
                  <a key={it.key} href={it.href}
                    className={`nav-item${it.child ? " nav-child" : ""}`}
                    style={{textDecoration:"none"}}>
                    <span className="nav-icon">{it.icon}</span>
                    <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
                  </a>
                ))}
              </div>
            </div>
            <div>
              <div className="nav-section-label">精算・経営</div>
              <div className="nav-group">
                {payItems.map(it => (
                  <a key={it.key} href={it.href} className="nav-item" style={{textDecoration:"none"}}>
                    <span className="nav-icon">{it.icon}</span>
                    <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
                  </a>
                ))}
              </div>
            </div>
            <div>
              <div className="nav-section-label">ガイド管理</div>
              <div className="nav-group">
                {guideItems.map(it => (
                  <a key={it.key} href={it.href} className="nav-item" style={{textDecoration:"none"}}>
                    <span className="nav-icon">{it.icon}</span>
                    <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
                  </a>
                ))}
              </div>
            </div>
            <div>
              <div className="nav-section-label">施設管理</div>
              <div className="nav-group">
                {facilityItems.map(it => (
                  <a key={it.key} href={it.href} className="nav-item" style={{textDecoration:"none"}}>
                    <span className="nav-icon">{it.icon}</span>
                    <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
                  </a>
                ))}
              </div>
            </div>
            <div>
              <div className="nav-section-label">商品管理</div>
              <div className="nav-group">
                {masterMainItems.map(it => (
                  <a key={it.key} href={it.href} className="nav-item" style={{textDecoration:"none"}}>
                    <span className="nav-icon">{it.icon}</span>
                    <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
                  </a>
                ))}
              </div>
              <div className="nav-section-label" style={{paddingTop:"10px"}}>マスター</div>
              <div className="nav-group">
                {masterSubItems.map(it => (
                  <a key={it.key} href={it.href}
                    className={`nav-item${it.key === "channelFee" ? " active" : ""}`}
                    style={{textDecoration:"none"}}>
                    <span className="nav-icon">{it.icon}</span>
                    <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
                  </a>
                ))}
              </div>
            </div>
            <div className="sidebar-footer">
              <a href="login.html" className="nav-item nav-logout" style={{textDecoration:"none"}}>
                <span className="nav-icon">↩</span><span>ログアウト</span>
              </a>
            </div>
          </aside>
        );
      }

      /* ── 定数 ── */
      const TYPE_LABELS = ["OTA", "アフィリエイト", "リセラー", "自社"];
      const TYPE_ORDER = { "自社": 0, "OTA": 1, "アフィリエイト": 2, "リセラー": 3 };
      const TYPE_BADGE = { "OTA": "blue", "自社": "teal", "アフィリエイト": "", "リセラー": "" };
      const TARGET_LABELS = { price: "販売価格", fee: "チャネル手数料", both: "両方" };

      const initialChannels = [
        { id: "direct",  name: "自社サイト",       type: "自社", rate: 0,  verify: false, target: null,   url: "",                                  active: true,  note: "", history: [] },
        { id: "airbnb",  name: "Airbnb",           type: "OTA",  rate: 20, verify: true,  target: "both", url: "https://www.airbnb.com/hosting",    active: true,
          note: "Bokun取込の金額が実額とズレるため金額検証を実施。実額はAirbnb管理画面で確認する。",
          history: [
            { at: "2026/04/01 10:00", from: "18%", to: "20%", by: "山田" },
            { at: "2025/10/01 09:00", from: "15%", to: "18%", by: "佐藤" },
          ]},
        { id: "klook",   name: "Klook",            type: "OTA",  rate: 25, verify: false, target: null,   url: "https://merchant.klook.com",        active: true,  note: "",
          history: [
            { at: "2026/04/01 10:00", from: "22%", to: "25%", by: "山田" },
            { at: "2025/10/01 09:00", from: "20%", to: "22%", by: "佐藤" },
          ]},
        { id: "viator",  name: "Viator",           type: "OTA",  rate: 20, verify: false, target: null,   url: "https://supplier.viator.com",       active: true,  note: "", history: [] },
        { id: "gyg",     name: "GetYourGuide",     type: "OTA",  rate: 20, verify: false, target: null,   url: "https://supplier.getyourguide.com", active: true,  note: "", history: [] },
      ];

      const initialPayments = [
        { id: "stripe", name: "クレジットカード（Stripe）", rate: 3.6, fixed: 0,  active: true, note: "" },
        { id: "bank",   name: "銀行振込",                  rate: 0,   fixed: 0,  active: true, note: "振込手数料はゲスト負担。" },
        { id: "paypal", name: "PayPal",                    rate: 4.1, fixed: 40, active: true, note: "" },
        { id: "cash",   name: "現地現金",                  rate: 0,   fixed: 0,  active: true, note: "" },
      ];

      /* ── 共通 ── */
      const Fld = ({ label, required, optional, children }) => (
        <div className="fld">
          <label>{label}{required && <span className="req">*</span>}{optional && <span className="opt">任意</span>}</label>
          {children}
        </div>
      );

      const StatusBadge = ({ active }) => active
        ? <span className="badge green"><span className="dot"></span>有効</span>
        : <span className="badge muted">無効</span>;

      /* ── チャネル編集フォーム ── */
      function ChannelForm({ channel, isNew, onSave, onCancel }) {
        const [name,   setName]   = useState(channel ? channel.name   : "");
        const [type,   setType]   = useState(channel ? channel.type   : "OTA");
        const [rate,   setRate]   = useState(channel ? channel.rate   : "");
        const [verify, setVerify] = useState(channel ? channel.verify : false);
        const [target, setTarget] = useState(channel && channel.target ? channel.target : "both");
        const [url,    setUrl]    = useState(channel ? channel.url    : "");
        const [active, setActive] = useState(channel ? channel.active : true);
        const [note,   setNote]   = useState(channel ? channel.note   : "");
        const [histOpen, setHistOpen] = useState(false);
        const history = (channel && channel.history) || [];

        const save = () => {
          if (!name.trim() || rate === "") { alert("チャネル名と手数料率は必須です"); return; }
          onSave({ name: name.trim(), type, rate: num(rate), verify, target: verify ? target : null, url: url.trim(), active, note });
        };

        return (
          <React.Fragment>
            <div className="so-body">
              <Fld label="チャネル名" required>
                <input className="field-input" value={name} placeholder="例：Klook" onChange={e => setName(e.target.value)} />
              </Fld>
              <Fld label="手数料種別" required>
                <select className="field-select select-arrow" value={type} onChange={e => setType(e.target.value)}>
                  {TYPE_LABELS.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
              </Fld>
              <Fld label="手数料率（%）" required>
                <span className="num-affix pct">
                  <input className="field-input" inputMode="decimal" value={rate} onChange={e => setRate(e.target.value)} style={{paddingLeft:10,paddingRight:24,width:90,textAlign:"right",fontVariantNumeric:"tabular-nums",fontWeight:700}} />
                  <span className="sfx">%</span>
                </span>
              </Fld>
              <Fld label="手数料計算ベース">
                <div className="fld-static">グロス販売金額<small>初期はグロスのみ対応</small></div>
              </Fld>
              <Fld label="金額検証要否">
                <div className="switch-row">
                  <button type="button" className={`switch amber${verify ? " on" : ""}`} onClick={() => setVerify(!verify)} />
                  <span className="sw-state">{verify ? "要" : "不要"}</span>
                </div>
              </Fld>
              <div className={`expand${verify ? " open" : ""}`}>
                <div className="expand-inner">
                  <div className="verify-note">
                    <span className="vn-ic">⚠</span>
                    <span>ONにすると、このチャネルからBokun取込した予約は「金額確認待ち」として保留されます。担当者がOTA管理画面で実額を確認・修正するまで収支計算は行われません。</span>
                  </div>
                  <div className="sub-flds">
                    <Fld label="検証対象項目" required>
                      <select className="field-select select-arrow" value={target} onChange={e => setTarget(e.target.value)}>
                        <option value="price">販売価格</option>
                        <option value="fee">チャネル手数料</option>
                        <option value="both">両方</option>
                      </select>
                    </Fld>
                    <Fld label="OTA管理画面URL" optional>
                      <input className="field-input" type="url" value={url} placeholder="https://" onChange={e => setUrl(e.target.value)} />
                      <span style={{fontSize:11.5,color:"var(--muted-soft)",lineHeight:1.55}}>設定すると取込確認画面で［開く］ボタンになります。</span>
                    </Fld>
                  </div>
                </div>
              </div>
              <Fld label="状態">
                <div className="switch-row">
                  <button type="button" className={`switch${active ? " on" : ""}`} onClick={() => setActive(!active)} />
                  <span className="sw-state">{active ? "有効" : "無効"}</span>
                </div>
              </Fld>
              <Fld label="備考" optional>
                <textarea className="field-textarea" rows="3" placeholder="手数料の詳細条件・注意事項など" value={note} onChange={e => setNote(e.target.value)}></textarea>
              </Fld>
              {!isNew && history.length > 0 && (
                <div className="hist">
                  <button type="button" className={`hist-toggle${histOpen ? " open" : ""}`} onClick={() => setHistOpen(!histOpen)}>
                    <span className="tri">▶</span>手数料率の変更履歴
                    <span style={{fontWeight:500,color:"var(--muted-soft)"}}>（{history.length}件）</span>
                  </button>
                  <div className={`expand${histOpen ? " open" : ""}`}>
                    <div className="expand-inner">
                      <table className="hist-table">
                        <thead><tr><th>変更日時</th><th>変更前</th><th>変更後</th><th>変更者</th></tr></thead>
                        <tbody>
                          {history.map((h,i) => (
                            <tr key={i}>
                              <td style={{fontSize:11.5}}>{h.at}</td>
                              <td className="h-old">{h.from}</td>
                              <td className="h-new">{h.to}</td>
                              <td>{h.by}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}
            </div>
            <div className="so-foot">
              <button className="btn primary" onClick={save}>保存する</button>
              <button className="btn" onClick={onCancel}>キャンセル</button>
              <span className="spacer"></span>
              {!isNew && active && <button className="disable-lnk" onClick={() => { setActive(false); }}>無効にする</button>}
            </div>
          </React.Fragment>
        );
      }

      /* ── 決済方法編集フォーム ── */
      function PaymentForm({ payment, isNew, onSave, onCancel }) {
        const [name,   setName]   = useState(payment ? payment.name   : "");
        const [rate,   setRate]   = useState(payment ? payment.rate   : "");
        const [fixed,  setFixed]  = useState(payment ? payment.fixed  : "");
        const [active, setActive] = useState(payment ? payment.active : true);
        const [note,   setNote]   = useState(payment ? payment.note   : "");

        const save = () => {
          if (!name.trim() || rate === "") { alert("決済方法名と手数料率は必須です"); return; }
          onSave({ name: name.trim(), rate: num(rate), fixed: num(fixed), active, note });
        };

        return (
          <React.Fragment>
            <div className="so-body">
              <Fld label="決済方法名" required>
                <input className="field-input" value={name} placeholder="例：クレジットカード（Stripe）" onChange={e => setName(e.target.value)} />
              </Fld>
              <Fld label="手数料率（%）" required>
                <span className="num-affix pct">
                  <input className="field-input" inputMode="decimal" value={rate} onChange={e => setRate(e.target.value)} style={{paddingLeft:10,paddingRight:24,width:90,textAlign:"right",fontVariantNumeric:"tabular-nums",fontWeight:700}} />
                  <span className="sfx">%</span>
                </span>
              </Fld>
              <Fld label="固定手数料（¥）" optional>
                <span className="num-affix">
                  <span className="pfx">¥</span>
                  <input className="field-input" inputMode="numeric" value={fixed} placeholder="0" onChange={e => setFixed(e.target.value)} style={{paddingLeft:22,textAlign:"right",fontVariantNumeric:"tabular-nums",fontWeight:700,width:120}} />
                </span>
                <span style={{fontSize:11.5,color:"var(--muted-soft)"}}>1取引あたりの固定額</span>
              </Fld>
              <Fld label="状態">
                <div className="switch-row">
                  <button type="button" className={`switch${active ? " on" : ""}`} onClick={() => setActive(!active)} />
                  <span className="sw-state">{active ? "有効" : "無効"}</span>
                </div>
              </Fld>
              <Fld label="備考" optional>
                <textarea className="field-textarea" rows="3" placeholder="注意事項など" value={note} onChange={e => setNote(e.target.value)}></textarea>
              </Fld>
            </div>
            <div className="so-foot">
              <button className="btn primary" onClick={save}>保存する</button>
              <button className="btn" onClick={onCancel}>キャンセル</button>
              <span className="spacer"></span>
              {!isNew && active && <button className="disable-lnk" onClick={() => setActive(false)}>無効にする</button>}
            </div>
          </React.Fragment>
        );
      }

      /* ── App ── */
      function App() {
        const [channels, setChannels] = useState(initialChannels);
        const [payments, setPayments] = useState(initialPayments);
        const [tab, setTab] = useState("channel");
        const [panel, setPanel] = useState(null);
        const [panelSeed, setPanelSeed] = useState(0);
        const [toast, setToast] = useState(null);
        const toastTimer = useRef(null);

        const showToast = (msg) => {
          setToast(msg);
          clearTimeout(toastTimer.current);
          toastTimer.current = setTimeout(() => setToast(null), 2600);
        };

        const openPanel = (p) => { setPanel(p); setPanelSeed(s => s+1); };
        const closePanel = () => setPanel(null);

        useEffect(() => {
          const onKey = (e) => { if (e.key === "Escape") closePanel(); };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, []);

        const sortedChannels = useMemo(() => channels.slice().sort((a,b) =>
          (Number(b.active) - Number(a.active)) ||
          (TYPE_ORDER[a.type] - TYPE_ORDER[b.type]) ||
          a.name.localeCompare(b.name, "ja")
        ), [channels]);

        const saveChannel = (form) => {
          if (panel.mode === "edit") {
            setChannels(cs => cs.map(c => c.id === panel.id ? {...c, ...form} : c));
          } else {
            setChannels(cs => [...cs, {id:"ch-"+Math.random().toString(36).slice(2), history:[], ...form}]);
          }
          closePanel();
          showToast("チャネルを保存しました");
        };
        const savePayment = (form) => {
          if (panel.mode === "edit") {
            setPayments(ps => ps.map(p => p.id === panel.id ? {...p, ...form} : p));
          } else {
            setPayments(ps => [...ps, {id:"pm-"+Math.random().toString(36).slice(2), ...form}]);
          }
          closePanel();
          showToast("決済方法を保存しました");
        };

        const editingChannel = panel && panel.kind === "channel" && panel.mode === "edit"
          ? channels.find(c => c.id === panel.id) : null;
        const editingPayment = panel && panel.kind === "payment" && panel.mode === "edit"
          ? payments.find(p => p.id === panel.id) : null;

        const panelOpen = !!panel;
        const panelTitle = !panel ? "" :
          panel.kind === "channel"
            ? (panel.mode === "new" ? "チャネルを追加" : "チャネルを編集")
            : (panel.mode === "new" ? "決済方法を追加" : "決済方法を編集");

        return (
          <React.Fragment>
            <div className="app-shell">
              <Sidebar />
              <main className="workspace">
                <div className="crumbs">
                  <span>商品管理</span>
                  <span className="sep">›</span>
                  <span className="current">チャネル・手数料設定</span>
                </div>
                <div className="page-head">
                  <div className="page-title">
                    <h1>チャネル・手数料設定</h1>
                    <span className="sub">チャネルごとの販売手数料率と、決済方法ごとの手数料を管理します。予約取込・収支計算の初期値として参照されます。</span>
                  </div>
                </div>

                <div className="tab-bar">
                  <button className={`tab-btn${tab === "channel" ? " active" : ""}`} onClick={() => { setTab("channel"); if(panel && panel.kind !== "channel") closePanel(); }}>チャネルマスター</button>
                  <button className={`tab-btn${tab === "payment" ? " active" : ""}`} onClick={() => { setTab("payment"); if(panel && panel.kind !== "payment") closePanel(); }}>決済方法マスター</button>
                </div>

                {tab === "channel" ? (
                  <section className="card">
                    <div className="card-toolbar">
                      <button className="btn primary sm" onClick={() => openPanel({kind:"channel",mode:"new"})}>＋ 新規追加</button>
                      <span className="result-count"><strong>{channels.length}</strong> 件</span>
                    </div>
                    <div className="tbl-scroll">
                      <table className="m-table" style={{minWidth:900}}>
                        <thead>
                          <tr>
                            <th>チャネル名</th>
                            <th style={{textAlign:"right"}}>手数料率</th>
                            <th>手数料種別</th>
                            <th>金額検証</th>
                            <th>検証対象</th>
                            <th>OTA管理画面</th>
                            <th>状態</th>
                            <th style={{textAlign:"right"}}>操作</th>
                          </tr>
                        </thead>
                        <tbody>
                          {sortedChannels.map(ch => (
                            <tr key={ch.id} className={ch.active ? "" : "inactive"}>
                              <td><span className="ch-name">{ch.name}</span></td>
                              <td style={{textAlign:"right"}}><span className="rate-val">{pct(ch.rate)}</span></td>
                              <td><span className={`badge${TYPE_BADGE[ch.type] ? " "+TYPE_BADGE[ch.type] : ""}`}>{ch.type}</span></td>
                              <td>{ch.verify
                                ? <span className="badge amber"><span className="dot"></span>要</span>
                                : <span className="badge muted">不要</span>}
                              </td>
                              <td>{ch.verify
                                ? <span style={{fontSize:12.5,fontWeight:600,color:"var(--ink-soft)"}}>{TARGET_LABELS[ch.target]}</span>
                                : <span className="muted-dash">—</span>}
                              </td>
                              <td>{ch.url
                                ? <a className="url-ic" href={ch.url} target="_blank" rel="noopener noreferrer" title={ch.url}>🔗</a>
                                : <span className="muted-dash">—</span>}
                              </td>
                              <td><StatusBadge active={ch.active} /></td>
                              <td style={{textAlign:"right"}}>
                                <button className="btn sm" onClick={() => openPanel({kind:"channel",mode:"edit",id:ch.id})}>編集</button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </section>
                ) : (
                  <section className="card">
                    <div className="card-toolbar">
                      <button className="btn primary sm" onClick={() => openPanel({kind:"payment",mode:"new"})}>＋ 新規追加</button>
                      <span className="result-count"><strong>{payments.length}</strong> 件</span>
                    </div>
                    <div className="tbl-scroll">
                      <table className="m-table" style={{minWidth:640}}>
                        <thead>
                          <tr>
                            <th>決済方法名</th>
                            <th style={{textAlign:"right"}}>手数料率</th>
                            <th style={{textAlign:"right"}}>固定手数料</th>
                            <th>状態</th>
                            <th style={{textAlign:"right"}}>操作</th>
                          </tr>
                        </thead>
                        <tbody>
                          {payments.map(pm => (
                            <tr key={pm.id} className={pm.active ? "" : "inactive"}>
                              <td><span className="ch-name">{pm.name}</span></td>
                              <td style={{textAlign:"right"}}><span className="rate-val">{pct(pm.rate)}</span></td>
                              <td style={{textAlign:"right"}}>{pm.fixed > 0
                                ? <span className="rate-val">{yen(pm.fixed)}<span className="fixed-sub">/取引</span></span>
                                : <span className="muted-dash">—</span>}
                              </td>
                              <td><StatusBadge active={pm.active} /></td>
                              <td style={{textAlign:"right"}}>
                                <button className="btn sm" onClick={() => openPanel({kind:"payment",mode:"edit",id:pm.id})}>編集</button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </section>
                )}
              </main>
            </div>

            {/* スライドオーバー */}
            <div className={`so-overlay${panelOpen ? " open" : ""}`} onClick={closePanel}></div>
            <aside className={`slide-over${panelOpen ? " open" : ""}`} aria-hidden={!panelOpen}>
              {panel && (
                <React.Fragment>
                  <div className="so-head">
                    <h2>{panelTitle}</h2>
                    <button className="so-close" onClick={closePanel} aria-label="閉じる">✕</button>
                  </div>
                  {panel.kind === "channel" ? (
                    <ChannelForm
                      key={`ch-${panel.mode}-${panel.id||"new"}-${panelSeed}`}
                      channel={editingChannel}
                      isNew={panel.mode === "new"}
                      onSave={saveChannel}
                      onCancel={closePanel}
                    />
                  ) : (
                    <PaymentForm
                      key={`pm-${panel.mode}-${panel.id||"new"}-${panelSeed}`}
                      payment={editingPayment}
                      isNew={panel.mode === "new"}
                      onSave={savePayment}
                      onCancel={closePanel}
                    />
                  )}
                </React.Fragment>
              )}
            </aside>

            {toast && (
              <div className="toast show">
                <span className="t-dot"></span>{toast}
              </div>
            )}
          </React.Fragment>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
