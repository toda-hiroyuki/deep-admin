    <style>
      .nav-child { padding-left: 30px !important; }
      .nav-child .nav-icon { font-size: 11px !important; opacity: 0.55; width: 18px; }
      .filter-bar { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); padding: 16px 18px; }
      .filter-grid { display: flex; flex-wrap: wrap; gap: 14px 16px; align-items: flex-end; }
      .filter-field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
      .filter-label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
      .filter-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
      .check-row { display: flex; align-items: center; gap: 16px; height: var(--field-h); }
      .check-opt { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); user-select: none; cursor: pointer; }
      .check-opt input { width: 16px; height: 16px; accent-color: var(--accent); }
      .btn-link { background: none; border: 0; color: var(--accent); font-size: 13px; font-weight: 600; padding: 0 6px; height: var(--field-h); cursor: pointer; }
      .btn-link:hover { color: var(--accent-strong); text-decoration: underline; }
      .result-meta { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--muted); padding: 0 2px; }
      .result-meta strong { color: var(--ink); font-weight: 650; }
      .cell-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
      .cell-date .time { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
      .pax { font-variant-numeric: tabular-nums; white-space: nowrap; }
      .status-pill.amber { background: var(--amber-soft); color: var(--amber); }
      .bulk-bar { display: flex; align-items: center; gap: 14px; background: var(--accent-soft); border: 1px solid #b7dcd6; border-radius: var(--radius-lg); padding: 11px 16px; box-shadow: var(--shadow-1); }
      .bulk-bar .bb-count { font-size: 13px; font-weight: 650; color: var(--accent-strong); }
      .bulk-bar .bb-count b { font-variant-numeric: tabular-nums; }
      .bulk-bar .bb-hint { font-size: 12px; color: var(--accent-strong); opacity: 0.85; }
      .bulk-bar .bb-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
      .guest-av { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; font-size: 11px; font-weight: 700; flex-shrink: 0; border: 1px solid var(--line-strong); }
      .same-flag { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; color: var(--amber); background: var(--amber-soft); padding: 1px 7px; border-radius: 4px; white-space: nowrap; margin-top: 3px; }
      .pagination { display: flex; align-items: center; justify-content: space-between; padding: 2px 2px 4px; font-size: 12.5px; color: var(--muted); }
      .page-controls { display: flex; align-items: center; gap: 4px; }
      .page-btn { min-width: 32px; height: 32px; padding: 0 8px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); font-size: 12.5px; font-weight: 600; color: var(--ink-soft); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
      .page-btn:hover:not(:disabled) { background: var(--surface-tint); border-color: var(--ink-soft); }
      .page-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
      .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(12px); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 13px; font-weight: 550; box-shadow: var(--shadow-pop); opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 60; display: flex; align-items: center; gap: 9px; }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      .toast .t-dot { width: 7px; height: 7px; border-radius: 50%; background: #5fd0c0; flex-shrink: 0; }
      .topbar-right { display: flex; align-items: center; gap: 16px; }
      .date-range { display: flex; align-items: center; gap: 7px; }
      .date-range .sep { color: var(--muted-soft); }
      .date-range .ctrl { width: 150px; }
      .sort-arrow { margin-left: 5px; color: var(--accent); font-size: 11px; }
    </style>
  </head>

      function App() {
        const [toast, setToast] = useState(null);
        const toastTimer = useRef(null);
        const [selected, setSelected] = useState([]);
        const [q, setQ] = useState("");
        const [tourQuery, setTourQuery] = useState("");
        const [from, setFrom] = useState("2026-06-15");
        const [to, setTo] = useState("");
        const [channel, setChannel] = useState("すべて");
        const [lang, setLang] = useState("すべて");
        const [stConfirm, setStConfirm] = useState(true);
        const [stPending, setStPending] = useState(true);

        const showToast = (msg) => {
          setToast(msg);
          clearTimeout(toastTimer.current);
          toastTimer.current = setTimeout(() => setToast(null), 3000);
        };

        const reset = () => {
          setQ(""); setTourQuery(""); setFrom("2026-06-15"); setTo("");
          setChannel("すべて"); setLang("すべて"); setStConfirm(true); setStPending(true);
          showToast("フィルターをリセットしました");
        };

        const allChecked = selected.length === ROWS.length && ROWS.length > 0;
        const toggleAll = () => setSelected(allChecked ? [] : ROWS.map(r => r.id));

        return (
          <div className="app-shell">
            <Sidebar resource="unassigned" />
            <main className="workspace">

                  <div style={{fontSize:12.5,color:"var(--muted)"}}>2026年6月24日</div>

              </div>

                <div className="filter-grid">
                  <div className="filter-field">
                    <span className="filter-label">予約ID / 外部予約番号</span>
                    <input className="ctrl" style={{width:210}} placeholder="BK-… / 外部番号で検索"
                      value={q} onChange={e => setQ(e.target.value)} />
                  </div>
                  <div className="filter-field">
                    <span className="filter-label">TourOption</span>
                    <input className="ctrl" style={{width:190}} placeholder="コード・名称で検索"
                      value={tourQuery} onChange={e => setTourQuery(e.target.value)} />
                  </div>
                  <div className="filter-field">
                    <span className="filter-label">ツアー日</span>
                    <div className="date-range">

                    </div>
                  </div>
                  <div className="filter-field">
                    <span className="filter-label">予約元 / チャネル</span>
                    <select className="ctrl" style={{width:180}} value={channel} onChange={e => setChannel(e.target.value)}>
                      <option>すべて</option><option>Viator</option><option>GetYourGuide</option>
                      <option>Klook</option><option>Airbnb</option><option>自社サイト</option>

                            onChange={toggleAll} style={{width:15,height:15,accentColor:"var(--accent)",cursor:"pointer"}} />

            <div className={`toast ${toast ? "show" : ""}`}>
              <span className="t-dot"></span><span>{toast}</span>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
