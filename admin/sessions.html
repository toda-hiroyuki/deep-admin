<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>催行回一覧 | deep_Admin</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="css/common.css" />
    <style>
      .nav-child { padding-left: 30px !important; }
      .nav-child .nav-icon { font-size: 11px !important; opacity: 0.55; width: 18px; }
      .filter-bar { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); padding: 16px 18px; }
      .filter-grid { display: flex; flex-wrap: wrap; gap: 14px 16px; align-items: flex-end; }
      .filter-field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
      .filter-label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
      .filter-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
      .btn-link { background: none; border: 0; color: var(--accent); font-size: 13px; font-weight: 600; padding: 0 6px; height: var(--field-h); cursor: pointer; }
      .btn-link:hover { color: var(--accent-strong); text-decoration: underline; }
      .result-meta { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--muted); padding: 0 2px; }
      .result-meta strong { color: var(--ink); font-weight: 650; }
      .cell-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
      .cell-date .time { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
      .status-pill.amber { background: var(--amber-soft); color: var(--amber); }
      .status-pill.dark { background: #5a5249; color: #fff; }
      .status-pill.coral { background: var(--coral-soft); color: var(--coral); }
      .pagination { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 4px 0 8px; }
      .page-btn { min-width: 34px; height: 34px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--ink-soft); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
      .page-btn:hover { background: var(--surface-tint); border-color: var(--ink-soft); }
      .page-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
      .page-btn.nav { font-weight: 500; color: var(--muted); }
      .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(12px); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 13px; font-weight: 550; box-shadow: var(--shadow-pop); opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 60; display: flex; align-items: center; gap: 9px; }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      .toast .t-dot { width: 7px; height: 7px; border-radius: 50%; background: #5fd0c0; }
      .topbar-right { display: flex; align-items: center; gap: 16px; }
      .top-date { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 7px; }
      .top-date .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
      .date-range { display: flex; align-items: center; gap: 7px; }
      .date-range .sep { color: var(--muted-soft); }
      .date-range .ctrl { width: 140px; }
      .sort-arrow { margin-left: 5px; color: var(--accent); font-size: 11px; }
      .ms { position: relative; }
      .ms-trigger { height: var(--field-h); min-width: 190px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); padding: 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; cursor: pointer; }
      .ms-trigger:hover { border-color: var(--ink-soft); }
      .ms-trigger.open { border-color: var(--accent); box-shadow: var(--ring); }
      .ms-count { font-size: 11px; font-weight: 700; color: var(--accent-strong); background: var(--accent-soft); border-radius: 999px; padding: 0 7px; line-height: 18px; }
      .ms-pop { position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; min-width: 100%; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: var(--shadow-pop); padding: 6px; }
      .ms-opt { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: var(--radius-sm); font-size: 13px; white-space: nowrap; cursor: pointer; }
      .ms-opt:hover { background: var(--surface-tint); }
      .ms-opt input { width: 15px; height: 15px; accent-color: var(--accent); }
      .cap { display: flex; flex-direction: column; gap: 4px; min-width: 92px; }
      .cap-top { display: flex; align-items: baseline; gap: 4px; font-variant-numeric: tabular-nums; }
      .cap-cur { font-weight: 700; color: var(--ink); font-size: 14px; }
      .cap-max { color: var(--muted); font-size: 12px; }
      .cap-bar { height: 5px; border-radius: 999px; background: var(--bg-sunken); overflow: hidden; }
      .cap-fill { height: 100%; border-radius: 999px; }
      .link-cnt { display: flex; flex-wrap: wrap; gap: 4px; }
      .cnt-chip { font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 4px; background: var(--bg-sunken); color: var(--ink-soft); white-space: nowrap; }
      .cnt-chip.fix { background: var(--green-soft); color: var(--green); }
      .cnt-chip.tmp { background: var(--amber-soft); color: var(--amber); }
      .guide-list { display: flex; flex-direction: column; gap: 4px; }
      .guide-row { display: flex; align-items: center; gap: 6px; }
      .guide-role { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
      .guide-role.main { background: var(--accent-soft); color: var(--accent-strong); }
      .guide-role.sub { background: var(--bg-sunken); color: var(--muted); }
      .guide-name { font-weight: 600; color: var(--ink); }
      .muted-dash { color: var(--muted-soft); }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <script type="text/babel" data-presets="react">
      const { useState, useRef, useEffect } = React;

      const ARRANGE_OPTIONS = ["未手配", "募集中", "アサイン済み", "一部確定", "確定済み", "要確認"];
      const SESSION_STATUS_OPTIONS = ["未催行", "Operated", "Not Operated", "Aborted", "Cancelled（中止）"];
      const LINK_OPTIONS = ["すべて", "仮紐付きのみ", "確定紐付け済みのみ"];

      const SESSION_STATUS = {
        "TI-20260525-0900-G-WAK-001-2-PR-01": { label: "Operated",          cls: "green" },
        "TI-20260526-1300-G-GIF-017-1-GR-01": { label: "Not Operated",      cls: "coral" },
        "TI-20260527-0900-G-WAK-001-2-GR-01": { label: "Aborted",           cls: "amber" },
        "TI-20260528-1000-G-AIC-005-1-GR-01": { label: "Operated",          cls: "green" },
        "TI-20260528-1400-G-GIF-017-1-GR-01": { label: "Cancelled（中止）", cls: "dark" },
        "TI-20260612-0900-G-AIC-005-1-PR-01": { label: "未催行",            cls: "muted" },
        "TI-20260614-0900-G-MIE-005-1-GR-01": { label: "未催行",            cls: "muted" },
      };

      const ROWS = [
        { id: "TI-20260525-0900-G-WAK-001-2-PR-01", date: "2026-05-25", time: "09:00", code: "G-WAK-001-2-PR", tour: "里山ハイキング",
          cur: 6, max: 8, links: [{ t: "確定", n: 1 }], arrange: { label: "確定済み", cls: "green" },
          guides: { main: { name: "田中 誠", id: "G-003" }, subs: [] } },
        { id: "TI-20260526-1300-G-GIF-017-1-GR-01", date: "2026-05-26", time: "13:00", code: "G-GIF-017-1-GR", tour: "城下町ウォーキング",
          cur: 2, max: 6, links: [{ t: "確定", n: 1 }], arrange: { label: "確定済み", cls: "green" },
          guides: { main: { name: "吉田 健太", id: "G-007" }, subs: [] } },
        { id: "TI-20260527-0900-G-WAK-001-2-GR-01", date: "2026-05-27", time: "09:00", code: "G-WAK-001-2-GR", tour: "里山ハイキング",
          cur: 4, max: 8, links: [{ t: "確定", n: 2 }], arrange: { label: "確定済み", cls: "green" },
          guides: { main: { name: "田中 誠", id: "G-003" }, subs: [{ name: "高橋 一郎", id: "G-011" }] } },
        { id: "TI-20260528-1000-G-AIC-005-1-GR-01", date: "2026-05-28", time: "10:00", code: "G-AIC-005-1-GR", tour: "茶道体験",
          cur: 8, max: 10, links: [{ t: "確定", n: 2 }], arrange: { label: "確定済み", cls: "green" },
          guides: { main: { name: "佐々木 美咲", id: "G-012" }, subs: [{ name: "山下 真也", id: "G-009" }] } },
        { id: "TI-20260528-1400-G-GIF-017-1-GR-01", date: "2026-05-28", time: "14:00", code: "G-GIF-017-1-GR", tour: "城下町ウォーキング",
          cur: 1, max: 6, links: [{ t: "仮", n: 1 }], arrange: { label: "未手配", cls: "muted" },
          guides: { main: null, subs: [] } },
        { id: "TI-20260612-0900-G-AIC-005-1-PR-01", date: "2026-06-12", time: "09:00", code: "G-AIC-005-1-PR", tour: "茶道体験",
          cur: 3, max: 6, links: [{ t: "確定", n: 1 }], arrange: { label: "募集中", cls: "blue" },
          guides: { main: null, subs: [] } },
        { id: "TI-20260614-0900-G-MIE-005-1-GR-01", date: "2026-06-14", time: "09:00", code: "G-MIE-005-1-GR", tour: "漁村体験",
          cur: 4, max: 6, links: [{ t: "確定", n: 2 }], arrange: { label: "要確認", cls: "amber" },
          guides: { main: { name: "中村 大輔", id: "G-005" }, subs: [] } },
      ];

      function Caret() {
        return (
          <svg width="12" height="12" viewBox="0 0 12 12" style={{color:"var(--muted)"}}>
            <path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" />
          </svg>
        );
      }

      function MultiSelect({ options, selected, onToggle }) {
        const [open, setOpen] = useState(false);
        const ref = useRef(null);
        useEffect(() => {
          if (!open) return;
          const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
          document.addEventListener("mousedown", onDoc);
          return () => document.removeEventListener("mousedown", onDoc);
        }, [open]);
        const label = selected.length === 0 ? "すべて" : selected.length === options.length ? "すべて選択中" : selected.join(" / ");
        return (
          <div className="ms" ref={ref}>
            <button type="button" className={`ms-trigger ${open ? "open" : ""}`} onClick={() => setOpen(o => !o)}>
              <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{label}</span>
              <span style={{display:"flex",alignItems:"center",gap:7,flexShrink:0}}>
                {selected.length > 0 && <span className="ms-count">{selected.length}</span>}
                <Caret />
              </span>
            </button>
            {open && (
              <div className="ms-pop">
                {options.map(o => (
                  <label key={o} className="ms-opt">
                    <input type="checkbox" checked={selected.includes(o)} onChange={() => onToggle(o)} />
                    <span>{o}</span>
                  </label>
                ))}
              </div>
            )}
          </div>
        );
      }

      function CapGauge({ cur, max, code }) {
        const pct = Math.round((cur / max) * 100);
        const isGroup = /-GR(-|$)/.test(code || "") || /GR$/.test(code || "");
        let color;
        if (isGroup) {
          color = pct < 40 ? "#f59e0b" : pct <= 70 ? "#0a5e5a" : "#065f46";
        } else {
          color = "#0a5e5a";
        }
        return (
          <div className="cap">
            <div className="cap-top">
              <span className="cap-cur">{cur}</span>
              <span className="cap-max">/ {max}名</span>
            </div>
            <div className="cap-bar"><div className="cap-fill" style={{ width: pct + "%", background: color }}></div></div>
          </div>
        );
      }

      function Sidebar({ resource }) {
        const opsItems = [
          { key: "bookings",      href: "bookings.html",       icon: "BK", label: "予約一覧" },
          { key: "unassigned",    href: "unassigned.html",     icon: "↳",  label: "未割り当て一覧", child: true },
          { key: "sessions",      href: "sessions.html",       icon: "SS", label: "催行回一覧" },
          { key: "unarranged",    href: "unarranged.html",     icon: "↳",  label: "未手配一覧", child: true },
          { key: "todayTomorrow", href: "today-tomorrow.html", icon: "↳",  label: "当日/翌日案件", child: true },
        ];
        const payItems = [
          { key: "settlement", href: "monthly-settlement.html",  icon: "ST", label: "月次締め確認" },
          { key: "ota",        href: "ota-payment-matching.html",icon: "OT", label: "OTA入金照合" },
          { key: "revenue",    href: "revenue-summary.html",     icon: "RV", label: "収支一覧" },
        ];
        const guideItems = [{ key: "guides", href: "guides.html", icon: "GM", label: "ガイド一覧" }];
        const facilityItems = [{ key: "facility", href: "facilities.html", icon: "FC", label: "施設一覧" }];
        const masterMainItems = [
          { key: "tourOption",  href: "tour-options.html", icon: "TO", label: "TourOption" },
          { key: "productPage", href: "products.html",     icon: "PG", label: "商品ページ" },
        ];
        const masterSubItems = [
          { key: "resource",       href: "resources.html",       icon: "RS", label: "リソース管理" },
          { key: "area",           href: "areas.html",           icon: "AR", label: "エリア管理" },
          { key: "language",       href: "languages.html",       icon: "LG", label: "言語マスター管理" },
          { key: "guideDoc",       href: "guide-materials.html", icon: "GD", label: "ガイド資料" },
          { key: "cancelTemplate", href: "cancel-policies.html", icon: "CP", label: "キャンセルポリシー" },
          { key: "channelFee",     href: "channel-fees.html",    icon: "FE", label: "チャネル・手数料設定" },
        ];
        const navLink = (it) => (
          <a key={it.key} href={it.href}
            className={`nav-item ${resource === it.key ? "active" : ""}${it.child ? " nav-child" : ""}`}
            style={{textDecoration:"none"}}>
            <span className="nav-icon">{it.icon}</span>
            <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
          </a>
        );
        return (
          <aside className="side-nav">
            <div className="brand-block">
              <div className="brand-mark">d.</div>
              <div>
                <div className="brand-name">deep_Admin</div>
                <div className="brand-caption">Product &amp; Sales · Phase 1</div>
              </div>
            </div>
            <div className="nav-group" style={{marginBottom:"8px"}}>
              <a href="index.html" className={`nav-item ${resource === "dashboard" ? "active" : ""}`} style={{textDecoration:"none"}}>
                <span className="nav-icon">⊞</span><span style={{flex:1,minWidth:0}}><div>ダッシュボード</div></span>
              </a>
            </div>
            <div>
              <div className="nav-section-label">予約オペレーション</div>
              <div className="nav-group">{opsItems.map(navLink)}</div>
            </div>
            <div>
              <div className="nav-section-label">精算・経営</div>
              <div className="nav-group">{payItems.map(navLink)}</div>
            </div>
            <div>
              <div className="nav-section-label">ガイド管理</div>
              <div className="nav-group">{guideItems.map(navLink)}</div>
            </div>
            <div>
              <div className="nav-section-label">施設管理</div>
              <div className="nav-group">{facilityItems.map(navLink)}</div>
            </div>
            <div>
              <div className="nav-section-label">商品管理</div>
              <div className="nav-group" style={{marginBottom:"4px"}}>{masterMainItems.map(navLink)}</div>
              <div className="nav-section-label" style={{marginTop:"8px",opacity:0.6}}>マスター</div>
              <div className="nav-group">{masterSubItems.map(navLink)}</div>
            </div>
            <div className="sidebar-footer">
              <a href="#" className="nav-logout">ログアウト</a>
            </div>
          </aside>
        );
      }

      function App() {
        const [sessionIdQuery, setSessionIdQuery] = useState("");
        const [bookingIdQuery, setBookingIdQuery] = useState("");
        const [statusSel, setStatusSel] = useState([]);
        const [sessSel, setSessSel] = useState([]);
        const [guideQuery, setGuideQuery] = useState("");
        const [from, setFrom] = useState("2026-05-25");
        const [to, setTo] = useState("2026-06-30");
        const [tourQuery, setTourQuery] = useState("");
        const [linkFilter, setLinkFilter] = useState("すべて");
        const [sortDir, setSortDir] = useState("asc");
        const [toast, setToast] = useState(null);
        const toastTimer = useRef(null);

        const showToast = (msg) => {
          setToast(msg);
          clearTimeout(toastTimer.current);
          toastTimer.current = setTimeout(() => setToast(null), 2200);
        };

        const toggleStatus = (o) => setStatusSel(s => s.includes(o) ? s.filter(x => x !== o) : [...s, o]);
        const toggleSess = (o) => setSessSel(s => s.includes(o) ? s.filter(x => x !== o) : [...s, o]);
        const toggleSort = () => setSortDir(d => (d === "asc" ? "desc" : "asc"));

        const reset = () => {
          setStatusSel([]); setFrom("2026-05-25"); setTo("2026-06-30");
          setTourQuery(""); setLinkFilter("すべて");
          setSessionIdQuery(""); setBookingIdQuery(""); setSessSel([]); setGuideQuery("");
          showToast("フィルターをリセットしました");
        };

        const sessLabel = (r) => (SESSION_STATUS[r.id] || {}).label || "未催行";

        const rows = [...ROWS]
          .filter(r => {
            if (sessionIdQuery && !r.id.toLowerCase().includes(sessionIdQuery.toLowerCase())) return false;
            if (from && r.date < from) return false;
            if (to && r.date > to) return false;
            if (tourQuery) {
              const q = tourQuery.toLowerCase();
              if (!r.code.toLowerCase().includes(q) && !r.tour.toLowerCase().includes(q)) return false;
            }
            if (sessSel.length > 0 && !sessSel.includes(sessLabel(r))) return false;
            if (guideQuery) {
              const q = guideQuery.toLowerCase();
              const names = [
                r.guides.main ? r.guides.main.name + " " + r.guides.main.id : "",
                ...r.guides.subs.map(s => s.name + " " + s.id),
              ].join(" ").toLowerCase();
              if (!names.includes(q)) return false;
            }
            if (statusSel.length > 0 && !statusSel.includes(r.arrange.label)) return false;
            if (linkFilter === "仮紐付きのみ" && !r.links.some(l => l.t === "仮")) return false;
            if (linkFilter === "確定紐付け済みのみ" && !r.links.some(l => l.t === "確定")) return false;
            return true;
          })
          .sort((a, b) => {
            const av = a.date + a.time, bv = b.date + b.time;
            return sortDir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
          });

        return (
          <div className="app-shell">
            <Sidebar resource="sessions" />
            <main className="workspace">
              <div className="topbar">
                <div>
                  <div className="crumbs">予約オペレーション</div>
                  <h1>催行回一覧</h1>
                </div>
                <div className="topbar-right">
                  <div className="top-date"><span className="dot"></span>2026年6月24日</div>
                  <div className="avatar">OP</div>
                </div>
              </div>

              <div className="filter-bar">
                <div className="filter-grid">
                  <div className="filter-field">
                    <span className="filter-label">催行回ID</span>
                    <input className="ctrl" style={{width:220}} placeholder="例：TI-20260530-0900-..."
                      value={sessionIdQuery} onChange={e => setSessionIdQuery(e.target.value)} />
                  </div>
                  <div className="filter-field">
                    <span className="filter-label">予約ID / 外部予約番号</span>
                    <input className="ctrl" style={{width:200}} placeholder="例：BK-260529-00001"
                      value={bookingIdQuery} onChange={e => setBookingIdQuery(e.target.value)} />
                  </div>
                  <div className="filter-field">
                    <span className="filter-label">ツアー日</span>
                    <div className="date-range">
                      <input type="date" className="ctrl" value={from} onChange={e => setFrom(e.target.value)} />
                      <span className="sep">〜</span>
                      <input type="date" className="ctrl" value={to} onChange={e => setTo(e.target.value)} />
                    </div>
                  </div>
                  <div className="filter-field">
                    <span className="filter-label">TourOption</span>
                    <input className="ctrl" style={{width:200}} placeholder="コード・名称で検索"
                      value={tourQuery} onChange={e => setTourQuery(e.target.value)} />
                  </div>
                  <div className="filter-field">
                    <span className="filter-label">催行ステータス</span>
                    <MultiSelect options={SESSION_STATUS_OPTIONS} selected={sessSel} onToggle={toggleSess} />
                  </div>
                  <div className="filter-field">
                    <span className="filter-label">担当ガイド</span>
                    <input className="ctrl" style={{width:180}} placeholder="ガイド名またはコード"
                      value={guideQuery} onChange={e => setGuideQuery(e.target.value)} />
                  </div>
                  <div className="filter-field">
                    <span className="filter-label">手配状況</span>
                    <MultiSelect options={ARRANGE_OPTIONS} selected={statusSel} onToggle={toggleStatus} />
                  </div>
                  <div className="filter-field">
                    <span className="filter-label">催行回紐付け</span>
                    <select className="ctrl" style={{width:180}} value={linkFilter} onChange={e => setLinkFilter(e.target.value)}>
                      {LINK_OPTIONS.map(o => <option key={o} value={o}>{o}</option>)}
                    </select>
                  </div>
                  <div className="filter-actions">
                    <button className="btn-link" onClick={reset}>リセット</button>
                    <button className="btn primary" onClick={() => showToast("絞り込みを適用しました")}>絞り込む</button>
                  </div>
                </div>
              </div>

              <div className="result-meta">
                <span>
                  <strong>{rows.length}</strong>件
                  {rows.length < ROWS.length && <span>（全{ROWS.length}件中）</span>}
                </span>
                <span>ツアー日時 {sortDir === "asc" ? "昇順" : "降順"}で表示中</span>
              </div>

              <div className="table-wrap">
                <div className="table-scroll">
                  <table>
                    <thead>
                      <tr>
                        <th>催行回ID</th>
                        <th className="sortable" style={{cursor:"pointer"}} onClick={toggleSort}>
                          ツアー日時<span className="sort-arrow">{sortDir === "asc" ? "↑" : "↓"}</span>
                        </th>
                        <th>TourOption</th>
                        <th>現在人数/定員</th>
                        <th>紐付き予約数</th>
                        <th>催行ステータス</th>
                        <th>手配状況</th>
                        <th>担当ガイド名</th>
                      </tr>
                    </thead>
                    <tbody>
                      {rows.length === 0 && (
                        <tr><td colSpan="8" style={{textAlign:"center",padding:"40px 14px",color:"var(--muted)"}}>条件に一致する催行回がありません</td></tr>
                      )}
                      {rows.map(r => (
                        <tr key={r.id} style={{cursor:"pointer"}} onClick={() => showToast("催行回詳細へ移動します")}>
                          <td><span className="code-mono">{r.id}</span></td>
                          <td className="cell-date">
                            <div>{r.date.replace(/-/g, "/")}</div>
                            <div className="time">{r.time}</div>
                          </td>
                          <td>
                            <div className="code-mono">{r.code}</div>
                            <div className="cell-sub">{r.tour}</div>
                          </td>
                          <td><CapGauge cur={r.cur} max={r.max} code={r.code} /></td>
                          <td>
                            <div className="link-cnt">
                              {r.links.map((l, i) => (
                                <span key={i} className={`cnt-chip ${l.t === "確定" ? "fix" : "tmp"}`}>{l.t}{l.n}件</span>
                              ))}
                            </div>
                          </td>
                          <td>
                            <span className={`status-pill ${(SESSION_STATUS[r.id] || {}).cls || "muted"}`}>
                              <span className="dot"></span>{(SESSION_STATUS[r.id] || {}).label || "—"}
                            </span>
                          </td>
                          <td><span className={`status-pill ${r.arrange.cls}`}><span className="dot"></span>{r.arrange.label}</span></td>
                          <td>
                            {r.guides.main || r.guides.subs.length > 0 ? (
                              <div className="guide-list">
                                {r.guides.main && (
                                  <div className="guide-row">
                                    <span className="guide-role main">メイン</span>
                                    <span className="code-mono">{r.guides.main.id}</span>
                                    <span className="guide-name">{r.guides.main.name}</span>
                                  </div>
                                )}
                                {r.guides.subs.map((s, i) => (
                                  <div className="guide-row" key={i}>
                                    <span className="guide-role sub">サブ</span>
                                    <span className="code-mono">{s.id}</span>
                                    <span className="guide-name">{s.name}</span>
                                  </div>
                                ))}
                              </div>
                            ) : <span className="muted-dash">—</span>}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              <div className="pagination">
                <button className="page-btn nav" onClick={() => showToast("前のページはありません")}>← 前へ</button>
                <button className="page-btn active">1</button>
                <button className="page-btn" onClick={() => showToast("2ページ目へ")}>2</button>
                <button className="page-btn" onClick={() => showToast("3ページ目へ")}>3</button>
                <button className="page-btn nav" onClick={() => showToast("2ページ目へ")}>次へ →</button>
              </div>
            </main>

            <div className={`toast ${toast ? "show" : ""}`}>
              <span className="t-dot"></span>{toast}
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
