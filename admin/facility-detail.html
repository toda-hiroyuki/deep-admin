// ── SectionHead ───────────────────────────────────────────────────────────────
function SectionHead({ title, desc }) {
  return (
    <div className="section-title">
      <div>
        <h2>{title}</h2>
        {desc && <p>{desc}</p>}
      </div>
    </div>
  );
}

// ── Field ─────────────────────────────────────────────────────────────────────
function Field({ label, required, value, onChange, placeholder, multiline, wide, help, rows = 3 }) {
  const cls = wide ? "field-wide" : "field";
  return (
    <div className={cls}>
      <label className="field-label">
        {required && <span className="req" />}
        <span>{label}</span>
        {!required && <span className="opt">任意</span>}
      </label>
      {multiline
        ? <textarea value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder || ""} rows={rows} />
        : <input type="text" value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder || ""} />
      }
      {help && <div className="field-help">{help}</div>}
    </div>
  );
}

// ── SelectField ───────────────────────────────────────────────────────────────
function SelectField({ label, required, value, onChange, options, wide, help }) {
  const cls = wide ? "field-wide" : "field";
  return (
    <div className={cls}>
      <label className="field-label">
        {required && <span className="req" />}
        <span>{label}</span>
        {!required && <span className="opt">任意</span>}
      </label>
      <select value={value} onChange={e => onChange(e.target.value)}>
        {options.map(o => <option key={o} value={o}>{o}</option>)}
      </select>
      {help && <div className="field-help">{help}</div>}
    </div>
  );
}

// ── Tab: 経費項目管理 ─────────────────────────────────────────────────────────
function CostItemsTab({ costs, facilityId }) {
  const params = new URLSearchParams(window.location.search);
  const fid = facilityId || params.get("id") || "";

  return (
    <div className="editor-content">
      <div className="form-section">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <SectionHead title="経費項目一覧" desc="この施設に関連する経費項目を管理します。" />
          <a href={`facility-cost-detail.html?facilityId=${fid}&mode=create`} className="btn primary">＋ 経費項目を追加</a>
        </div>

        {costs.length === 0 ? (
          <div style={{padding:'32px 0',textAlign:'center',color:'var(--muted)',fontSize:13,border:'1px dashed var(--line)',borderRadius:'var(--radius-lg)'}}>
            経費項目が登録されていません
          </div>
        ) : (
          <div className="list-table-wrap">
            <table className="list-table">
              <thead>
                <tr>
                  <th>経費項目名</th>
                  <th style={{width:130}}>費用区分</th>
                  <th style={{width:160}}>金額</th>
                  <th>支払区分</th>
                  <th className="actions" style={{width:72}}></th>
                </tr>
              </thead>
              <tbody>
                {costs.map(c => (
                  <tr key={c.id} className="list-row" onClick={() => { window.location.href = `facility-cost-detail.html?facilityId=${fid}&id=${c.id}`; }}>
                    <td style={{fontWeight:600}}>{c.name}</td>
                    <td style={{fontSize:12,color:'var(--muted)'}}>
                      {COST_TYPE_LABELS[c.costType] || c.costType}
                    </td>
                    <td>
                      {(c.costType==="fixed"||c.costType==="per-person") && (
                        <span style={{fontWeight:600}}>¥{Number(c.unitPrice).toLocaleString()}
                          <span style={{fontSize:11,color:'var(--muted)',fontWeight:400,marginLeft:4}}>{c.costType==="fixed"?"/ 1催行":"/ 1名"}</span>
                        </span>
                      )}
                      {c.costType==="slide" && <span style={{fontSize:12,color:'var(--muted)'}}>スライド</span>}
                      {c.costType==="full-var" && <span style={{fontSize:12,color:'var(--amber)'}}>毎回手動</span>}
                    </td>
                    <td style={{fontSize:12,color:'var(--muted)'}}>
                      {PAYMENT_TYPE_LABELS[c.paymentType] || c.paymentType}
                    </td>
                    <td className="actions">
                      <a href={`facility-cost-detail.html?facilityId=${fid}&id=${c.id}`} className="btn sm" onClick={e => e.stopPropagation()}>編集</a>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

            <div className="tab-row" role="tablist">
              {TABS.map(([key, label], i) => (
                <button key={key} className={`tab-button ${tab === key ? "active" : ""}`} onClick={() => setTab(key)}>
                  <span style={{opacity:0.55,fontVariantNumeric:'tabular-nums',marginRight:6,fontSize:11.5}}>{String(i+1).padStart(2,'0')}</span>
                  {label}
                </button>
              ))}
            </div>

            {tab === "basic" && <BasicInfoTab form={form} upd={upd} />}
            {tab === "costs" && <CostItemsTab costs={costs} facilityId={facilityId} />}
          </section>
        </div>

      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
