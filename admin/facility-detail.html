<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>施設詳細 | deep_Admin</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="css/common.css">
  </head>
  <body data-density="regular" data-side="default">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <script src="js/master-data.js"></script>
    <script type="text/babel" data-presets="react">
const { useState } = React;

const FACILITY_CATEGORIES = ["体験施設", "観光スポット", "飲食施設", "宿泊施設", "移動施設", "その他"];
const PREFECTURES = ["大阪府","京都府","奈良県","兵庫県","滋賀県","和歌山県","三重県","東京都","神奈川県","愛知県","福岡県","北海道","沖縄県"];
const PAYMENT_TYPES = [
  "A：施設へ月末一括（会社払い）",
  "B：施設へ都度払い（会社払い）",
  "C：ガイドが現地立替（後日精算）",
  "D：お客様が現地直接払い",
];
const TABS = [
  ["basic", "基本情報"],
  ["costs", "経費項目管理"],
];

const SEED = {
  "fac-1": {
    id: "fac-1", name: "嵐山竹林体験センター", category: "体験施設",
    prefecture: "京都府", address: "京都市右京区嵯峨天龍寺芒ノ馬場町",
    phone: "075-XXX-XXXX", email: "info@arashiyama-example.com", contact: "山田 太郎",
    paymentType: "A：施設へ月末一括（会社払い）",
    notes: "竹林内の体験エリアは雨天中止。要事前確認。",
    status: "有効",
    costs: [
      { id: "c1", name: "入場料（大人）", unitPrice: 1500, unit: "人", paymentType: "A：施設へ月末一括（会社払い）" },
      { id: "c2", name: "竹細工体験料",  unitPrice: 2000, unit: "人", paymentType: "A：施設へ月末一括（会社払い）" },
      { id: "c3", name: "着物レンタル",  unitPrice: 3500, unit: "人", paymentType: "C：ガイドが現地立替（後日精算）" },
    ],
  },
};

// ── Sidebar ──────────────────────────────────────────────────────────────────
function Sidebar() {
  const items = [
    { key: "dashboard",      href: "index.html",           icon: "⊞", label: "ダッシュボード" },
    { key: "tourOption",     href: "tour-options.html",    icon: "TO", label: "TourOption",        hint: "ツアーの実体" },
    { key: "productPage",    href: "products.html",        icon: "PG", label: "商品ページ",           hint: "顧客表示" },
    { key: "resource",       href: "resources.html",       icon: "RS", label: "リソース管理",          hint: "機材・車両等" },
    { key: "area",           href: "areas.html",           icon: "AR", label: "エリア管理",           hint: "都道府県・エリア" },
    { key: "facility",       href: "facilities.html",      icon: "FC", label: "施設管理",             hint: "体験施設・観光スポット" },
    { key: "language",       href: "languages.html",       icon: "LG", label: "言語マスター管理",     hint: "対応言語" },
    { key: "guideDoc",       href: "guide-materials.html", icon: "GD", label: "ガイド資料",           hint: "運営注意・行程" },
    { key: "cancelTemplate", href: "cancel-policies.html", icon: "CP", label: "キャンセルポリシー",   hint: "キャンセル文言" },
  ];
  return (
    <aside className="side-nav">
      <div className="brand-block">
        <div className="brand-mark">d.</div>
        <div>
          <div className="brand-name">deep_Admin</div>
          <div className="brand-caption">Product &amp; Sales · Phase 1</div>
        </div>
      </div>
      <div>
        <div className="nav-section-label">Manage</div>
        <div className="nav-group">
          {items.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${it.key === "facility" ? "active" : ""}`}
              style={{textDecoration:"none"}}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
            </a>
          ))}
        </div>
      </div>
    </aside>
  );
}

// ── SectionHead ───────────────────────────────────────────────────────────────
function SectionHead({ title, desc }) {
  return (
    <div className="section-title">
      <div>
        <h2>{title}</h2>
        {desc && <p>{desc}</p>}
      </div>
    </div>
  );
}

// ── Field ─────────────────────────────────────────────────────────────────────
function Field({ label, required, value, onChange, placeholder, multiline, wide, help, rows = 3 }) {
  const cls = wide ? "field-wide" : "field";
  return (
    <div className={cls}>
      <label className="field-label">
        {required && <span className="req" />}
        <span>{label}</span>
        {!required && <span className="opt">任意</span>}
      </label>
      {multiline
        ? <textarea value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder || ""} rows={rows} />
        : <input type="text" value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder || ""} />
      }
      {help && <div className="field-help">{help}</div>}
    </div>
  );
}

// ── SelectField ───────────────────────────────────────────────────────────────
function SelectField({ label, required, value, onChange, options, wide, help }) {
  const cls = wide ? "field-wide" : "field";
  return (
    <div className={cls}>
      <label className="field-label">
        {required && <span className="req" />}
        <span>{label}</span>
        {!required && <span className="opt">任意</span>}
      </label>
      <select value={value} onChange={e => onChange(e.target.value)}>
        {options.map(o => <option key={o} value={o}>{o}</option>)}
      </select>
      {help && <div className="field-help">{help}</div>}
    </div>
  );
}

// ── Tab: 基本情報 ─────────────────────────────────────────────────────────────
function BasicInfoTab({ form, upd }) {
  return (
    <div className="editor-content">
      <div className="form-section">
        <SectionHead title="施設情報" desc="施設の基本情報を入力してください。" />

        <Field label="施設名" required value={form.name} onChange={v => upd("name", v)} placeholder="例：嵐山竹林体験センター" />

        <SelectField label="カテゴリ" required value={form.category} onChange={v => upd("category", v)} options={FACILITY_CATEGORIES} />
      </div>

      <div className="form-section" style={{marginTop:'var(--sp-5)'}}>
        <SectionHead title="所在地" />

        <div className="field-grid">
          <SelectField label="都道府県" required value={form.prefecture} onChange={v => upd("prefecture", v)} options={PREFECTURES} />
          <div />
        </div>

        <Field label="住所（市区町村以降）" required value={form.address} onChange={v => upd("address", v)} placeholder="例：右京区嵯峨天龍寺芒ノ馬場町" wide />
      </div>

      <div className="form-section" style={{marginTop:'var(--sp-5)'}}>
        <SectionHead title="連絡先" />

        <div className="field-grid">
          <Field label="連絡先電話番号" value={form.phone} onChange={v => upd("phone", v)} placeholder="例：075-000-0000" />
          <Field label="連絡先メールアドレス" value={form.email} onChange={v => upd("email", v)} placeholder="例：info@example.com" />
        </div>

        <div className="field-grid">
          <Field label="担当者名" value={form.contact} onChange={v => upd("contact", v)} placeholder="例：山田 太郎" />
          <div />
        </div>
      </div>

      <div className="form-section" style={{marginTop:'var(--sp-5)'}}>
        <SectionHead title="経費設定" />

        <SelectField
          label="支払区分（デフォルト）"
          value={form.paymentType}
          onChange={v => upd("paymentType", v)}
          options={PAYMENT_TYPES}
          wide
          help="経費項目ごとに個別設定も可能です"
        />
      </div>

      <div className="form-section" style={{marginTop:'var(--sp-5)'}}>
        <SectionHead title="その他" />

        <Field label="備考" value={form.notes} onChange={v => upd("notes", v)} placeholder="運営メモ・注意事項など" multiline wide rows={4} />
      </div>
    </div>
  );
}

// ── Tab: 経費項目管理 ─────────────────────────────────────────────────────────
function CostItemsTab({ costs, setCosts }) {
  const add = () => setCosts(cs => [...cs, { id: `c${Date.now()}`, name: "", unitPrice: 0, unit: "人", paymentType: PAYMENT_TYPES[0] }]);
  const remove = id => setCosts(cs => cs.filter(c => c.id !== id));
  const upd = (id, k, v) => setCosts(cs => cs.map(c => c.id === id ? { ...c, [k]: v } : c));

  return (
    <div className="editor-content">
      <div className="form-section">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <SectionHead title="経費項目一覧" desc="この施設に関連する経費項目を管理します。" />
          <button className="btn primary" onClick={add} style={{alignSelf:'flex-start',marginTop:2}}>＋ 経費項目を追加</button>
        </div>

        {costs.length === 0 ? (
          <div style={{padding:'32px 0',textAlign:'center',color:'var(--muted)',fontSize:13,border:'1px dashed var(--line)',borderRadius:'var(--radius-lg)'}}>
            経費項目が登録されていません
          </div>
        ) : (
          <div className="list-table-wrap">
            <table className="list-table">
              <thead>
                <tr>
                  <th>経費項目名</th>
                  <th style={{width:120,textAlign:'right'}}>単価（円）</th>
                  <th style={{width:90,textAlign:'center'}}>単位</th>
                  <th>支払区分</th>
                  <th style={{width:48}}></th>
                </tr>
              </thead>
              <tbody>
                {costs.map(c => (
                  <tr key={c.id}>
                    <td>
                      <input type="text" value={c.name} onChange={e => upd(c.id,"name",e.target.value)} placeholder="例：入場料（大人）" />
                    </td>
                    <td>
                      <input type="number" min="0" value={c.unitPrice} onChange={e => upd(c.id,"unitPrice",Number(e.target.value))} style={{textAlign:'right'}} />
                    </td>
                    <td>
                      <select value={c.unit} onChange={e => upd(c.id,"unit",e.target.value)}>
                        {["人","回","式","時間","日"].map(u => <option key={u}>{u}</option>)}
                      </select>
                    </td>
                    <td>
                      <select value={c.paymentType} onChange={e => upd(c.id,"paymentType",e.target.value)}>
                        {PAYMENT_TYPES.map(p => <option key={p}>{p}</option>)}
                      </select>
                    </td>
                    <td style={{textAlign:'center'}}>
                      <button onClick={() => remove(c.id)} className="btn sm danger">✕</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

// ── App ──────────────────────────────────────────────────────────────────────
function App() {
  const params     = new URLSearchParams(window.location.search);
  const facilityId = params.get("id");
  const isCreate   = params.get("mode") === "create" || !facilityId;
  const seed       = isCreate ? null : (SEED[facilityId] || null);

  const [form, setForm] = useState(seed || {
    id: "", name: "", category: "体験施設",
    prefecture: "大阪府", address: "",
    phone: "", email: "", contact: "",
    paymentType: PAYMENT_TYPES[0],
    notes: "", status: "有効",
  });
  const [costs, setCosts] = useState(seed ? seed.costs : []);
  const [tab,   setTab]   = useState("basic");
  const [saved, setSaved] = useState(false);

  const upd = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const handleSave = () => {
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  return (
    <div className="app-shell">
      <Sidebar />
      <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0,overflowY:'auto'}}>

        {/* Topbar */}
        <div className="topbar" style={{padding:'0 var(--sp-5)',borderBottom:'1px solid var(--line)',height:52,flexShrink:0}}>
          <div>
            <div className="crumbs">
              <a href="index.html" className="crumb-link">deep_Admin</a>
              <span className="sep">/</span>
              <a href="facilities.html" className="crumb-link">施設管理</a>
              <span className="sep">/</span>
              <span className="current">{isCreate ? "新規追加" : form.name}</span>
            </div>
            <div className="title-row">
              <button className="btn ghost sm back-btn" onClick={() => { window.location.href = 'facilities.html'; }}>← 一覧に戻る</button>
              <h1>施設 作成・編集・確認</h1>
            </div>
          </div>
        </div>

        {/* Status strip */}
        <div className="status-strip">
          <div className="status-cell">
            <span className="status-label">施設名</span>
            <strong>{form.name || "—"}</strong>
          </div>
          <div className="status-cell">
            <span className="status-label">カテゴリ</span>
            <strong>{form.category || "—"}</strong>
          </div>
          <div className="status-cell">
            <span className="status-label">都道府県</span>
            <strong>{form.prefecture || "—"}</strong>
          </div>
          <div className="status-actions">
            <div style={{position:"relative",display:"inline-flex",alignItems:"center",marginRight:4}}>
              <select
                style={{width:"auto",height:"var(--field-h)",paddingLeft:8,paddingRight:28,border:"1px solid var(--line-strong)",borderRadius:"var(--radius)",background:"var(--surface)",fontSize:13,appearance:"none",WebkitAppearance:"none",cursor:"pointer"}}
                value={form.status}
                onChange={e => upd("status", e.target.value)}
              >
                <option value="有効">有効</option>
                <option value="無効">無効</option>
              </select>
              <span style={{position:"absolute",right:8,pointerEvents:"none",fontSize:10,color:"var(--muted)"}}>▼</span>
            </div>
            <button className="btn primary" onClick={handleSave}>
              {saved ? "✓ 保存しました" : "更新保存"}
            </button>
          </div>
        </div>

        {/* Editor pane */}
        <div className="content-grid" data-no-preview="true" style={{padding:'var(--sp-5)'}}>
          <section className="editor-pane">
            <div className="tab-row" role="tablist">
              {TABS.map(([key, label], i) => (
                <button key={key} className={`tab-button ${tab === key ? "active" : ""}`} onClick={() => setTab(key)}>
                  <span style={{opacity:0.55,fontVariantNumeric:'tabular-nums',marginRight:6,fontSize:11.5}}>{String(i+1).padStart(2,'0')}</span>
                  {label}
                </button>
              ))}
            </div>

            {tab === "basic" && <BasicInfoTab form={form} upd={upd} />}
            {tab === "costs" && <CostItemsTab costs={costs} setCosts={setCosts} />}
          </section>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
