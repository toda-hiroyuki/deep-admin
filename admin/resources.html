<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>リソース管理 | deep_Admin</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="css/common.css">
</head>
  <body data-density="regular" data-side="default">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <script src="js/master-data.js"></script>
    <script type="text/babel" data-presets="react">
const { useState } = React;

// ── Sidebar ─────────────────────────────────────────────────────────────────
function Sidebar({ resource, counts = {} }) {
  const payItems = [
    { key: "settle",   href: "monthly-settlement.html",   icon: "ST", label: "月次締め確認" },
    { key: "ota",      href: "ota-payment-matching.html", icon: "OT", label: "OTA入金照合" },
    { key: "revenue",  href: "revenue-summary.html",      icon: "RV", label: "収支一覧" },
  ];
  const masterItems = [
    { key: "tourOption",     href: "tour-options.html",    icon: "TO", label: "TourOption",       count: counts.to },
    { key: "productPage",    href: "products.html",        icon: "PG", label: "商品ページ",          count: counts.pg },
    { key: "resource",       href: "resources.html",       icon: "RS", label: "リソース管理" },
    { key: "area",           href: "areas.html",           icon: "AR", label: "エリア管理" },
    { key: "facility",       href: "facilities.html",      icon: "FC", label: "施設管理" },
    { key: "language",       href: "languages.html",       icon: "LG", label: "言語マスター管理" },
    { key: "guideDoc",       href: "guide-materials.html", icon: "GD", label: "ガイド資料",         count: counts.gd },
    { key: "cancelTemplate", href: "cancel-policies.html", icon: "CP", label: "キャンセルポリシー" },
  ];
  return (
    <aside className="side-nav">
      <div className="brand-block">
        <div className="brand-mark">d.</div>
        <div>
          <div className="brand-name">deep_Admin</div>
          <div className="brand-caption">Product &amp; Sales · Phase 1</div>
        </div>
      </div>
      <div className="nav-group" style={{marginBottom:"8px"}}>
        <a href="index.html" className={`nav-item ${resource === "dashboard" ? "active" : ""}`} style={{textDecoration:"none"}}>
          <span className="nav-icon">⊞</span>
          <span style={{flex:1,minWidth:0}}><div>ダッシュボード</div></span>
        </a>
      </div>
      <div>
        <div className="nav-section-label">精算・経営</div>
        <div className="nav-group">
          {payItems.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${resource === it.key ? "active" : ""}`}
              style={{textDecoration:"none"}}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
            </a>
          ))}
        </div>
      </div>
      <div>
        <div className="nav-section-label">商品管理</div>
        <div className="nav-group">
          {masterItems.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${resource === it.key ? "active" : ""}`}
              style={{textDecoration:"none"}}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
              <span className="nav-count">{it.count}</span>
            </a>
          ))}
        </div>
      </div>
      <div className="sidebar-footer">
        <a href="login.html" className="nav-item nav-logout" style={{textDecoration:"none"}}>
          <span className="nav-icon">↩</span><span>ログアウト</span>
        </a>
      </div>
    </aside>
  );
}

// ── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [resources, setResources] = useState(SEED.resourceMaster || []);

  return (
    <div className="app-shell">
      <Sidebar />
      <div style={{flex:1,padding:'var(--sp-5)',display:'flex',flexDirection:'column',gap:14,minWidth:0,overflowY:'auto'}}>
      <div className="list-shell">
        <div className="topbar list-topbar">
          <div>
            <div className="crumbs">
              <a href="index.html" className="crumb-link">deep_Admin</a>
              <span className="sep">/</span>
              <span className="current">リソース管理</span>
            </div>
          </div>
        </div>

        <div className="list-view">
          <div className="list-header">
            <div>
              <h1>リソース管理</h1>
              <p className="list-desc">催行に必要な機材・車両などの保有リソースを管理します。TourOptionの催行リソース設定から参照されます。</p>
            </div>
            <div style={{alignSelf:'flex-start'}}>
              <a href="resource-detail.html?mode=create" className="btn primary">＋ リソースを追加</a>
            </div>
          </div>

          <div className="list-table-wrap">
            <table className="list-table">
              <thead>
                <tr>
                  <th>リソース名</th>
                  <th style={{width:100,textAlign:'center'}}>保有数</th>
                  <th style={{width:60,textAlign:'center'}}>単位</th>
                  <th style={{width:140,textAlign:'center'}}>再利用可能までの時間</th>
                  <th style={{width:100,textAlign:'center'}}>定員</th>
                  <th className="actions" style={{width:80}}></th>
                </tr>
              </thead>
              <tbody>
                {resources.map(r => (
                  <tr key={r.id} className="list-row" onClick={() => { window.location.href = `resource-detail.html?id=${r.id}`; }}>
                    <td>
                      <strong>{r.label}</strong>
                    </td>
                    <td style={{textAlign:'center'}}>
                      <span style={{fontWeight:700,fontSize:15}}>{r.totalQty}</span>
                    </td>
                    <td style={{textAlign:'center'}}>{r.unit}</td>
                    <td style={{textAlign:'center'}}>
                      {r.cooldown > 0
                        ? <span style={{display:'inline-block',padding:'2px 8px',borderRadius:99,fontSize:11,background:'#fef3c7',color:'#92400e'}}>{r.cooldown}分</span>
                        : <span style={{color:'var(--muted)',fontSize:12}}>—</span>
                      }
                    </td>
                    <td style={{textAlign:'center'}}>{r.note ? `${r.note}人` : '—'}</td>
                    <td className="actions">
                      <a href={`resource-detail.html?id=${r.id}`} className="btn sm" onClick={e => e.stopPropagation()}>編集</a>
                    </td>
                  </tr>
                ))}
                {resources.length === 0 && (
                  <tr>
                    <td colSpan={6} className="list-empty">リソースが登録されていません</td>
                  </tr>
                )}
              </tbody>
            </table>
          </div>
        </div>
      </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
