<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>リソース管理 | deep_Admin</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="css/common.css">
  </head>
  <body data-density="regular" data-side="default">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <script src="js/master-data.js"></script>
    <script type="text/babel" data-presets="react">
const { useState } = React;

// ── Sidebar ─────────────────────────────────────────────────────────────────
function Sidebar() {
  const items = [
    { key: "dashboard",      href: "index.html",           icon: "⊞", label: "ダッシュボード" },
    { key: "tourOption",     href: "tour-options.html",    icon: "TO", label: "TourOption",        hint: "ツアーの実体" },
    { key: "productPage",    href: "products.html",        icon: "PG", label: "商品ページ",           hint: "顧客表示" },
    { key: "resource",       href: "resources.html",       icon: "RS", label: "リソース管理",          hint: "機材・車両等" },
    { key: "guideDoc",       href: "guide-materials.html", icon: "GD", label: "ガイド資料",           hint: "運営注意・行程" },
    { key: "cancelTemplate", href: "cancel-policies.html", icon: "CP", label: "キャンセルポリシー",   hint: "キャンセル文言" },
  ];
  return (
    <aside className="side-nav">
      <div className="brand-block">
        <div className="brand-mark">d.</div>
        <div>
          <div className="brand-name">deep_Admin</div>
          <div className="brand-caption">Product &amp; Sales · Phase 1</div>
        </div>
      </div>
      <div>
        <div className="nav-section-label">Manage</div>
        <div className="nav-group">
          {items.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${it.key === "resource" ? "active" : ""}`}
              style={{textDecoration:"none"}}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1,minWidth:0}}>
                <div>{it.label}</div>
              </span>
            </a>
          ))}
        </div>
      </div>
      <div>
        <div className="nav-section-label">Tools</div>
        <div className="nav-group">
          <button className="nav-item"><span className="nav-icon" style={{fontSize:11}}>⌕</span><span>検索</span></button>
          <button className="nav-item"><span className="nav-icon" style={{fontSize:11}}>≡</span><span>変更履歴</span></button>
          <button className="nav-item"><span className="nav-icon" style={{fontSize:11}}>?</span><span>ヘルプ</span></button>
        </div>
      </div>
      <div className="side-note">
        <strong>リソース管理</strong>
        催行に使用する機材・車両等の保有数と再利用可能時間を管理します。TourOptionの催行リソース設定から参照されます。
      </div>
    </aside>
  );
}

// ── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [resources, setResources] = useState(SEED.resourceMaster || []);

  return (
    <div className="app-shell">
      <Sidebar />
      <div className="list-shell">
        <div className="topbar list-topbar">
          <div>
            <div className="crumbs">
              <a href="index.html" className="crumb-link">deep_Admin</a>
              <span className="sep">/</span>
              <span className="current">リソース管理</span>
            </div>
          </div>
        </div>

        <div className="list-view">
          <div className="list-header">
            <div>
              <h1>リソース管理</h1>
              <p className="list-desc">催行に必要な機材・車両などの保有リソースを管理します。TourOptionの催行リソース設定から参照されます。</p>
            </div>
            <div style={{alignSelf:'flex-start'}}>
              <a href="resource-detail.html?mode=create" className="btn primary">＋ リソースを追加</a>
            </div>
          </div>

          <div className="list-table-wrap">
            <table className="list-table">
              <thead>
                <tr>
                  <th>リソース名</th>
                  <th style={{width:60,textAlign:'center'}}>単位</th>
                  <th style={{width:100,textAlign:'center'}}>保有数</th>
                  <th style={{width:140,textAlign:'center'}}>再利用可能までの時間</th>
                  <th>メモ</th>
                  <th className="actions" style={{width:80}}></th>
                </tr>
              </thead>
              <tbody>
                {resources.map(r => (
                  <tr key={r.id} className="list-row" onClick={() => { window.location.href = `resource-detail.html?id=${r.id}`; }}>
                    <td>
                      <strong>{r.label}</strong>
                      <div className="row-sub">{r.key}</div>
                    </td>
                    <td style={{textAlign:'center'}}>{r.unit}</td>
                    <td style={{textAlign:'center'}}>
                      <span style={{fontWeight:700,fontSize:15}}>{r.totalQty}</span>
                      <span style={{fontSize:11,color:'var(--muted)',marginLeft:2}}>{r.unit}</span>
                    </td>
                    <td style={{textAlign:'center'}}>
                      {r.cooldown > 0
                        ? <span style={{display:'inline-block',padding:'2px 8px',borderRadius:99,fontSize:11,background:'#fef3c7',color:'#92400e'}}>{r.cooldown}分</span>
                        : <span style={{color:'var(--muted)',fontSize:12}}>—</span>
                      }
                    </td>
                    <td style={{color:'var(--muted)'}}>{r.note || '—'}</td>
                    <td className="actions">
                      <a href={`resource-detail.html?id=${r.id}`} className="btn sm" onClick={e => e.stopPropagation()}>編集</a>
                    </td>
                  </tr>
                ))}
                {resources.length === 0 && (
                  <tr>
                    <td colSpan={6} className="list-empty">リソースが登録されていません</td>
                  </tr>
                )}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
