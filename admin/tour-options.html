// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

function SectionHead({ title, desc, action, eyebrow }) {
  return (
    <div className="section-title">
      <div>
        {eyebrow && <p className="muted tiny" style={{margin:0,letterSpacing:'.06em',textTransform:'uppercase',fontWeight:600,marginBottom:4}}>{eyebrow}</p>}
        <h2>{title}</h2>
        {desc && <p>{desc}</p>}
      </div>
      {action}
    </div>
  );
}

function Field({ label, required, optional, value, onChange, placeholder, multiline, readOnly, wide, help, error, warn, ok, maxLen, mono, type = "text", affixLeft, affixRight, rows }) {
  const id = useRef(`f-${Math.random().toString(36).slice(2, 8)}`).current;
  const len = (value ?? "").length;
  const over = maxLen != null && len > maxLen;
  const cls = ["field"];
  if (wide) cls[0] = "field-wide";
  if (error || over) cls.push("has-error");
  else if (warn) cls.push("has-warn");
  else if (ok) cls.push("has-ok");

  const inputStyle = mono ? { fontFamily: '"JetBrains Mono", ui-monospace, "SF Mono", monospace', fontSize: 12.5 } : undefined;

  const inputEl = multiline ? (
    <textarea id={id} value={value ?? ""} onChange={e => onChange?.(e.target.value)} placeholder={placeholder} readOnly={readOnly} rows={rows} style={inputStyle} />
  ) : (
    <input id={id} type={type} value={value ?? ""} onChange={e => onChange?.(e.target.value)} placeholder={placeholder} readOnly={readOnly} style={inputStyle} />
  );

  const wrappedInput = (affixLeft || affixRight) ? (
    <div className="input-affix">
      {affixLeft && <div className="affix">{affixLeft}</div>}
      <input id={id} type={type} value={value ?? ""} onChange={e => onChange?.(e.target.value)} placeholder={placeholder} readOnly={readOnly} style={inputStyle} />
      {affixRight && <div className="affix right">{affixRight}</div>}
    </div>
  ) : inputEl;

  const showHelp = error || warn || ok || help || maxLen != null;

  return (
    <div className={cls.join(" ")}>
      <label className="field-label" htmlFor={id}>
        {required && <span className="req" aria-label="required" />}
        <span>{label}</span>
        {optional && <span className="opt">任意</span>}
      </label>
      {wrappedInput}
      {showHelp && (
        <div className={`field-help ${error || over ? "error" : warn ? "warn" : ok ? "ok" : ""}`}>
          {(error || over) && <Icon.alert />}
          {warn && !error && !over && <Icon.alert />}
          {ok && !error && !over && !warn && <Icon.check />}
          <span>{error || (over ? `${maxLen}文字以内で入力してください` : (warn || ok || help || ""))}</span>
          {maxLen != null && <span className={`char-count ${over ? "over" : ""}`}>{len}/{maxLen}</span>}
        </div>
      )}
    </div>
  );
}

function SelectField({ label, value, onChange, options, required, wide, help, readOnly }) {
  const id = useRef(`s-${Math.random().toString(36).slice(2, 8)}`).current;
  return (
    <div className={wide ? "field-wide" : "field"}>

        {options.map(o => <option key={o} value={o}>{o}</option>)}

      {help && <div className="field-help"><Icon.info /><span>{help}</span></div>}
    </div>

}

function TagField({ label, value = [], onChange, wide, help, readOnly }) {
  const [draft, setDraft] = useState("");
  const remove = (i) => onChange?.(value.filter((_, idx) => idx !== i));
  const add = () => {
    const v = draft.trim();
    if (!v) return;
    onChange?.([...value, v]);
    setDraft("");
  };
  return (
    <div className={wide ? "field-wide" : "field"}>
      <div className="field-label"><span>{label}</span><span className="opt">任意</span></div>
      <div className="tag-input">
        {value.map((tag, i) => (
          <span className="tag-chip" key={i}>
            {tag}
            {!readOnly && <button type="button" onClick={() => remove(i)} aria-label="削除"><Icon.close /></button>}
          </span>
        ))}
        {!readOnly && (
          <input
            value={draft}
            onChange={e => setDraft(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter" || e.key === ",") { e.preventDefault(); add(); }}}
            placeholder={value.length ? "" : "Enterで追加"}
          />
        )}
      </div>
      {help && <div className="field-help"><Icon.info /><span>{help}</span></div>}
    </div>
  );
}

// ── DurationField: HH:MM input ──────────────────────────────────────────────
function DurationField({ label, value, onChange, required, readOnly }) {
  // parse from "3時間", "3時間30分", or "HH:MM"
  const parsed = (() => {
    if (!value) return { h: 0, m: 0 };
    const colon = /^(\d{1,2}):(\d{1,2})$/.exec(value);
    if (colon) return { h: Number(colon[1]) || 0, m: Number(colon[2]) || 0 };
    const hm = /(\d+)\s*時間(?:\s*(\d+)\s*分)?/.exec(value);
    if (hm) return { h: Number(hm[1]) || 0, m: Number(hm[2] || 0) };
    const mOnly = /(\d+)\s*分/.exec(value);
    if (mOnly) return { h: 0, m: Number(mOnly[1]) || 0 };
    return { h: 0, m: 0 };
  })();

  const set = (h, m) => {
    const hh = String(h).padStart(2, "0");
    const mm = String(m).padStart(2, "0");
    onChange?.(`${hh}:${mm}`);
  };

  return (
    <div className="field">
      <label className="field-label">
        {required && <span className="req" />}
        <span>{label}</span>
      </label>
      <div className="duration-input">
        <input
          type="number" min="0" max="23"
          value={parsed.h}
          onChange={e => set(Number(e.target.value) || 0, parsed.m)}
          readOnly={readOnly}
        />
        <span className="sep">:</span>
        <input
          type="number" min="0" max="59"
          value={String(parsed.m).padStart(2, "0")}
          onChange={e => set(parsed.h, Math.min(59, Number(e.target.value) || 0))}
          readOnly={readOnly}
        />
      </div>
    </div>
  );
}

// ── CancelPolicyField: [number] [unit ▼] {trail} ──────────────────────────
function CancelPolicyField({ label, value, onChange, readOnly, trail = "前まで無料キャンセル", defaultUnit = "時間" }) {
  const parsed = (() => {
    if (!value) return { n: 24, unit: defaultUnit };
    const m = /(\d+)\s*(時間|日)/.exec(value);
    if (m) return { n: Number(m[1]) || 0, unit: m[2] };
    return { n: 24, unit: defaultUnit };
  })();

  const set = (n, unit) => onChange?.(`${n}${unit}${trail}`);

  return (
    <div className="field-wide">
      <label className="field-label">
        <span>{label}</span>
      </label>
      <div className="policy-input">
        <input
          type="number" min="0"
          value={parsed.n}
          onChange={e => set(Number(e.target.value) || 0, parsed.unit)}
          readOnly={readOnly}
        />
        <select
          value={parsed.unit}
          onChange={e => set(parsed.n, e.target.value)}
          disabled={readOnly}
        >
          <option value="時間">時間</option>
          <option value="日">日</option>
        </select>
        <span className="trail">{trail}</span>
      </div>
    </div>
  );
}

// ── Cancel template fill: map a TourOption's own settings onto template vars ──
function buildCancelTemplateValues(t) {
  const rate = t.cancellationFeeRate;
  return {
    freeCancelDeadline: (t.freeCancelDeadline ?? "").toString().trim(),
    cancellationFeeRate: (rate === null || rate === undefined || rate === "") ? "" : `${Number(rate)}%`,
    cancellationFeeStart: (t.cancellationFeeStart ?? "").toString().trim(),
  };
}
// Render a template body, substituting filled values and leaving unfilled
// {{ vars }} highlighted in orange.
function renderFilledTemplate(body, values) {
  const parts = String(body || "").split(/(\{\{\s*\w+\s*\}\})/g);
  return parts.map((seg, i) => {
    const m = seg.match(/^\{\{\s*(\w+)\s*\}\}$/);
    if (!m) return <React.Fragment key={i}>{seg}</React.Fragment>;
    const key = m[1];
    const val = values[key];
    if (val != null && String(val).length > 0) {
      return <React.Fragment key={i}>{val}</React.Fragment>;
    }
    return <span key={i} className="tmpl-var-empty">{`{{ ${key} }}`}</span>;
  });
}

// ── CancelConditionSection: structured cancellation policy fields ───────────
function CancelConditionSection({ t, update, readonly }) {
  const feeRate = Number(t.cancellationFeeRate ?? 0);
  const refundRate = Math.max(0, Math.min(100, 100 - feeRate));
  const nonRef = !!t.nonRefundable;
  const feeDisabled = readonly || nonRef;
  const cancelTemplates = (typeof SEED !== "undefined" && SEED.cancelTemplates) ? SEED.cancelTemplates : [];
  const selTemplate = cancelTemplates.find(x => x.id === t.cancelPolicyTemplateId);
  const templateValues = buildCancelTemplateValues(t);

  return (
    <div className="cancel-condition">
      <div className="subhead">
        <h4>キャンセル条件</h4>
        <p>無料キャンセル期限・キャンセル料率・返金条件をまとめて設定します。</p>
      </div>

      {nonRef && (
        <InfoNote amber icon={<Icon.alert />}>
          <strong>この商品は返金不可として販売されます。</strong> キャンセル料率・返金率の設定は参照されず、予約確定後の返金は行われません。
        </InfoNote>
      )}

      <div className="field-grid three">
        <CancelPolicyField
          label="無料キャンセル期限"
          value={t.freeCancelDeadline}
          onChange={x => update({ freeCancelDeadline: x, cancelPolicy: x })}
          readOnly={readonly || nonRef}
          trail="前まで無料キャンセル"
        />

        <div className={`field ${feeDisabled ? "field-deemphasized" : ""}`}>
          <label className="field-label"><span>キャンセル料率</span></label>
          <div className="input-affix">
            <input
              type="number" min="0" max="100"
              value={feeRate}
              onChange={e => update({ cancellationFeeRate: Math.max(0, Math.min(100, Number(e.target.value) || 0)) })}
              readOnly={readonly} disabled={feeDisabled}
            />
            <div className="affix right">%</div>
          </div>
          {feeRate === 0 && !nonRef
            ? <div className="field-help"><Icon.info /><span style={{opacity:0.75}}>キャンセル料なし（全額返金）</span></div>
            : <div className="field-help" style={{visibility:'hidden'}}><Icon.info /><span>―</span></div>}
        </div>

        <div className="field field-deemphasized">
          <label className="field-label"><span>返金率</span><span className="opt">自動算出</span></label>
          <div className="input-affix">
            <input type="text" value={String(nonRef ? 0 : refundRate)} readOnly disabled />
            <div className="affix right">%</div>
          </div>
          <div className="field-help"><Icon.info /><span style={{opacity:0.75}}>キャンセル料率から自動算出（編集不可）</span></div>
        </div>
      </div>

      <div className="field-wide" style={{marginTop:2}}>
        <ToggleRow
          checked={nonRef}
          onChange={v => update({ nonRefundable: v })}
          title="返金不可として販売する"
          desc="ON にするとキャンセル料率・返金率は参照されず、返金不可商品になります"
        />
      </div>

      {nonRef && (
        <div className="field-grid">
          <Field label="返金不可理由 / 備考" value={t.nonRefundableNote} onChange={x => update({ nonRefundableNote: x })} wide multiline readOnly={readonly} placeholder="例: 特価セール商品のため返金不可" help="ゲスト向け表示に補足する場合のメモ" />
        </div>
      )}

      <div className="field-grid">
        <SelectField label="日程変更可否" value={t.reschedulePolicy} onChange={x => update({ reschedulePolicy: x })} options={["可", "不可", "要相談"]} readOnly={readonly} />
        <Field label="例外的な返金ルールのメモ" value={t.exceptionalRefundMemo} onChange={x => update({ exceptionalRefundMemo: x })} wide multiline readOnly={readonly} help="天候・ガイド都合など例外対応のメモ。社外非公開" />

        <div className="field-wide">
          <label className="field-label">
            {!readonly && <span className="req" />}
            <span>キャンセルポリシー</span>
          </label>
          {readonly ? (
            <div className="readonly-text">{selTemplate ? selTemplate.name : "（未選択）"}</div>
          ) : (
            <select
              value={t.cancelPolicyTemplateId ?? ""}
              onChange={e => update({ cancelPolicyTemplateId: e.target.value })}
            >
              <option value="">— テンプレートを選択 —</option>
              {cancelTemplates.map(x => (
                <option key={x.id} value={x.id}>{x.name}</option>
              ))}
            </select>
          )}
          {selTemplate && (
            <div className="tmpl-inline-preview">
              <span className="tmpl-inline-preview-label">プレビュー</span>
              <p>{renderFilledTemplate(selTemplate.body, templateValues)}</p>
            </div>
          )}
          {!readonly && (
            <div className="field-help"><Icon.info /><span>ゲストへの表示文に使うテンプレートを選択します</span></div>
          )}

        <Field label="社内メモ" value={t.cancelInternalMemo} onChange={x => update({ cancelInternalMemo: x })} wide multiline readOnly={readonly} help="運用調整・申し送りなど。社外非公開" />

// ── Tiered Pricing section ─────────────────────────────────────────────
function TieredPricingSection({ enabled, tiers, onToggle, onChange, readonly }) {
  const [sampleN, setSampleN] = useState(6);

  const updateTier = (id, patch) => {
    onChange(tiers.map(t => t.id === id ? { ...t, ...patch } : t));
  };
  const removeTier = (id) => onChange(tiers.filter(t => t.id !== id));
  const addTier = () => {
    const last = tiers[tiers.length - 1];
    const nextMin = last ? Math.max((last.openMax ? last.min : (last.max ?? last.min)) + 1, 1) : 1;
    onChange([...tiers, { id: `tp-${Date.now()}`, min: nextMin, max: nextMin + 1, price: 6000, openMax: false }]);
  };

  // Validation: detect overlaps, empty / inverted ranges
  const tierErrors = useMemo(() => {
    const errs = tiers.map(() => null);
    tiers.forEach((t, i) => {
      const min = Number(t.min);
      const max = t.openMax ? Infinity : Number(t.max);
      if (!min || min < 1) errs[i] = "下限が未入力";
      else if (!t.openMax && (!max || max < min)) errs[i] = "上限が下限を下回っています";
      else {
        // overlap check
        for (let j = 0; j < tiers.length; j++) {
          if (i === j) continue;
          const o = tiers[j];
          const oMin = Number(o.min);
          const oMax = o.openMax ? Infinity : Number(o.max);
          if (min <= oMax && oMin <= max) { errs[i] = "他の人数帯と重複しています"; break; }
        }
      }
    });
    return errs;
  }, [tiers]);

  // calc preview
  const matched = tiers.find(t => {
    const min = Number(t.min);
    const max = t.openMax ? Infinity : Number(t.max);
    return sampleN >= min && sampleN <= max;
  });
  const total = matched ? sampleN * Number(matched.price) : null;

  return (
    <section className={`tiered-pricing ${enabled ? "is-on" : "is-off"}`}>
      <div className="section-title" style={{borderBottom:'1px solid var(--line)'}}>
        <div>
          <h2>段階価格 <span className="muted" style={{fontWeight:500,fontSize:13,letterSpacing:0}}>(Tiered Pricing)</span></h2>
          <p>予約人数に応じて1名あたりの単価が変動する場合に設定します。</p>
        </div>
        <label className={`toggle-row ${enabled ? "on" : ""}`} style={{minWidth:220, cursor: readonly ? 'default':'pointer'}}>
          <input type="checkbox" checked={enabled} disabled={readonly} onChange={e => onToggle(e.target.checked)} />
          <div className="tx">
            <strong>段階価格を使用する</strong>
            <span>{enabled ? "予約時の人数に応じて単価を適用" : "基準販売価格を一律で適用"}</span>
          </div>
        </label>
      </div>

      {enabled ? (
        <>
          <InfoNote amber icon={<Icon.alert />}>
            <strong>段階価格が有効です。</strong> 基準販売価格は参照されません。予約時の人数に応じて以下の単価が適用されます。
          </InfoNote>

          <div className="table-wrap tier-table-wrap">
            <table className="tier-table">
              <thead>
                <tr>
                  <th style={{width:28}}></th>
                  <th style={{width:140}}>人数帯（下限）</th>
                  <th style={{width:180}}>人数帯（上限）</th>
                  <th>1名あたり単価（税込）</th>
                  <th className="actions" style={{width:80}}>操作</th>
                </tr>
              </thead>
              <tbody>
                {tiers.map((t, i) => {
                  const err = tierErrors[i];
                  return (
                    <tr key={t.id} className={err ? "tier-row has-warn" : "tier-row"}>
                      <td className="drag-cell">
                        <span className="drag-handle" title="ドラッグして並べ替え"><Icon.drag /></span>
                      </td>
                      <td>
                        <div className="input-affix tier-input">
                          <input type="number" min={1} value={t.min} onChange={e => updateTier(t.id, { min: Number(e.target.value) || 0 })} readOnly={readonly} />
                          <div className="affix right">名</div>
                        </div>
                      </td>
                      <td>
                        {t.openMax ? (
                          <div className="open-max-cell">
                            <span className="open-max-text">上限なし</span>
                            <label className="mini-check">
                              <input type="checkbox" checked={t.openMax} onChange={e => updateTier(t.id, { openMax: e.target.checked, max: e.target.checked ? null : (Number(t.min)+1) })} disabled={readonly} />
                              <span>上限なし</span>
                            </label>
                          </div>
                        ) : (
                          <div className="open-max-cell">
                            <div className="input-affix tier-input">
                              <input type="number" min={1} value={t.max ?? ""} onChange={e => updateTier(t.id, { max: Number(e.target.value) || 0 })} readOnly={readonly} />
                              <div className="affix right">名</div>
                            </div>
                            <label className="mini-check">
                              <input type="checkbox" checked={!!t.openMax} onChange={e => updateTier(t.id, { openMax: e.target.checked, max: e.target.checked ? null : (Number(t.min)+1) })} disabled={readonly} />
                              <span>上限なしにする</span>
                            </label>
                          </div>
                        )}
                      </td>
                      <td>
                        <div className="input-affix tier-input price">
                          <div className="affix">¥</div>
                          <input type="number" min={0} step={100} value={t.price} onChange={e => updateTier(t.id, { price: Number(e.target.value) || 0 })} readOnly={readonly} />
                        </div>
                      </td>
                      <td className="actions">
                        <button className="btn sm" onClick={() => removeTier(t.id)} style={{color:'var(--coral)'}} disabled={readonly || tiers.length <= 1}>削除</button>
                      </td>
                    </tr>
                  );
                })}
                {tierErrors.some(Boolean) && (
                  <tr className="tier-error-row">
                    <td colSpan={5}>
                      <div className="field-help warn" style={{margin:'4px 0'}}>
                        <Icon.alert />
                        <span>
                          {tierErrors.filter(Boolean).map((e, i) => <span key={i} style={{marginRight:12}}>・{e}</span>)}
                          人数帯が重複しないように調整してください。
                        </span>
                      </div>
                    </td>
                  </tr>
                )}
              </tbody>
            </table>
          </div>

          <button className="btn add-tier" onClick={addTier} disabled={readonly}>
            <span style={{fontSize:14,lineHeight:1,marginRight:2}}>＋</span> 人数帯を追加
          </button>

          <div className="tier-preview">
            <div className="tier-preview-head">
              <span className="eyebrow-tag teal-tag">計算プレビュー</span>
              <span className="muted tiny">人数を変更すると、適用される単価帯がハイライトされます。</span>
            </div>
            <div className="tier-preview-body">
              <div className="sample-input">
                <span>例：</span>
                <div className="input-affix" style={{width:120}}>
                  <input type="number" min={1} value={sampleN} onChange={e => setSampleN(Number(e.target.value) || 1)} />
                  <div className="affix right">名</div>
                </div>
                <span>で予約</span>
              </div>
              <div className="calc-result">
                {matched ? (
                  <>
                    <span className="calc-eq">
                      {sampleN}名 × <strong>¥{Number(matched.price).toLocaleString()}</strong>
                      <span className="muted" style={{margin:'0 6px'}}>（{matched.openMax ? `${matched.min}名以上` : `${matched.min}〜${matched.max}名`}帯）</span>
                      = 
                    </span>
                    <span className="calc-total">¥{Number(total).toLocaleString()}</span>
                  </>
                ) : (
                  <span className="muted">指定の人数に該当する人数帯がありません</span>
                )}
              </div>
            </div>
          </div>
        </>
      ) : (
        <div className="tier-collapsed-note">
          <Icon.info />
          <span>段階価格は無効です。すべての予約に <strong>基準販売価格</strong> が一律で適用されます。</span>
        </div>
      )}
    </section>
  );
}

        <button className="btn" style={{borderStyle:'dashed'}}>＋ チャネルを追加</button>
        <span className="muted tiny" style={{display:'inline-flex',alignItems:'center',gap:6}}>
          <Icon.info />
          自社サイト経由の予約は、商品ページのURLが自動的に適用されます（手動設定不要）
        </span>
      </div>
    </div>
  );

function ChannelMark({ name }) {

            ref={bodyRef}

            onChange={e => updateTemplate(tmpl.id, { body: e.target.value })}

}

// list-filters.jsx — Reusable filter primitives for list views
// Components: SearchBar, MultiSelectDropdown, SingleSelectDropdown,
// ToggleFilter, TabFilter, ResultCounter, ClearFiltersButton

const { useState: useFState, useRef: useFRef, useEffect: useFEffect } = React;

// ── SearchBar ────────────────────────────────────────────────────
function SearchBar({ value, onChange, placeholder, onKeyDown }) {
  return (
    <div className="lf-search">
      <span className="lf-search-ico" aria-hidden="true">⌕</span>
      <input
        type="text"
        value={value}
        onChange={e => onChange(e.target.value)}
        placeholder={placeholder}
        onKeyDown={onKeyDown}
      />
      {value && (
        <button className="lf-search-clear" onClick={() => onChange("")} aria-label="クリア">×</button>
      )}
    </div>
  );
}

// ── Hook: click-outside ──────────────────────────────────────────
function useClickOutside(ref, onOutside) {
  useFEffect(() => {
    function handle(e) {
      if (ref.current && !ref.current.contains(e.target)) onOutside();
    }
    document.addEventListener("mousedown", handle);
    return () => document.removeEventListener("mousedown", handle);
  }, [ref, onOutside]);
}

// ── MultiSelectDropdown ──────────────────────────────────────────
function MultiSelectDropdown({ label, options, values, onChange }) {
  const [open, setOpen] = useFState(false);
  const ref = useFRef(null);
  useClickOutside(ref, () => setOpen(false));

  const toggle = (v) => {
    if (values.includes(v)) onChange(values.filter(x => x !== v));
    else onChange([...values, v]);
  };

  const active = values.length > 0;

  return (
    <div className={`lf-dropdown ${active ? "is-active" : ""}`} ref={ref}>
      <button type="button" className="lf-dropdown-btn" onClick={() => setOpen(o => !o)}>
        <span className="lf-dropdown-label">{label}</span>
        {active && <span className="lf-dropdown-count">×{values.length}</span>}
        <span className="lf-caret">▾</span>
      </button>
      {open && (
        <div className="lf-dropdown-menu">
          {options.map(opt => {
            const checked = values.includes(opt);
            return (
              <label key={opt} className="lf-dropdown-item">
                <input type="checkbox" checked={checked} onChange={() => toggle(opt)} />
                <span>{opt}</span>
              </label>
            );
          })}
          {active && (
            <div className="lf-dropdown-foot">
              <button type="button" className="lf-link" onClick={() => onChange([])}>選択をクリア</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── SingleSelectDropdown ─────────────────────────────────────────
function SingleSelectDropdown({ label, options, value, onChange, allLabel = "すべて" }) {
  const [open, setOpen] = useFState(false);
  const ref = useFRef(null);
  useClickOutside(ref, () => setOpen(false));

  const active = value && value !== allLabel;
  const selectedLabel = active ? value : null;

  return (
    <div className={`lf-dropdown ${active ? "is-active" : ""}`} ref={ref}>
      <button type="button" className="lf-dropdown-btn" onClick={() => setOpen(o => !o)}>
        <span className="lf-dropdown-label">{label}</span>
        {active && <span className="lf-dropdown-count">{selectedLabel}</span>}
        <span className="lf-caret">▾</span>
      </button>
      {open && (
        <div className="lf-dropdown-menu">
          <label className="lf-dropdown-item">
            <input
              type="radio"
              name={`single-${label}`}
              checked={!active}
              onChange={() => { onChange(allLabel); setOpen(false); }}
            />
            <span>{allLabel}</span>
          </label>
          {options.map(opt => (
            <label key={opt} className="lf-dropdown-item">
              <input
                type="radio"
                name={`single-${label}`}
                checked={value === opt}
                onChange={() => { onChange(opt); setOpen(false); }}
              />
              <span>{opt}</span>
            </label>
          ))}
        </div>
      )}
    </div>
  );
}

// ── ToggleFilter ─────────────────────────────────────────────────
function ToggleFilter({ label, value, onChange }) {
  return (
    <label className={`lf-toggle ${value ? "is-active" : ""}`}>
      <input
        type="checkbox"
        checked={value}
        onChange={e => onChange(e.target.checked)}
      />
      <span className="lf-toggle-track" aria-hidden="true">
        <span className="lf-toggle-thumb" />
      </span>
      <span className="lf-toggle-label">{label}</span>
    </label>
  );
}

// ── TabFilter ────────────────────────────────────────────────────
function TabFilter({ options, value, onChange }) {
  return (
    <div className="lf-tabs" role="tablist">
      {options.map(opt => (
        <button
          key={opt}
          role="tab"
          aria-selected={value === opt}
          className={`lf-tab ${value === opt ? "active" : ""}`}
          onClick={() => onChange(opt)}
        >
          {opt}
        </button>
      ))}
    </div>
  );
}

// ── ResultCounter ────────────────────────────────────────────────
function ResultCounter({ total, shown, hasFilter }) {
  return (
    <span className="lf-counter">
      <strong>{total}</strong>件中
      <strong className={hasFilter ? "is-filtered" : ""}> {shown}</strong>件を表示
    </span>
  );
}

// ── ClearFiltersButton ───────────────────────────────────────────
function ClearFiltersButton({ onClick, show }) {
  if (!show) return null;
  return (
    <button type="button" className="lf-link clear-all" onClick={onClick}>
      フィルターを解除
    </button>
  );
}

window.ListFilters = {
  SearchBar,
  MultiSelectDropdown,
  SingleSelectDropdown,
  ToggleFilter,
  TabFilter,
  ResultCounter,
  ClearFiltersButton,
};

const PRICE_RANGES = [
  { label: "〜¥5,000", min: 0, max: 5000 },
  { label: "¥5,001〜¥10,000", min: 5001, max: 10000 },
  { label: "¥10,001〜¥20,000", min: 10001, max: 20000 },
  { label: "¥20,001〜", min: 20001, max: Infinity },
];

function TourOptionList({ rows, onOpen, onCreate }) {
  const [search, setSearch] = useLState("");
  const [statuses, setStatuses] = useLState([]);
  const [priceRange, setPriceRange] = useLState("すべて");
  const [tags, setTags] = useLState([]);

  const allTags = useLMemo(() => {
    const s = new Set();
    rows.forEach(r => (r.tags || []).forEach(t => s.add(t)));
    return Array.from(s);
  }, [rows]);

  const filtered = useLMemo(() => {
    const s = search.trim().toLowerCase();
    const pr = PRICE_RANGES.find(p => p.label === priceRange);
    return rows.filter(r => {
      if (s) {
        const hay = `${r.name} ${r.theme || ""} ${r.code}`.toLowerCase();
        if (!hay.includes(s)) return false;
      }
      if (statuses.length && !statuses.includes(r.salesStatus)) return false;
      if (pr) {
        if (r.priceValue < pr.min || r.priceValue > pr.max) return false;
      }
      if (tags.length) {
        if (!tags.some(t => (r.tags || []).includes(t))) return false;
      }
      return true;
    });
  }, [rows, search, statuses, priceRange, tags]);

  const counts = filtered.reduce((acc, r) => {
    acc[r.salesStatus] = (acc[r.salesStatus] ?? 0) + 1;
    return acc;
  }, {});

  const hasFilter = !!search || statuses.length > 0 || priceRange !== "すべて" || tags.length > 0;
  const clearAll = () => {
    setSearch(""); setStatuses([]); setPriceRange("すべて"); setTags([]);
  };

  return (
    <div className="list-view">
      <ListHeader
        title="TourOption 一覧"
        desc="ツアーの実体となるTourOptionを管理します。"
        onCreate={onCreate}

        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <SearchBar
            value={search}
            onChange={x => setSearch(x)}
            placeholder="TourOption名・テーマ・コードで検索..."
          />
        </div>
        <div className="lf-controls">
          <MultiSelectDropdown
            label="販売ステータス"
            options={["掲載中", "一時停止", "非公開", "下書き"]}
            values={statuses}
            onChange={setStatuses}
          />
          <SingleSelectDropdown
            label="価格帯"
            options={PRICE_RANGES.map(r => r.label)}
            value={priceRange}
            onChange={setPriceRange}
          />
          <MultiSelectDropdown
            label="タグ"
            options={allTags}
            values={tags}
            onChange={setTags}
          />

        </div>
      </div>

      <StatusSummary counts={counts} />
      <div className="list-table-wrap">
        <div className="table-scroll">
          <table className="list-table">
            <thead>
              <tr>
                <th style={{width:170}}>TourOptionコード</th>
                <th>TourOption名</th>
                <th style={{width:160}}>タグ</th>
                <th style={{width:130}}>販売ステータス</th>
                <th className="num" style={{width:130}}>基準販売価格</th>
                <th style={{width:120}}>最終更新</th>
                <th className="actions" style={{width:90}}>アクション</th>
              </tr>
            </thead>
            <tbody>
              {filtered.length === 0 && (
                <tr><td colSpan="7" className="list-empty">該当するTourOptionがありません</td></tr>
              )}
              {filtered.map(r => (
                <tr key={r.id} onClick={() => onOpen(r)} className="list-row">
                  <td><span className="code-mono" style={{fontSize:12,fontWeight:600}}>{r.code}</span></td>
                  <td>
                    <strong>{r.name}</strong>
                    <div className="row-sub">{r.theme}</div>
                  </td>
                  <td>
                    <div className="tag-pile">
                      {(r.tags || []).map(t => <span key={t} className="tag-chip">{t}</span>)}
                    </div>
                  </td>
                  <td><StatusBadge status={r.salesStatus} /></td>
                  <td className="num"><strong>{r.price}</strong></td>
                  <td><span className="muted tiny">{r.updatedAt}</span></td>
                  <td className="actions" onClick={e => e.stopPropagation()}>
                    <a href="tour-option-detail.html" className="btn sm">編集</a>

                  </td>
                </tr>
              ))}

          </table>
        </div>
      </div>
    </div>
  );
}

function useMinPrice(visible, lookup) {
  return React.useMemo(() => {
    let min = Infinity;
    for (const l of visible) {
      const p = Number((lookup[l.code]?.price || "").replace(/[^\d]/g, ""));
      if (p && p < min) min = p;
    }
    return Number.isFinite(min) ? "¥" + min.toLocaleString() : "—";
  }, [visible, lookup]);
}

// app.jsx — Main shell + state + tweaks for deep_Admin
// Mounts at #root. Composes the sidebar, topbar, status strip, editor, preview,
// and check list. Form edits flow live into the preview because all data lives
// in this component's React state.

/* hooks declared at top of combined bundle */

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "regular",
  "side": "default",
  "accent": "teal",
  "validation": "live",
  "fontScale": 1.0
}/*EDITMODE-END*/;

// Accent presets — applied via inline CSS vars on <body>.
const ACCENTS = {
  teal:   { "--accent": "#0a5e5a", "--accent-strong": "#064a47", "--accent-soft": "#d6ebe8" },
  indigo: { "--accent": "#3a4ea3", "--accent-strong": "#293a82", "--accent-soft": "#dde3f6" },
  plum:   { "--accent": "#7a3859", "--accent-strong": "#5e2944", "--accent-soft": "#f0dee8" },
  ink:    { "--accent": "#1a1816", "--accent-strong": "#000000", "--accent-soft": "#e9e3d6" },
};

function applyAccent(name) {
  const cfg = ACCENTS[name] ?? ACCENTS.teal;
  for (const [k, v] of Object.entries(cfg)) document.body.style.setProperty(k, v);
}

// ── Validation logic — easy to demo via the Tweaks panel ───────────────────
function validate(tourOpt, mode, strict) {
  const v = {};
  if (!tourOpt.code || !/^[A-Z]-[A-Z]{3}-\d{3}-\d-[A-Z]{2}$/i.test(tourOpt.code)) {
    v.code = strict ? "コード形式が正しくありません（例: G-KYO-003-1-PR）" : null;
  }
  if (!tourOpt.name) v.name = "TourOption名は必須です";
  if (strict && Number(tourOpt.minBooking) > Number(tourOpt.maxBooking)) {
    v.minBooking = "最小人数が最大人数を超えています";
  }
  return v;
}

// ── Main App ───────────────────────────────────────────────────────────────

  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const [resource, setResource] = useState("tourOption");
  const [view, setView] = useState("list");
  const [mode, setMode] = useState("edit");
  const [tab, setTab] = useState("basic");

  const [selectedTemplate, setSelectedTemplate] = useState((SEED.cancelTemplates && SEED.cancelTemplates[0] && SEED.cancelTemplates[0].id) || null);

  const [productPage, setProductPage] = useState(SEED.productPage);
  const [linkedOptions, setLinkedOptions] = useState(SEED.linkedOptions);
  const [guideDocs, setGuideDocs] = useState(SEED.guideDocs);
  const [cancelTemplates, setCancelTemplates] = useState(SEED.cancelTemplates);

  // Apply tweaks to body
  useEffect(() => {
    document.body.dataset.density = t.density;
    document.body.dataset.side = t.side;
    document.body.style.fontSize = (14 * t.fontScale) + "px";
    applyAccent(t.accent);
  }, [t.density, t.side, t.accent, t.fontScale]);

  // When resource changes, reset to list view + first tab
  const didMountRef = React.useRef(false);
  useEffect(() => {
    if (!didMountRef.current) { didMountRef.current = true; return; }
    setView("list");
    const first = SEED.tabs[resource][0][0];
    if (!SEED.tabs[resource].some(([k]) => k === tab)) setTab(first);
  }, [resource]);

  // Sidebar wrapper that resets view to list whenever clicked
  const handleSetResource = useCallback((r) => {
    setResource(r);
    setView("list");
  }, []);

  const openDetail = useCallback((rowMode = "edit") => {
    window.location.href = 'tour-option-detail.html';
  }, []);

  const modeData = SEED.modes[mode];
  const tabsForResource = SEED.tabs[resource];
  const isReview = mode === "review";

  const updateTourOption = useCallback((patch) => setTourOption(s => ({ ...s, ...patch })), []);
  const updateProductPage = useCallback((patch) => setProductPage(s => ({ ...s, ...patch })), []);
  const updateLink = useCallback((id, patch) => setLinkedOptions(list =>

  ), []);

  const updateTemplate = useCallback((id, patch) => setCancelTemplates(list =>

  // Build lookup live from tourOption (so edits to the displayed TourOption flow into the product page preview's option picker too)

    [tourOption.code]: {
      selectionName: tourOption.selectionName,

      tags: tourOption.tags,
      price: tourOption.price,
      duration: tourOption.duration,
      capacity: `${tourOption.minBooking}〜${tourOption.maxBooking}名`,
    },
  }), [tourOption]);

  // Status strip values
  const statusValues = useMemo(() => {
    if (resource === "tourOption") return {
      id: mode === "create" ? "TO-自動採番" : tourOption.id,
      code: tourOption.code,
      status: mode === "create" ? "下書き" : tourOption.salesStatus,
      statusVariant: tourOption.salesStatus === "掲載中" ? "green" : tourOption.salesStatus === "非公開" ? "muted" : "blue",
      sub: tourOption.name,
    };
    if (resource === "guideDoc") {
      const d = guideDocs.find(x => x.id === selectedDoc) ?? guideDocs[0];
      return {
        id: d.id, code: `${d.scope} / ${d.type}`,
        status: `${d.assignedTo.length}件割り当て`,
        statusVariant: d.assignedTo.length > 0 ? "teal" : "muted",
        sub: d.name,
      };
    }
    if (resource === "cancelTemplate") {
      const x = cancelTemplates.find(c => c.id === selectedTemplate) ?? cancelTemplates[0];
      return {
        id: x.id, code: x.lang,
        status: x.enabled ? "有効" : "無効",
        statusVariant: x.enabled ? "teal" : "muted",
        sub: x.name,
      };
    }
    return {
      id: mode === "create" ? "PG-自動採番" : productPage.id,
      code: productPage.url,
      status: mode === "create" ? "下書き" : productPage.status,
      statusVariant: productPage.status === "掲載中" ? "green" : "blue",
      sub: productPage.displayTitle,
    };
  }, [resource, mode, tourOption, productPage, guideDocs, selectedDoc, cancelTemplates, selectedTemplate]);

  // Header label
  const headerLabel = resource === "tourOption" ? "TourOption" : resource === "productPage" ? "商品ページ" : resource === "cancelTemplate" ? "キャンセルポリシー" : "ガイド向け資料";

  // For productPage, preview pane is only shown on the 表示確認 tab
  const previewHidden = (resource === "productPage" && tab !== "pagePreview") || resource === "cancelTemplate";

  // ── Checks ────────────────────────────────────────────────────────────────
  const checks = useMemo(() => buildChecks(resource, { tourOption, productPage, guideDocs, selectedDoc, linkedOptions, validation, mode }), [resource, tourOption, productPage, guideDocs, selectedDoc, linkedOptions, validation, mode]);
  const doneCount = checks.filter(c => c[0] === "done").length;

  return (
    <div className="app-shell">
      <Sidebar resource={resource}
        counts={{ to: (SEED.tourOptionList||[]).length, pg: (SEED.productPageList||[]).length, gd: guideDocs.length, ct: cancelTemplates.length }} />

      <main className="workspace">
        {view === "list" ? (
          <ListShell
            resource={resource}
            headerLabel={headerLabel}
            onOpen={openDetail}
            guideDocs={guideDocs}
            cancelTemplates={cancelTemplates}
          />
        ) : (
        <React.Fragment>
        <div className="topbar">
          <div>
            <div className="crumbs">
              <span>deep_Admin</span>
              <span className="sep">/</span>
              <a className="crumb-link" onClick={() => setView("list")}>{headerLabel}</a>
              <span className="sep">/</span>
              <span className="current">{statusValues.sub || statusValues.id}</span>
            </div>
            <div className="title-row">
              <button className="btn ghost sm back-btn" onClick={() => setView("list")}>← 一覧に戻る</button>
              <h1>{headerLabel} 作成・編集・確認</h1>
              <span className={`status-pill ${statusValues.statusVariant}`}>
                <span className="dot"/>
                {statusValues.status}
              </span>
            </div>
          </div>
          <div className="flex-row" style={{gap:10}}>
            <div className="mode-switch" role="tablist">
              {Object.entries(SEED.modes).map(([k, m]) => (
                <button key={k} className={`mode-button ${mode === k ? "active" : ""}`} onClick={() => setMode(k)}>{m.label}</button>
              ))}
            </div>
          </div>
        </div>

        <div className="status-strip">
          <div className="status-cell id">
            <span className="status-label">内部ID</span>
            <strong>{statusValues.id}</strong>
          </div>
          <div className="status-cell">
            <span className="status-label">業務コード / URL</span>
            <strong className="code-mono" style={{fontSize:13}}>{statusValues.code}</strong>
          </div>
          <div className="status-cell">
            <span className="status-label">{resource === "guideDoc" ? "対象" : "ステータス"}</span>
            <strong>{statusValues.status}</strong>
          </div>
          <div className="status-cell">
            <span className="status-label">{resource === "guideDoc" ? "資料名" : resource === "tourOption" ? "TourOption名" : "表示タイトル"}</span>
            <strong>{statusValues.sub}</strong>
          </div>
          <div className="status-actions">
            <button className="btn icon" title="前へ" aria-label="前へ">‹</button>
            <button className="btn icon" title="次へ" aria-label="次へ">›</button>
            <button className="btn ghost sm" title="複製">複製</button>
            <button className="btn primary">{modeData.action}</button>
          </div>
        </div>

        <div className="content-grid" data-no-preview={previewHidden ? "true" : "false"}>
          <section className="editor-pane">
            <div className="tab-row" role="tablist">
              {tabsForResource.map(([key, label], i) => (
                <button key={key} className={`tab-button ${tab === key ? "active" : ""}`} onClick={() => setTab(key)}>
                  <span style={{opacity:0.55,fontVariantNumeric:'tabular-nums',marginRight:6,fontSize:11.5}}>{String(i+1).padStart(2,'0')}</span>
                  {label}
                </button>
              ))}
            </div>
            <div className="editor-content">
              {resource === "tourOption" && <TourOptionEditor tab={tab} mode={mode} data={tourOption} update={updateTourOption} validation={validation} />}
              {resource === "productPage" && <ProductPageEditor tab={tab} mode={mode} page={productPage} updatePage={updateProductPage} links={linkedOptions} updateLinks={updateLink} selectedLinkId={selectedLink} selectLink={setSelectedLink} lookup={lookup} />}
              {resource === "guideDoc" && <GuideDocEditor tab={tab} mode={mode} docs={guideDocs} updateDoc={updateDoc} selectedDocId={selectedDoc} selectDoc={setSelectedDoc} setTab={setTab} />}
              {resource === "cancelTemplate" && <CancelTemplateEditor tab={tab} mode={mode} templates={cancelTemplates} updateTemplate={updateTemplate} selectedTemplateId={selectedTemplate} selectTemplate={setSelectedTemplate} setTab={setTab} />}
            </div>
          </section>

          <aside className="preview-pane" style={previewHidden ? {display:'none'} : undefined}>
            <div className="preview-header">
              <div>
                <p className="eyebrow">Live Preview</p>
                <h2>{resource === "tourOption" ? "TourOption表示" : resource === "guideDoc" ? "ガイド表示" : "商品ページ表示"}</h2>
              </div>
              <span className="preview-badge"><span className="dot"/>{modeData.badge}</span>
            </div>
            <div style={{padding:0}}>
              {resource === "tourOption" && <TourOptionPreview t={tourOption} />}
              {resource === "productPage" && <ProductPagePreview page={productPage} links={linkedOptions} lookup={lookup} selectedLinkId={selectedLink} selectLink={setSelectedLink} tourOption={tourOption} />}
              {resource === "guideDoc" && <GuideDocPreview doc={guideDocs.find(d => d.id === selectedDoc) ?? guideDocs[0]} />}
            </div>
            <CheckArea checks={checks} done={doneCount} />
          </aside>
        </div>
        </React.Fragment>
        )}
      </main>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Layout" />
        <TweakRadio label="Density" value={t.density}
          options={["compact","regular","comfy"].map(o => ({value: o === "comfy" ? "comfortable" : o, label: o}))}
          onChange={v => setTweak('density', v)} />
        <TweakSlider label="Font scale" value={t.fontScale} min={0.9} max={1.15} step={0.05} unit="×"
          onChange={v => setTweak('fontScale', v)} />

        <TweakSection label="Theme" />
        <AccentPicker value={t.accent} onChange={v => setTweak('accent', v)} />
        <TweakRadio label="Sidebar" value={t.side}
          options={[{value:"default",label:"green"},{value:"mono",label:"dark"},{value:"light",label:"light"}]}
          onChange={v => setTweak('side', v)} />

        <TweakSection label="Validation" />
        <TweakRadio label="Mode" value={t.validation}
          options={[{value:"live",label:"live"},{value:"strict",label:"strict"}]}
          onChange={v => setTweak('validation', v)} />
      </TweaksPanel>
    </div>
  );
}

// ── ListShell — wraps the per-resource list view in the main workspace area
function ListShell({ resource, headerLabel, onOpen, guideDocs, cancelTemplates }) {
  return (
    <div className="list-shell">
      <div className="topbar list-topbar">
        <div>
          <div className="crumbs">
            <span>deep_Admin</span>
            <span className="sep">/</span>
            <span className="current">{headerLabel}</span>
          </div>
        </div>
      </div>
      {resource === "tourOption" && (
        <ListViews.TourOptionList rows={SEED.tourOptionList} onOpen={() => onOpen("edit")} onCreate={() => onOpen("create")} />
      )}
      {resource === "productPage" && (
        <ListViews.ProductPageList rows={SEED.productPageList} onOpen={() => onOpen("edit")} onCreate={() => onOpen("create")} />
      )}
      {resource === "guideDoc" && (
        <ListViews.GuideDocList rows={guideDocs} onOpen={() => onOpen("edit")} onCreate={() => onOpen("create")} />
      )}
      {resource === "cancelTemplate" && (
        <ListViews.CancelTemplateList rows={cancelTemplates} onOpen={() => onOpen("edit")} onCreate={() => onOpen("create")} />
      )}
    </div>
  );
}

// AccentPicker — small custom swatch row that emits the named key, not the hex
function AccentPicker({ value, onChange }) {
  const opts = [
    { value: "teal",   hex: "#0a5e5a" },
    { value: "indigo", hex: "#3a4ea3" },
    { value: "plum",   hex: "#7a3859" },
    { value: "ink",    hex: "#1a1816" },
  ];
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>Accent</span><span className="twk-val">{value}</span></div>
      <div style={{display:'flex',gap:6}}>
        {opts.map(o => (
          <button key={o.value} type="button" onClick={() => onChange(o.value)}
            title={o.value}
            style={{
              flex:1, height:30, padding:0, borderRadius:6, cursor:'pointer',
              background:o.hex, border:0,
              boxShadow: value === o.value
                ? '0 0 0 2px #fff, 0 0 0 3.5px rgba(0,0,0,.85)'
                : '0 0 0 .5px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.06)',
              transition:'box-shadow .12s',
            }} />
        ))}
      </div>
    </div>
  );
}

    { key: "cancelTemplate", href: "cancel-policies.html", icon: "CP", label: "キャンセルポリシー" },

  return (

        </div>
      </div>
      <div className="nav-group" style={{marginBottom:"8px"}}>
        <a href="index.html" className={`nav-item ${resource === "dashboard" ? "active" : ""}`} style={{textDecoration:"none"}}>
          <span className="nav-icon">⊞</span>
          <span style={{flex:1,minWidth:0}}><div>ダッシュボード</div></span>
        </a>
      </div>
      <div>
        <div className="nav-section-label">精算・経営</div>
        <div className="nav-group">
          {payItems.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${resource === it.key ? "active" : ""}`}
              style={{textDecoration:"none"}}>

          ))}

      <div>
        <div className="nav-section-label">ガイド管理</div>
        <div className="nav-group">
          {guideItems.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${resource === it.key ? "active" : ""}`}
              style={{textDecoration:"none"}}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
            </a>
          ))}
        </div>
      </div>
      <div>
        <div className="nav-section-label">施設管理</div>
        <div className="nav-group">
          {facilityItems.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${resource === it.key ? "active" : ""}`}
              style={{textDecoration:"none"}}>

              <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>

      </div>

        <div className="nav-section-label">商品管理</div>
        <div className="nav-group">
          {masterMainItems.map(it => (

          <div className="nav-section-label" style={{fontSize:"10px",color:"#999",padding:"8px 12px 4px",marginTop:"4px"}}>マスター</div>
          {masterSubItems.map(it => (

// ── Check area ─────────────────────────────────────────────────────────────

function CheckArea({ checks, done }) {
  const total = checks.length;
  const pct = total ? (done / total) * 100 : 0;
  const allGood = done === total;
  return (
    <div className="check-area">
      <div className="check-heading">
        <h3>公開前チェック</h3>
        <span className={`count ${allGood ? "" : "warn"}`}>{done} / {total} 完了</span>
      </div>
      <div className="check-progress">
        <div className="fill" style={{width: pct + "%"}}/>
      </div>
      <div className="check-list">
        {checks.map(([type, title, body], i) => (
          <div key={i} className={`check-item ${type}`}>
            <span className="check-mark">{type === "done" ? "✓" : type === "warn" ? "!" : "×"}</span>
            <div className="check-text">
              <strong>{title}</strong>
              <span>{body}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function buildChecks(resource, ctx) {
  const { tourOption, productPage, guideDocs, selectedDoc, linkedOptions, validation, mode } = ctx;

  if (resource === "tourOption") {
    return [
      ["done", "TourOption ID", "保存時に自動生成される"],
      [validation.code ? "error" : "done", "TourOptionコード", validation.code ?? "業務コードが一意に設定されている"],
      [tourOption.name ? "done" : "warn", "TourOption名", tourOption.name ? "設定済み" : "未設定"],
      [tourOption.shortDescription?.length > 80 ? "warn" : "done", "短い説明", tourOption.shortDescription?.length > 80 ? "80文字を超えています" : "適切な文字数"],
      [tourOption.meetingPlace ? "done" : "warn", "集合場所", tourOption.meetingPlace ? "設定済み" : "未設定"],
      [tourOption.price ? "done" : "warn", "基準販売価格", tourOption.price ? `${tourOption.price} で設定済み` : "未設定"],
      ["warn", "代表画像", "差し替え候補あり"],
      [tourOption.guestSchedule ? "done" : "warn", "ゲスト向けスケジュール", tourOption.guestSchedule ? "設定済み" : "未設定"],
    ];
  }
  if (resource === "guideDoc") {
    const doc = guideDocs.find(d => d.id === selectedDoc) ?? guideDocs[0];
    return [
      ["done", "資料ID", "保存時に自動生成される"],
      [doc.scope ? "done" : "warn", "スコープ", doc.scope ? `${doc.scope}として設定済み` : "未設定"],
      [doc.type ? "done" : "warn", "種別", doc.type ? `${doc.type}として設定済み` : "未設定"],
      [doc.name ? "done" : "warn", "資料名", doc.name ? "設定済み" : "未設定"],
      [doc.content ? "done" : "warn", "本文 / 案内ポイント", doc.content ? "設定済み" : "未設定"],
      [doc.assignedTo.length > 0 ? "done" : "warn", "TourOption割り当て", `${doc.assignedTo.length}件割り当て済み`],
    ];
  }
  const visible = linkedOptions.filter(l => l.visible);
  const sellable = linkedOptions.filter(l => l.sellable);
  const hasDefault = linkedOptions.some(l => l.default);
  return [
    ["done", "商品ページID", "保存時に自動生成される"],
    [productPage.displayTitle ? "done" : "warn", "ページ共通情報", productPage.displayTitle ? "タイトル・リード文・画像が設定済み" : "タイトル未設定"],
    [visible.length > 0 ? "done" : "error", "掲載TourOption", `${visible.length}件が表示中`],
    [sellable.length > 0 ? "done" : "warn", "販売ON", `${sellable.length}件が販売中`],
    [hasDefault ? "done" : "warn", "デフォルト選択", hasDefault ? "指定済み" : "未指定"],
    ["done", "プレビュー", "選択UIと詳細表示を確認済み"],
  ];
}
