<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>エリア編集 | deep_Admin</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="css/common.css">
</head>
  <body data-density="regular" data-side="default">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <script src="js/master-data.js"></script>
    <script type="text/babel" data-presets="react">
const { useState, useRef } = React;

const SEED_PREFECTURES = [
  { id: "pref-1", nameJa: "京都府",   nameEn: "Kyoto Prefecture",   slug: "kyoto",   areas: [
    { id: "area-1", nameJa: "祇園・東山エリア", nameEn: "Gion / Higashiyama" },
    { id: "area-2", nameJa: "嵐山エリア",       nameEn: "Arashiyama" },
    { id: "area-3", nameJa: "金閣寺・北野エリア", nameEn: "Kinkakuji / Kitano" },
    { id: "area-4", nameJa: "伏見稲荷エリア",   nameEn: "Fushimi Inari" },
  ]},
  { id: "pref-2", nameJa: "大阪府",   nameEn: "Osaka Prefecture",   slug: "osaka",   areas: [
    { id: "area-5", nameJa: "大阪難波エリア", nameEn: "Osaka Namba" },
    { id: "area-6", nameJa: "大阪梅田エリア", nameEn: "Osaka Umeda" },
  ]},
  { id: "pref-3", nameJa: "兵庫県",   nameEn: "Hyogo Prefecture",   slug: "hyogo",   areas: [
    { id: "area-7", nameJa: "神戸元町エリア", nameEn: "Kobe Motomachi" },
  ]},
  { id: "pref-4", nameJa: "奈良県",   nameEn: "Nara Prefecture",    slug: "nara",    areas: [
    { id: "area-8", nameJa: "奈良中心エリア", nameEn: "Central Nara" },
  ]},
  { id: "pref-5", nameJa: "東京都",   nameEn: "Tokyo",              slug: "tokyo",   areas: [] },
];

const params = new URLSearchParams(window.location.search);
const targetId = params.get("id");
const isCreate = params.get("mode") === "create" || !targetId;

// ── Sidebar ─────────────────────────────────────────────────────────────────
function Sidebar({ resource, counts = {} }) {
  const payItems = [
    { key: "settlement", href: "monthly-settlement.html", icon: "ST", label: "月次締め確認" },
    { key: "ota",      href: "ota-payment-matching.html", icon: "OT", label: "OTA入金照合" },
    { key: "revenue",  href: "revenue-summary.html",      icon: "RV", label: "収支一覧" },
  ];
  const guideItems = [
    { key: "guides", href: "guides.html", icon: "GM", label: "ガイド一覧" },
  ];
  const masterItems = [
    { key: "tourOption",     href: "tour-options.html",    icon: "TO", label: "TourOption",       count: counts.to },
    { key: "productPage",    href: "products.html",        icon: "PG", label: "商品ページ",          count: counts.pg },
    { key: "resource",       href: "resources.html",       icon: "RS", label: "リソース管理" },
    { key: "area",           href: "areas.html",           icon: "AR", label: "エリア管理" },
    { key: "facility",       href: "facilities.html",      icon: "FC", label: "施設管理" },
    { key: "language",       href: "languages.html",       icon: "LG", label: "言語マスター管理" },
    { key: "guideDoc",       href: "guide-materials.html", icon: "GD", label: "ガイド資料",         count: counts.gd },
    { key: "cancelTemplate", href: "cancel-policies.html", icon: "CP", label: "キャンセルポリシー" },
  ];
  return (
    <aside className="side-nav">
      <div className="brand-block">
        <div className="brand-mark">d.</div>
        <div>
          <div className="brand-name">deep_Admin</div>
          <div className="brand-caption">Product &amp; Sales · Phase 1</div>
        </div>
      </div>
      <div className="nav-group" style={{marginBottom:"8px"}}>
        <a href="index.html" className={`nav-item ${resource === "dashboard" ? "active" : ""}`} style={{textDecoration:"none"}}>
          <span className="nav-icon">⊞</span>
          <span style={{flex:1,minWidth:0}}><div>ダッシュボード</div></span>
        </a>
      </div>
      <div>
        <div className="nav-section-label">精算・経営</div>
        <div className="nav-group">
          {payItems.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${resource === it.key ? "active" : ""}`}
              style={{textDecoration:"none"}}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
            </a>
          ))}
        </div>
      </div>
      <div>
        <div className="nav-section-label">ガイド管理</div>
        <div className="nav-group">
          {guideItems.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${resource === it.key ? "active" : ""}`}
              style={{textDecoration:"none"}}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
            </a>
          ))}
        </div>
      </div>
      <div>
        <div className="nav-section-label">商品管理</div>
        <div className="nav-group">
          {masterItems.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${resource === it.key ? "active" : ""}`}
              style={{textDecoration:"none"}}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
              <span className="nav-count">{it.count}</span>
            </a>
          ))}
        </div>
      </div>
      <div className="sidebar-footer">
        <a href="login.html" className="nav-item nav-logout" style={{textDecoration:"none"}}>
          <span className="nav-icon">↩</span><span>ログアウト</span>
        </a>
      </div>
    </aside>
  );
}

// ── LangTabs ─────────────────────────────────────────────────────────────────
function LangTabs({ value, onChange }) {
  return (
    <div style={{display:'flex',gap:0,borderBottom:'1px solid var(--line)'}}>
      {[["en","English"],["ja","日本語"]].map(([code,label]) => (
        <button key={code}
          style={{padding:'8px 18px',border:'none',background:'none',cursor:'pointer',
            borderBottom:value===code?'2px solid var(--accent)':'2px solid transparent',
            fontWeight:value===code?700:400,color:value===code?'var(--accent)':'var(--muted)',fontSize:13}}
          onClick={() => onChange(code)}>{label}</button>
      ))}
    </div>
  );
}

// ── App ──────────────────────────────────────────────────────────────────────
function App() {
  const seed = SEED_PREFECTURES.find(p => p.id === targetId);
  const [form, setForm] = useState(seed ? { ...seed, areas: [...seed.areas] } : {
    id: "",
    nameJa: "",
    nameEn: "",
    slug: "",
    areas: [],
  });
  const [prefLang, setPrefLang] = useState("en");

  const [areas, setAreas] = useState(form.areas);
  const [showAddForm, setShowAddForm] = useState(false);
  const [newAreaJa, setNewAreaJa] = useState("");
  const [newAreaEn, setNewAreaEn] = useState("");
  const [newAreaLang, setNewAreaLang] = useState("en");
  const [editingAreaId, setEditingAreaId] = useState(null);
  const [editAreaJa, setEditAreaJa] = useState("");
  const [editAreaEn, setEditAreaEn] = useState("");
  const [editAreaLang, setEditAreaLang] = useState("en");

  const update = patch => setForm(s => ({ ...s, ...patch }));
  const pageTitle = isCreate ? "都道府県を追加" : (prefLang === "en" ? form.nameEn || form.nameJa : form.nameJa || form.nameEn);

  const addArea = () => {
    if (!newAreaJa && !newAreaEn) return;
    setAreas(prev => [...prev, { id: `area-new-${Date.now()}`, nameJa: newAreaJa, nameEn: newAreaEn }]);
    setNewAreaJa(""); setNewAreaEn(""); setShowAddForm(false);
  };

  const deleteArea = id => setAreas(prev => prev.filter(a => a.id !== id));

  const startEdit = area => {
    setEditingAreaId(area.id);
    setEditAreaJa(area.nameJa);
    setEditAreaEn(area.nameEn);
    setEditAreaLang("en");
  };

  const saveEdit = () => {
    setAreas(prev => prev.map(a => a.id === editingAreaId ? { ...a, nameJa: editAreaJa, nameEn: editAreaEn } : a));
    setEditingAreaId(null);
  };

  return (
    <div className="app-shell">
      <Sidebar />
      <main className="workspace">
        <div className="topbar">
          <div className="topbar-left">
            <div className="crumbs">
              <a href="index.html" className="crumb-link">deep_Admin</a>
              <span className="sep">/</span>
              <a href="areas.html" className="crumb-link">エリア管理</a>
              <span className="sep">/</span>
              <span className="current">{isCreate ? "新規追加" : pageTitle}</span>
            </div>
          </div>
        </div>

        <div className="status-strip">
          <div className="status-cell fill">
            <span className="status-label">都道府県名</span>
            <strong>{pageTitle || "—"}</strong>
          </div>
          <div className="status-actions">
            <a href="areas.html" className="btn">キャンセル</a>
            <button className="btn primary" onClick={() => window.location.href = "areas.html"}>
              {isCreate ? "保存" : "更新保存"}
            </button>
          </div>
        </div>

        <div className="content-grid" data-no-preview="true">
          <section className="editor-pane">
            <div className="editor-content">

          {/* スラッグ（共通項目） */}
          <div className="form-section">
            <div style={{fontWeight:600,fontSize:13,marginBottom:12,color:'var(--muted)',letterSpacing:'.05em',textTransform:'uppercase'}}>共通項目</div>
            <div style={{background:'var(--surface)',border:'1px solid var(--line)',borderRadius:6,padding:'16px'}}>
              <div className="field-wide">
                <label className="field-label">
                  <span>スラッグ</span>
                  <span className="req" aria-label="required" />
                </label>
                <input type="text" value={form.slug} onChange={e => update({ slug: e.target.value.replace(/[^a-z0-9-]/g, "") })}
                  placeholder="e.g. kyoto"
                  style={{width:'100%',padding:'7px 10px',border:'1px solid var(--line)',borderRadius:4,fontSize:13,fontFamily:'monospace'}} />
                <div className="field-help">※この値は、フロント画面で都道府県の識別子としてURLに使用されます。半角英数、ハイフンのみで登録してください。</div>
              </div>
            </div>
          </div>

          {/* 都道府県名 多言語タブ */}
          <div className="form-section">
            <div style={{fontWeight:600,fontSize:13,marginBottom:12,color:'var(--muted)',letterSpacing:'.05em',textTransform:'uppercase'}}>都道府県名</div>
            <div style={{border:'1.5px solid var(--accent)',borderRadius:6,padding:'0 16px 16px'}}>
              <LangTabs value={prefLang} onChange={setPrefLang} />
              <div style={{paddingTop:14}}>
                {prefLang === "en" ? (
                  <div className="field-wide">
                    <label className="field-label"><span>都道府県名（English）</span><span className="req" aria-label="required" /></label>
                    <input type="text" value={form.nameEn} onChange={e => update({ nameEn: e.target.value })}
                      placeholder="e.g. Kyoto Prefecture"
                      style={{width:'100%',padding:'7px 10px',border:'1px solid var(--line)',borderRadius:4,fontSize:13}} />
                  </div>
                ) : (
                  <div className="field-wide">
                    <label className="field-label"><span>都道府県名（日本語）</span><span className="req" aria-label="required" /></label>
                    <input type="text" value={form.nameJa} onChange={e => update({ nameJa: e.target.value })}
                      placeholder="例：京都府"
                      style={{width:'100%',padding:'7px 10px',border:'1px solid var(--line)',borderRadius:4,fontSize:13}} />
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* エリア一覧 */}
          <div className="form-section">
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
              <div style={{fontWeight:600,fontSize:13,color:'var(--muted)',letterSpacing:'.05em',textTransform:'uppercase'}}>紐づくエリア</div>
              {!showAddForm && (
                <button className="btn primary" onClick={() => { setShowAddForm(true); setEditingAreaId(null); }}>＋ エリアを追加</button>
              )}
            </div>

            {/* エリア追加フォーム */}
            {showAddForm && (
              <div style={{border:'1.5px solid var(--accent)',borderRadius:6,padding:'0 16px 16px',marginBottom:16}}>
                <div style={{fontWeight:600,fontSize:12,color:'var(--accent)',padding:'10px 0 8px',letterSpacing:'.04em'}}>新規エリアを追加</div>
                <LangTabs value={newAreaLang} onChange={setNewAreaLang} />
                <div style={{paddingTop:12}}>
                  {newAreaLang === "en" ? (
                    <div className="field-wide">
                      <label className="field-label"><span>エリア名（English）</span></label>
                      <input type="text" value={newAreaEn} onChange={e => setNewAreaEn(e.target.value)}
                        placeholder="e.g. Gion / Higashiyama"
                        style={{width:'100%',padding:'7px 10px',border:'1px solid var(--line)',borderRadius:4,fontSize:13}} />
                    </div>
                  ) : (
                    <div className="field-wide">
                      <label className="field-label"><span>エリア名（日本語）</span></label>
                      <input type="text" value={newAreaJa} onChange={e => setNewAreaJa(e.target.value)}
                        placeholder="例：祇園・東山エリア"
                        style={{width:'100%',padding:'7px 10px',border:'1px solid var(--line)',borderRadius:4,fontSize:13}} />
                    </div>
                  )}
                </div>
                <div style={{display:'flex',gap:8,marginTop:12}}>
                  <button className="btn primary" onClick={addArea}>追加</button>
                  <button className="btn" onClick={() => { setShowAddForm(false); setNewAreaJa(""); setNewAreaEn(""); }}>キャンセル</button>
                </div>
              </div>
            )}

            <div className="list-table-wrap">
              <table className="list-table">
                <thead>
                  <tr>
                    <th>エリア名（日本語）</th>
                    <th>エリア名（English）</th>
                    <th className="actions" style={{width:120}}></th>
                  </tr>
                </thead>
                <tbody>
                  {areas.map(a => (
                    <tr key={a.id}>
                      {editingAreaId === a.id ? (
                        <>
                          <td colSpan={2}>
                            <div style={{border:'1.5px solid var(--accent)',borderRadius:6,padding:'0 14px 14px'}}>
                              <LangTabs value={editAreaLang} onChange={setEditAreaLang} />
                              <div style={{paddingTop:10}}>
                                {editAreaLang === "en" ? (
                                  <input type="text" value={editAreaEn} onChange={e => setEditAreaEn(e.target.value)}
                                    placeholder="e.g. Gion / Higashiyama"
                                    style={{width:'100%',padding:'6px 10px',border:'1px solid var(--line)',borderRadius:4,fontSize:13}} />
                                ) : (
                                  <input type="text" value={editAreaJa} onChange={e => setEditAreaJa(e.target.value)}
                                    placeholder="例：祇園・東山エリア"
                                    style={{width:'100%',padding:'6px 10px',border:'1px solid var(--line)',borderRadius:4,fontSize:13}} />
                                )}
                              </div>
                            </div>
                          </td>
                          <td className="actions">
                            <button className="btn primary sm" onClick={saveEdit}>保存</button>
                            <button className="btn sm" onClick={() => setEditingAreaId(null)} style={{marginLeft:4}}>✕</button>
                          </td>
                        </>
                      ) : (
                        <>
                          <td><strong>{a.nameJa || <span style={{color:'var(--muted)'}}>—</span>}</strong></td>
                          <td style={{color:'var(--muted)'}}>{a.nameEn || "—"}</td>
                          <td className="actions">
                            <button className="btn sm" onClick={() => startEdit(a)}>編集</button>
                            <button className="btn sm danger" onClick={() => deleteArea(a.id)} style={{marginLeft:4}}>削除</button>
                          </td>
                        </>
                      )}
                    </tr>
                  ))}
                  {areas.length === 0 && (
                    <tr>
                      <td colSpan={3} className="list-empty">エリアが登録されていません</td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>

            </div>
          </section>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
