<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>施設管理 | deep_Admin</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="css/common.css">
  </head>
  <body data-density="regular" data-side="default">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <script src="js/master-data.js"></script>
    <script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useMemo } = React;

const SEED_FACILITIES = [
  { id: "fac-1", name: "嵐山竹林体験センター", subtype: "竹細工・着物体験",   prefecture: "京都府", address: "京都市右京区嵯峨天龍寺芒ノ馬場町", phone: "075-XXX-XXXX", costCount: 3, updatedAt: "2026/06/10", status: "active" },
  { id: "fac-2", name: "伏見稲荷大社",         subtype: "神社参拝・祈祷",     prefecture: "京都府", address: "京都市伏見区深草藪之内町",          phone: "075-YYY-YYYY", costCount: 2, updatedAt: "2026/06/08", status: "active" },
  { id: "fac-3", name: "金閣寺（鹿苑寺）",     subtype: "寺院・観光",         prefecture: "京都府", address: "京都市北区金閣寺町",                phone: "075-ZZZ-ZZZZ", costCount: 1, updatedAt: "2026/05/30", status: "active" },
  { id: "fac-4", name: "京町家体験 山田屋",     subtype: "町家宿泊・茶道体験", prefecture: "京都府", address: "京都市中京区",                      phone: "075-AAA-AAAA", costCount: 4, updatedAt: "2026/06/01", status: "active" },
  { id: "fac-5", name: "宇治茶農家 田中園",     subtype: "お茶摘み・茶道",     prefecture: "京都府", address: "宇治市",                            phone: "0774-BBB-BBBB", costCount: 2, updatedAt: "2026/04/15", status: "inactive" },
];

const PREFECTURES = ["大阪府","京都府","奈良県","兵庫県","滋賀県","和歌山県","三重県","東京都","神奈川県","愛知県","福岡県","北海道","沖縄県"];

// ── click-outside hook ───────────────────────────────────────────────────────
function useClickOutside(ref, onOutside) {
  useEffect(() => {
    function handle(e) { if (ref.current && !ref.current.contains(e.target)) onOutside(); }
    document.addEventListener("mousedown", handle);
    return () => document.removeEventListener("mousedown", handle);
  }, [ref, onOutside]);
}

// ── SearchBar ────────────────────────────────────────────────────────────────
function SearchBar({ value, onChange, placeholder }) {
  return (
    <div className="lf-search">
      <span className="lf-search-ico" aria-hidden="true">⌕</span>
      <input type="text" value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} />
      {value && <button className="lf-search-clear" onClick={() => onChange("")} aria-label="クリア">×</button>}
    </div>
  );
}

// ── SingleSelectDropdown ─────────────────────────────────────────────────────
function SingleSelectDropdown({ label, options, value, onChange, allLabel = "すべて" }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useClickOutside(ref, () => setOpen(false));
  const active = value && value !== allLabel;
  return (
    <div className={`lf-dropdown ${active ? "is-active" : ""}`} ref={ref}>
      <button type="button" className="lf-dropdown-btn" onClick={() => setOpen(o => !o)}>
        <span className="lf-dropdown-label">{label}</span>
        {active && <span className="lf-dropdown-count">{value}</span>}
        <span className="lf-caret">▾</span>
      </button>
      {open && (
        <div className="lf-dropdown-menu">
          <label className="lf-dropdown-item">
            <input type="radio" name={`single-${label}`} checked={!active} onChange={() => { onChange(allLabel); setOpen(false); }} />
            <span>{allLabel}</span>
          </label>
          {options.map(opt => (
            <label key={opt} className="lf-dropdown-item">
              <input type="radio" name={`single-${label}`} checked={value === opt} onChange={() => { onChange(opt); setOpen(false); }} />
              <span>{opt}</span>
            </label>
          ))}
        </div>
      )}
    </div>
  );
}

// ── Sidebar ──────────────────────────────────────────────────────────────────
function Sidebar({ resource, counts = {} }) {
  const payItems = [
    { key: "settle",   href: "monthly-settlement.html",   icon: "ST", label: "月次締め確認" },
    { key: "ota",      href: "ota-payment-matching.html", icon: "OT", label: "OTA入金照合" },
    { key: "revenue",  href: "revenue-summary.html",      icon: "RV", label: "収支一覧" },
  ];
  const masterItems = [
    { key: "tourOption",     href: "tour-options.html",    icon: "TO", label: "TourOption",       count: counts.to },
    { key: "productPage",    href: "products.html",        icon: "PG", label: "商品ページ",          count: counts.pg },
    { key: "resource",       href: "resources.html",       icon: "RS", label: "リソース管理" },
    { key: "area",           href: "areas.html",           icon: "AR", label: "エリア管理" },
    { key: "facility",       href: "facilities.html",      icon: "FC", label: "施設管理" },
    { key: "language",       href: "languages.html",       icon: "LG", label: "言語マスター管理" },
    { key: "guideDoc",       href: "guide-materials.html", icon: "GD", label: "ガイド資料",         count: counts.gd },
    { key: "cancelTemplate", href: "cancel-policies.html", icon: "CP", label: "キャンセルポリシー" },
  ];
  return (
    <aside className="side-nav">
      <div className="brand-block">
        <div className="brand-mark">d.</div>
        <div>
          <div className="brand-name">deep_Admin</div>
          <div className="brand-caption">Product &amp; Sales · Phase 1</div>
        </div>
      </div>
      <div className="nav-group" style={{marginBottom:"8px"}}>
        <a href="index.html" className={`nav-item ${resource === "dashboard" ? "active" : ""}`} style={{textDecoration:"none"}}>
          <span className="nav-icon">⊞</span>
          <span style={{flex:1,minWidth:0}}><div>ダッシュボード</div></span>
        </a>
      </div>
      <div>
        <div className="nav-section-label">精算・経営</div>
        <div className="nav-group">
          {payItems.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${resource === it.key ? "active" : ""}`}
              style={{textDecoration:"none"}}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
            </a>
          ))}
        </div>
      </div>
      <div>
        <div className="nav-section-label">商品管理</div>
        <div className="nav-group">
          {masterItems.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${resource === it.key ? "active" : ""}`}
              style={{textDecoration:"none"}}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
              <span className="nav-count">{it.count}</span>
            </a>
          ))}
        </div>
      </div>
    </aside>
  );
}

// ── StatusBadge ──────────────────────────────────────────────────────────────
function StatusBadge({ status }) {
  const map = {
    active:   { label: "有効",  variant: "green" },
    inactive: { label: "無効",  variant: "coral" },
  };
  const s = map[status] || map.inactive;
  return <span className={`badge ${s.variant}`}><span className="dot" />{s.label}</span>;
}

// ── StatusSummary ─────────────────────────────────────────────────────────────
function StatusSummary({ counts }) {
  return (
    <div className="list-summary">
      <div className="summary-item">
        <span className="dot green" /><span className="label">有効</span>
        <strong>{counts.active ?? 0}</strong><span className="unit">件</span>
      </div>
      <div className="summary-item">
        <span className="dot coral" /><span className="label">無効</span>
        <strong>{counts.inactive ?? 0}</strong><span className="unit">件</span>
      </div>
    </div>
  );
}

// ── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [facilities] = useState(SEED_FACILITIES);
  const [search,       setSearch]       = useState("");
  const [filterPref,   setFilterPref]   = useState("すべて");
  const [filterStatus, setFilterStatus] = useState("すべて");

  const filtered = useMemo(() => {
    const s = search.trim().toLowerCase();
    return facilities.filter(f => {
      if (s && ![f.name, f.address, f.subtype].some(v => v && v.toLowerCase().includes(s))) return false;
      if (filterPref   !== "すべて" && f.prefecture !== filterPref)   return false;
      if (filterStatus !== "すべて") {
        const want = filterStatus === "有効" ? "active" : "inactive";
        if (f.status !== want) return false;
      }
      return true;
    });
  }, [facilities, search, filterPref, filterStatus]);

  const counts = facilities.reduce((acc, f) => { acc[f.status] = (acc[f.status] ?? 0) + 1; return acc; }, {});
  const hasFilter = !!search || filterPref !== "すべて" || filterStatus !== "すべて";

  return (
    <div className="app-shell">
      <Sidebar />
      <div style={{flex:1,padding:'var(--sp-5)',display:'flex',flexDirection:'column',gap:14,minWidth:0,overflowY:'auto'}}>
      <div className="list-shell">
        <div className="topbar list-topbar">
          <div className="crumbs">
            <a href="index.html" className="crumb-link">deep_Admin</a>
            <span className="sep">/</span>
            <span className="current">施設管理</span>
          </div>
        </div>

        <div className="list-view">
          <div className="list-header">
            <div>
              <h1>施設管理</h1>
              <p className="list-desc">ツアーで使用する体験施設・観光スポット・飲食施設などを管理します。</p>
            </div>
            <div style={{alignSelf:'flex-start'}}>
              <a href="facility-detail.html?mode=create" className="btn primary">＋ 新規登録</a>
            </div>
          </div>

          <div className="list-filters">
            <div style={{display:'flex',gap:6,alignItems:'center'}}>
              <SearchBar value={search} onChange={setSearch} placeholder="施設名・住所・エリアで検索..." />
            </div>
            <div className="lf-controls">
              <SingleSelectDropdown label="都道府県" options={PREFECTURES} value={filterPref} onChange={setFilterPref} />
              <SingleSelectDropdown label="ステータス" options={["有効","無効"]} value={filterStatus} onChange={setFilterStatus} />
              {hasFilter && (
                <button type="button" className="lf-link clear-all"
                  onClick={() => { setSearch(""); setFilterPref("すべて"); setFilterStatus("すべて"); }}>
                  フィルターを解除
                </button>
              )}
            </div>
          </div>

          <StatusSummary counts={counts} />

          <div className="list-table-wrap">
            <table className="list-table">
              <thead>
                <tr>
                  <th style={{width:44,textAlign:'center'}}>NO</th>
                  <th>施設名</th>
                  <th style={{width:90,textAlign:'center'}}>都道府県</th>
                  <th>住所</th>
                  <th style={{width:140}}>連絡先</th>
                  <th style={{width:80,textAlign:'center'}}>経費項目数</th>
                  <th style={{width:72,textAlign:'center'}}>ステータス</th>
                  <th style={{width:90,textAlign:'center'}}>最終更新</th>
                  <th className="actions" style={{width:72}}></th>
                </tr>
              </thead>
              <tbody>
                {filtered.map((f, idx) => (
                  <tr key={f.id} className="list-row" onClick={() => { window.location.href = `facility-detail.html?id=${f.id}`; }}>
                    <td style={{textAlign:'center',color:'var(--muted)',fontSize:13}}>{idx + 1}</td>
                    <td>
                      <div style={{fontWeight:700,fontSize:14}}>{f.name}</div>
                      {f.subtype && <div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>{f.subtype}</div>}
                    </td>
                    <td style={{textAlign:'center',fontSize:13}}>{f.prefecture}</td>
                    <td style={{fontSize:13,color:'#2563eb'}}>{f.address}</td>
                    <td style={{fontSize:13}}>{f.phone}</td>
                    <td style={{textAlign:'center',fontWeight:700,fontSize:14,color:'#2563eb'}}>{f.costCount}</td>
                    <td style={{textAlign:'center'}}><StatusBadge status={f.status} /></td>
                    <td style={{textAlign:'center',fontSize:12,color:'var(--muted)'}}>{f.updatedAt}</td>
                    <td className="actions">
                      <a href={`facility-detail.html?id=${f.id}`} className="btn sm" onClick={e => e.stopPropagation()}>編集</a>
                    </td>
                  </tr>
                ))}
                {filtered.length === 0 && (
                  <tr><td colSpan={9} className="list-empty">施設が登録されていません</td></tr>
                )}
              </tbody>
            </table>
          </div>

          <div style={{marginTop:8,fontSize:12,color:'var(--muted)'}}>
            {filtered.length} 件 / 全 {facilities.length} 件
          </div>
        </div>
      </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
