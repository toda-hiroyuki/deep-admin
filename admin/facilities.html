<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>施設管理 | deep_Admin</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="css/common.css">
  </head>
  <body data-density="regular" data-side="default">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <script src="js/master-data.js"></script>
    <script type="text/babel" data-presets="react">
const { useState } = React;

const SEED_FACILITIES = [
  { id: "fac-1", name: "嵐山竹林体験センター", subtype: "竹細工・着物体験",  prefecture: "京都府", address: "京都市右京区嵯峨天龍寺芒ノ馬場町", phone: "075-XXX-XXXX", costCount: 3, updatedAt: "2026/06/10", status: "active" },
  { id: "fac-2", name: "伏見稲荷大社",         subtype: "神社参拝・祈祷",    prefecture: "京都府", address: "京都市伏見区深草藪之内町",          phone: "075-YYY-YYYY", costCount: 2, updatedAt: "2026/06/08", status: "active" },
  { id: "fac-3", name: "金閣寺（鹿苑寺）",     subtype: "寺院・観光",        prefecture: "京都府", address: "京都市北区金閣寺町",                phone: "075-ZZZ-ZZZZ", costCount: 1, updatedAt: "2026/05/30", status: "active" },
  { id: "fac-4", name: "京町家体験 山田屋",     subtype: "町家宿泊・茶道体験", prefecture: "京都府", address: "京都市中京区",                      phone: "075-AAA-AAAA", costCount: 4, updatedAt: "2026/06/01", status: "active" },
  { id: "fac-5", name: "宇治茶農家 田中園",     subtype: "お茶摘み・茶道",    prefecture: "京都府", address: "宇治市",                            phone: "0774-BBB-BBBB", costCount: 2, updatedAt: "2026/04/15", status: "inactive" },
];

const FACILITY_TYPES = ["体験施設", "観光スポット", "飲食施設", "宿泊施設", "移動施設", "その他"];
const PREFECTURES = ["大阪府","京都府","奈良県","兵庫県","滋賀県","和歌山県","三重県","東京都","神奈川県","愛知県","福岡県","北海道","沖縄県"];

// ── Sidebar ─────────────────────────────────────────────────────────────────
function Sidebar() {
  const items = [
    { key: "dashboard",      href: "index.html",           icon: "⊞", label: "ダッシュボード" },
    { key: "tourOption",     href: "tour-options.html",    icon: "TO", label: "TourOption",        hint: "ツアーの実体" },
    { key: "productPage",    href: "products.html",        icon: "PG", label: "商品ページ",           hint: "顧客表示" },
    { key: "resource",       href: "resources.html",       icon: "RS", label: "リソース管理",          hint: "機材・車両等" },
    { key: "area",           href: "areas.html",           icon: "AR", label: "エリア管理",           hint: "都道府県・エリア" },
    { key: "facility",       href: "facilities.html",      icon: "FC", label: "施設管理",             hint: "体験施設・観光スポット" },
    { key: "language",       href: "languages.html",       icon: "LG", label: "言語マスター管理",     hint: "対応言語" },
    { key: "guideDoc",       href: "guide-materials.html", icon: "GD", label: "ガイド資料",           hint: "運営注意・行程" },
    { key: "cancelTemplate", href: "cancel-policies.html", icon: "CP", label: "キャンセルポリシー",   hint: "キャンセル文言" },
  ];
  return (
    <aside className="side-nav">
      <div className="brand-block">
        <div className="brand-mark">d.</div>
        <div>
          <div className="brand-name">deep_Admin</div>
          <div className="brand-caption">Product &amp; Sales · Phase 1</div>
        </div>
      </div>
      <div>
        <div className="nav-section-label">Manage</div>
        <div className="nav-group">
          {items.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${it.key === "facility" ? "active" : ""}`}
              style={{textDecoration:"none"}}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1,minWidth:0}}>
                <div>{it.label}</div>
              </span>
            </a>
          ))}
        </div>
      </div>
      <div className="side-note">
        <strong>施設管理</strong>
        ツアーで使用する体験施設・観光スポット・飲食施設などを管理します。TourOptionの提供条件から参照されます。
      </div>
    </aside>
  );
}

// ── StatusBadge ──────────────────────────────────────────────────────────────
function StatusBadge({ status }) {
  const map = {
    active:   { label: "有効",   bg: "#d1fae5", color: "#065f46" },
    inactive: { label: "無効",   bg: "#fee2e2", color: "#991b1b" },
  };
  const s = map[status] || map.inactive;
  return (
    <span style={{display:"inline-block",padding:"2px 8px",borderRadius:99,fontSize:11,background:s.bg,color:s.color,fontWeight:600}}>
      {s.label}
    </span>
  );
}

// ── SelectBox ────────────────────────────────────────────────────────────────
function SelectBox({ value, onChange, options, style = {} }) {
  return (
    <div style={{position:'relative', display:'inline-block', ...style}}>
      <select
        value={value}
        onChange={e => onChange(e.target.value)}
        style={{appearance:'none',WebkitAppearance:'none',paddingRight:28,paddingLeft:10,paddingTop:7,paddingBottom:7,border:'1px solid var(--border)',borderRadius:6,fontSize:13,background:'white',cursor:'pointer',width:'100%'}}
      >
        {options.map(o => typeof o === 'string'
          ? <option key={o} value={o}>{o}</option>
          : <option key={o.value} value={o.value}>{o.label}</option>
        )}
      </select>
      <span style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',fontSize:10,color:'#666'}}>▼</span>
    </div>
  );
}

// ── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [facilities] = useState(SEED_FACILITIES);
  const [keyword,      setKeyword]      = useState("");
  const [filterPref,   setFilterPref]   = useState("");
  const [filterStatus, setFilterStatus] = useState("");

  const filtered = facilities.filter(f => {
    if (keyword) {
      const kw = keyword.toLowerCase();
      if (![f.name, f.address, f.subtype].some(s => s && s.toLowerCase().includes(kw))) return false;
    }
    if (filterPref   && f.prefecture !== filterPref)   return false;
    if (filterStatus && f.status     !== filterStatus) return false;
    return true;
  });

  return (
    <div className="app-shell">
      <Sidebar />
      <div style={{flex:1,padding:'var(--sp-5)',display:'flex',flexDirection:'column',gap:14,minWidth:0,overflowY:'auto'}}>
      <div className="list-shell">
        <div className="topbar list-topbar">
          <div>
            <div className="crumbs">
              <a href="index.html" className="crumb-link">deep_Admin</a>
              <span className="sep">/</span>
              <span className="current">施設管理</span>
            </div>
          </div>
        </div>

        <div className="list-view">
          <div className="list-header">
            <div>
              <h1>施設管理</h1>
            </div>
            <div style={{alignSelf:'flex-start'}}>
              <a href="facility-detail.html?mode=create" className="btn primary">＋ 新規登録</a>
            </div>
          </div>

          {/* 検索バー */}
          <div style={{display:'flex',gap:10,marginBottom:20,flexWrap:'wrap',alignItems:'center'}}>
            <input
              type="text"
              value={keyword}
              onChange={e => setKeyword(e.target.value)}
              placeholder="施設名・住所・エリアで検索..."
              style={{padding:'7px 12px',border:'1px solid var(--border)',borderRadius:6,fontSize:13,width:260,outline:'none'}}
            />
            <SelectBox
              value={filterPref}
              onChange={setFilterPref}
              options={[{value:"",label:"都道府県（すべて）"}, ...PREFECTURES.map(p => ({value:p,label:p}))]}
              style={{width:170}}
            />
            <SelectBox
              value={filterStatus}
              onChange={setFilterStatus}
              options={[{value:"",label:"すべてのステータス"},{value:"active",label:"有効"},{value:"inactive",label:"無効"}]}
              style={{width:160}}
            />
            <div style={{flex:1}} />
            <button
              style={{padding:'7px 14px',border:'1px solid var(--border)',borderRadius:6,fontSize:13,background:'white',cursor:'pointer'}}
            >CSV出力</button>
          </div>

          <div className="list-table-wrap">
            <table className="list-table">
              <thead>
                <tr>
                  <th style={{width:44,textAlign:'center'}}>NO</th>
                  <th>施設名</th>
                  <th style={{width:90,textAlign:'center'}}>都道府県</th>
                  <th>住所</th>
                  <th style={{width:140}}>連絡先</th>
                  <th style={{width:80,textAlign:'center'}}>経費項目数</th>
                  <th style={{width:72,textAlign:'center'}}>ステータス</th>
                  <th style={{width:90,textAlign:'center'}}>最終更新</th>
                  <th className="actions" style={{width:72}}></th>
                </tr>
              </thead>
              <tbody>
                {filtered.map((f, idx) => (
                  <tr key={f.id} className="list-row" onClick={() => { window.location.href = `facility-detail.html?id=${f.id}`; }}>
                    <td style={{textAlign:'center',color:'var(--muted)',fontSize:13}}>{idx + 1}</td>
                    <td>
                      <div style={{fontWeight:700,fontSize:14}}>{f.name}</div>
                      {f.subtype && <div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>{f.subtype}</div>}
                    </td>
                    <td style={{textAlign:'center',fontSize:13}}>{f.prefecture}</td>
                    <td style={{fontSize:13,color:'#2563eb'}}>{f.address}</td>
                    <td style={{fontSize:13}}>{f.phone}</td>
                    <td style={{textAlign:'center',fontWeight:700,fontSize:14,color:'#2563eb'}}>{f.costCount}</td>
                    <td style={{textAlign:'center'}}>
                      <StatusBadge status={f.status} />
                    </td>
                    <td style={{textAlign:'center',fontSize:12,color:'var(--muted)'}}>{f.updatedAt}</td>
                    <td className="actions">
                      <a href={`facility-detail.html?id=${f.id}`} className="btn sm" onClick={e => e.stopPropagation()}>編集</a>
                    </td>
                  </tr>
                ))}
                {filtered.length === 0 && (
                  <tr>
                    <td colSpan={9} className="list-empty">施設が登録されていません</td>
                  </tr>
                )}
              </tbody>
            </table>
          </div>

          <div style={{marginTop:8,fontSize:12,color:'var(--muted)'}}>
            {filtered.length} 件 / 全 {facilities.length} 件
          </div>
        </div>
      </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
