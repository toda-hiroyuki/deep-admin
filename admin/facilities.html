<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>施設管理 | deep_Admin</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="css/common.css">
  </head>
  <body data-density="regular" data-side="default">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <script src="js/master-data.js"></script>
    <script type="text/babel" data-presets="react">
const { useState } = React;

const SEED_FACILITIES = [
  { id: "fac-1", name: "大阪城公演広場",        type: "観光スポット",   prefecture: "大阪府", address: "大阪市中央区大阪城1-1",     capacity: 500, status: "active" },
  { id: "fac-2", name: "京都国際会館",           type: "体験施設",      prefecture: "京都府", address: "京都市左京区宝ヶ池",         capacity: 200, status: "active" },
  { id: "fac-3", name: "奈良 正倉院",            type: "観光スポット",   prefecture: "奈良県", address: "奈良市雑司町406-1",           capacity: 100, status: "active" },
  { id: "fac-4", name: "神戸北野クラブ",         type: "飲食施設",      prefecture: "兵庫県", address: "神戸市中央区北野町2-10-7",    capacity: 80,  status: "active" },
  { id: "fac-5", name: "琵琶湖マリーナ",         type: "体験施設",      prefecture: "滋賀県", address: "大津市今堅田2-15",            capacity: 60,  status: "inactive" },
];

const FACILITY_TYPES = ["体験施設", "観光スポット", "飲食施設", "宿泊施設", "移動施設", "その他"];
const PREFECTURES = ["大阪府","京都府","奈良県","兵庫県","滋賀県","和歌山県","三重県","東京都","神奈川県","愛知県","福岡県","北海道","沖縄県"];

// ── Sidebar ─────────────────────────────────────────────────────────────────
function Sidebar() {
  const items = [
    { key: "dashboard",      href: "index.html",           icon: "⊞", label: "ダッシュボード" },
    { key: "tourOption",     href: "tour-options.html",    icon: "TO", label: "TourOption",        hint: "ツアーの実体" },
    { key: "productPage",    href: "products.html",        icon: "PG", label: "商品ページ",           hint: "顧客表示" },
    { key: "resource",       href: "resources.html",       icon: "RS", label: "リソース管理",          hint: "機材・車両等" },
    { key: "area",           href: "areas.html",           icon: "AR", label: "エリア管理",           hint: "都道府県・エリア" },
    { key: "facility",       href: "facilities.html",      icon: "FC", label: "施設管理",             hint: "体験施設・観光スポット" },
    { key: "language",       href: "languages.html",       icon: "LG", label: "言語マスター管理",     hint: "対応言語" },
    { key: "guideDoc",       href: "guide-materials.html", icon: "GD", label: "ガイド資料",           hint: "運営注意・行程" },
    { key: "cancelTemplate", href: "cancel-policies.html", icon: "CP", label: "キャンセルポリシー",   hint: "キャンセル文言" },
  ];
  return (
    <aside className="side-nav">
      <div className="brand-block">
        <div className="brand-mark">d.</div>
        <div>
          <div className="brand-name">deep_Admin</div>
          <div className="brand-caption">Product &amp; Sales · Phase 1</div>
        </div>
      </div>
      <div>
        <div className="nav-section-label">Manage</div>
        <div className="nav-group">
          {items.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${it.key === "facility" ? "active" : ""}`}
              style={{textDecoration:"none"}}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1,minWidth:0}}>
                <div>{it.label}</div>
              </span>
            </a>
          ))}
        </div>
      </div>
      <div className="side-note">
        <strong>施設管理</strong>
        ツアーで使用する体験施設・観光スポット・飲食施設などを管理します。TourOptionの提供条件から参照されます。
      </div>
    </aside>
  );
}

// ── StatusBadge ──────────────────────────────────────────────────────────────
function StatusBadge({ status }) {
  const map = {
    active:   { label: "有効",   bg: "#d1fae5", color: "#065f46" },
    inactive: { label: "無効",   bg: "#f3f4f6", color: "#6b7280" },
  };
  const s = map[status] || map.inactive;
  return (
    <span style={{display:"inline-block",padding:"2px 8px",borderRadius:99,fontSize:11,background:s.bg,color:s.color,fontWeight:600}}>
      {s.label}
    </span>
  );
}

// ── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [facilities] = useState(SEED_FACILITIES);
  const [filterType, setFilterType]           = useState("");
  const [filterPref, setFilterPref]           = useState("");
  const [filterStatus, setFilterStatus]       = useState("");

  const filtered = facilities.filter(f => {
    if (filterType   && f.type       !== filterType)   return false;
    if (filterPref   && f.prefecture !== filterPref)   return false;
    if (filterStatus && f.status     !== filterStatus) return false;
    return true;
  });

  return (
    <div className="app-shell">
      <Sidebar />
      <div style={{flex:1,padding:'var(--sp-5)',display:'flex',flexDirection:'column',gap:14,minWidth:0,overflowY:'auto'}}>
      <div className="list-shell">
        <div className="topbar list-topbar">
          <div>
            <div className="crumbs">
              <a href="index.html" className="crumb-link">deep_Admin</a>
              <span className="sep">/</span>
              <span className="current">施設管理</span>
            </div>
          </div>
        </div>

        <div className="list-view">
          <div className="list-header">
            <div>
              <h1>施設管理</h1>
              <p className="list-desc">ツアーで使用する体験施設・観光スポット・飲食施設などを管理します。</p>
            </div>
            <div style={{alignSelf:'flex-start'}}>
              <a href="facility-detail.html?mode=create" className="btn primary">＋ 施設を追加</a>
            </div>
          </div>

          {/* 検索フィルター */}
          <div style={{display:'flex',gap:10,marginBottom:16,flexWrap:'wrap'}}>
            <div style={{position:'relative'}}>
              <select
                value={filterType}
                onChange={e => setFilterType(e.target.value)}
                style={{appearance:'none',WebkitAppearance:'none',paddingRight:28,paddingLeft:10,paddingTop:6,paddingBottom:6,border:'1px solid var(--border)',borderRadius:6,fontSize:13,background:'white',cursor:'pointer',minWidth:130}}
              >
                <option value="">すべての施設種別</option>
                {FACILITY_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
              </select>
              <span style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',fontSize:10,color:'#666'}}>▼</span>
            </div>
            <div style={{position:'relative'}}>
              <select
                value={filterPref}
                onChange={e => setFilterPref(e.target.value)}
                style={{appearance:'none',WebkitAppearance:'none',paddingRight:28,paddingLeft:10,paddingTop:6,paddingBottom:6,border:'1px solid var(--border)',borderRadius:6,fontSize:13,background:'white',cursor:'pointer',minWidth:130}}
              >
                <option value="">すべての都道府県</option>
                {PREFECTURES.map(p => <option key={p} value={p}>{p}</option>)}
              </select>
              <span style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',fontSize:10,color:'#666'}}>▼</span>
            </div>
            <div style={{position:'relative'}}>
              <select
                value={filterStatus}
                onChange={e => setFilterStatus(e.target.value)}
                style={{appearance:'none',WebkitAppearance:'none',paddingRight:28,paddingLeft:10,paddingTop:6,paddingBottom:6,border:'1px solid var(--border)',borderRadius:6,fontSize:13,background:'white',cursor:'pointer',minWidth:110}}
              >
                <option value="">すべてのステータス</option>
                <option value="active">有効</option>
                <option value="inactive">無効</option>
              </select>
              <span style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',fontSize:10,color:'#666'}}>▼</span>
            </div>
            {(filterType || filterPref || filterStatus) && (
              <button
                onClick={() => { setFilterType(""); setFilterPref(""); setFilterStatus(""); }}
                style={{padding:'6px 12px',border:'1px solid var(--border)',borderRadius:6,fontSize:13,background:'white',cursor:'pointer',color:'var(--muted)'}}
              >クリア</button>
            )}
          </div>

          <div className="list-table-wrap">
            <table className="list-table">
              <thead>
                <tr>
                  <th>施設名</th>
                  <th style={{width:120,textAlign:'center'}}>施設種別</th>
                  <th style={{width:100,textAlign:'center'}}>都道府県</th>
                  <th>住所</th>
                  <th style={{width:90,textAlign:'center'}}>収容人数</th>
                  <th style={{width:80,textAlign:'center'}}>ステータス</th>
                  <th className="actions" style={{width:80}}></th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(f => (
                  <tr key={f.id} className="list-row" onClick={() => { window.location.href = `facility-detail.html?id=${f.id}`; }}>
                    <td>
                      <strong>{f.name}</strong>
                    </td>
                    <td style={{textAlign:'center'}}>
                      <span style={{display:'inline-block',padding:'2px 8px',borderRadius:99,fontSize:11,background:'#eff6ff',color:'#1d4ed8'}}>{f.type}</span>
                    </td>
                    <td style={{textAlign:'center',fontSize:13}}>{f.prefecture}</td>
                    <td style={{fontSize:12,color:'var(--muted)'}}>{f.address}</td>
                    <td style={{textAlign:'center'}}>
                      {f.capacity != null
                        ? <span style={{fontWeight:700,fontSize:14}}>{f.capacity}<span style={{fontWeight:400,fontSize:11,marginLeft:2}}>人</span></span>
                        : <span style={{color:'var(--muted)',fontSize:12}}>—</span>
                      }
                    </td>
                    <td style={{textAlign:'center'}}>
                      <StatusBadge status={f.status} />
                    </td>
                    <td className="actions">
                      <a href={`facility-detail.html?id=${f.id}`} className="btn sm" onClick={e => e.stopPropagation()}>編集</a>
                    </td>
                  </tr>
                ))}
                {filtered.length === 0 && (
                  <tr>
                    <td colSpan={7} className="list-empty">施設が登録されていません</td>
                  </tr>
                )}
              </tbody>
            </table>
          </div>

          <div style={{marginTop:8,fontSize:12,color:'var(--muted)'}}>
            {filtered.length} 件 / 全 {facilities.length} 件
          </div>
        </div>
      </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
