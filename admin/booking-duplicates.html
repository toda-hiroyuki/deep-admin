<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>予約 重複疑い - deep_Admin</title>
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <link rel="stylesheet" href="css/common.css" />
  <style>
    .workspace { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .topbar h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
    .topbar .crumbs { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
    .tab-bar { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
    .tab-btn { appearance: none; border: 0; background: transparent; padding: 11px 16px 13px; font-size: 14px; font-weight: 600; color: var(--muted); position: relative; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; text-decoration: none; }
    .tab-btn:hover { color: var(--ink-soft); }
    .tab-btn.active { color: var(--accent-strong); }
    .tab-btn.active::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2.5px; background: var(--accent); border-radius: 2px 2px 0 0; }
    .tab-count { font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 1px 7px; border-radius: 999px; background: var(--bg-sunken); color: var(--muted); }
    .tab-count.alert { background: var(--amber-soft); color: var(--amber); }
    .tab-count.coral { background: var(--coral-soft); color: var(--coral); }
    .empty-ok { padding: 30px 24px; text-align: center; color: var(--green); background: var(--green-soft); border: 1px solid color-mix(in srgb, var(--green) 25%, transparent); border-radius: var(--radius-lg); font-size: 14px; font-weight: 650; }
    .dup-stack { display: flex; flex-direction: column; gap: 16px; }
    .dup-card { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-1); overflow: hidden; }
    .dup-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; background: var(--surface-warm); border-bottom: 1px solid var(--line-soft); }
    .dup-head .dh-title { font-weight: 700; font-size: 13.5px; }
    .dup-grid { display: grid; grid-template-columns: 160px 1fr 1fr; }
    .dup-grid .dg { padding: 9px 16px; border-bottom: 1px solid var(--line-soft); font-size: 13px; min-width: 0; }
    .dup-grid .dg.head { background: var(--surface-tint); font-weight: 700; color: var(--accent-strong); font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 12px; }
    .dup-grid .dg.lab { color: var(--muted); font-weight: 600; }
    .dup-grid .dg.val { color: var(--ink); word-break: break-word; }
    .dup-grid .dg.match { background: var(--amber-soft); }
    .dup-grid .dg.match.val { color: var(--amber); font-weight: 700; }
    .dup-grid > .dg:nth-last-child(-n+3) { border-bottom: 0; }
    .dup-foot { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .dup-reason { font-size: 12.5px; color: var(--amber); font-weight: 650; display: flex; align-items: center; gap: 7px; }
    .dup-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .status-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px 3px 8px; border-radius: 999px; background: var(--bg-sunken); color: var(--muted); white-space: nowrap; }
    .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status-pill.coral { background: var(--coral-soft); color: var(--coral); }
    .btn { height: var(--field-h); padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; font-weight: 600; transition: background 0.1s, border-color 0.1s; text-decoration: none; color: inherit; }
    .btn:hover { background: var(--surface-tint); border-color: var(--ink-soft); }
    a.btn { color: inherit; text-decoration: none; }
    .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(12px); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 13px; font-weight: 550; box-shadow: var(--shadow-pop); opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 60; display: flex; align-items: center; gap: 9px; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast .t-dot { width: 7px; height: 7px; border-radius: 50%; background: #5fd0c0; }
    .sidebar-footer { margin-top: auto; border-top: 1px solid var(--side-line); padding-top: 12px; }
    .nav-logout { color: var(--side-ink-soft) !important; font-size: 13px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script type="text/babel" data-presets="react">
    const { useState, useRef } = React;

    function Sidebar({ resource, counts = {} }) {
      const opsItems = [
        { key: "bookings",      href: "bookings.html",       icon: "BK", label: "予約一覧" },
        { key: "unassigned",    href: "unassigned.html",     icon: "↳",  label: "未割り当て一覧", child: true },
        { key: "sessions",      href: "sessions.html",       icon: "SS", label: "催行回一覧" },
        { key: "unarranged",    href: "unarranged.html",     icon: "↳",  label: "未手配一覧", child: true },
        { key: "todayTomorrow", href: "today-tomorrow.html", icon: "↳",  label: "当日/翌日案件", child: true },
      ];
      const payItems = [
        { key: "settlement", href: "monthly-settlement.html", icon: "ST", label: "月次締め確認" },
        { key: "ota",      href: "ota-payment-matching.html", icon: "OT", label: "OTA入金照合" },
        { key: "revenue",  href: "revenue-summary.html",      icon: "RV", label: "収支一覧" },

        { key: "guidePay",  href: "guide-payments.html",     icon: "GP", label: "ガイド支払一覧" },
      ];
      const guideItems = [
        { key: "guides", href: "guides.html", icon: "GM", label: "ガイド一覧" },
      ];
  const customerItems = [
    { key: "customers", href: "customers.html", icon: "CU", label: "顧客一覧" },
  ];

      const facilityItems = [
        { key: "facility",       href: "facilities.html",      icon: "FC", label: "施設一覧" },
      ];
      const masterMainItems = [
        { key: "tourOption",     href: "tour-options.html",    icon: "TO", label: "TourOption",       count: counts.to },
        { key: "productPage",    href: "products.html",        icon: "PG", label: "商品ページ",          count: counts.pg },
      ];
      const masterSubItems = [
        { key: "resource",       href: "resources.html",       icon: "RS", label: "リソース管理" },
        { key: "area",           href: "areas.html",           icon: "AR", label: "エリア管理" },
        { key: "language",       href: "languages.html",       icon: "LG", label: "言語マスター管理" },
        { key: "guideDoc",       href: "guide-materials.html", icon: "GD", label: "ガイド資料",         count: counts.gd },
        { key: "cancelTemplate", href: "cancel-policies.html", icon: "CP", label: "キャンセルポリシー" },
        { key: "channelFee",     href: "channel-fees.html",    icon: "FE", label: "チャネル・手数料設定" },
      ];
      return (
        <aside className="side-nav">
          <div className="brand-block">
            <div className="brand-mark">d.</div>
            <div>
              <div className="brand-name">deep_Admin</div>
              <div className="brand-caption">Product &amp; Sales · Phase 1</div>
            </div>
          </div>
          <div className="nav-group" style={{marginBottom:"8px"}}>
            <a href="index.html" className={`nav-item ${resource === "dashboard" ? "active" : ""}`} style={{textDecoration:"none"}}>
              <span className="nav-icon">⊞</span>
              <span style={{flex:1,minWidth:0}}><div>ダッシュボード</div></span>
            </a>
          </div>
          <div>
            <div className="nav-section-label">予約オペレーション</div>
            <div className="nav-group">
              {opsItems.map(it => (
                <a key={it.key} href={it.href}
                  className={`nav-item ${resource === it.key ? "active" : ""}${it.child ? " nav-child" : ""}`}
                  style={{textDecoration:"none"}}>
                  <span className="nav-icon">{it.icon}</span>
                  <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
                </a>
              ))}
            </div>
          </div>
          <div>
            <div className="nav-section-label">精算・経営</div>
            <div className="nav-group">
              {payItems.map(it => (
                <a key={it.key} href={it.href}
                  className={`nav-item ${resource === it.key ? "active" : ""}`}
                  style={{textDecoration:"none"}}>
                  <span className="nav-icon">{it.icon}</span>
                  <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
                </a>
              ))}
            </div>
          </div>
          <div>
            <div className="nav-section-label">ガイド管理</div>
            <div className="nav-group">
              {guideItems.map(it => (
                <a key={it.key} href={it.href}
                  className={`nav-item ${resource === it.key ? "active" : ""}`}
                  style={{textDecoration:"none"}}>
                  <span className="nav-icon">{it.icon}</span>
                  <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
                </a>
              ))}
            </div>
          </div>
          <div>
        <div className="nav-section-label">顧客管理</div>
        <div className="nav-group">
          {customerItems.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${resource === it.key ? "active" : ""}`}
              style={{textDecoration:"none"}}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
              <span className="nav-count">{it.count}</span>
            </a>
          ))}
        </div>
      </div>
      <div>
            <div className="nav-section-label">施設管理</div>
            <div className="nav-group">
              {facilityItems.map(it => (
                <a key={it.key} href={it.href}
                  className={`nav-item ${resource === it.key ? "active" : ""}`}
                  style={{textDecoration:"none"}}>
                  <span className="nav-icon">{it.icon}</span>
                  <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
                </a>
              ))}
            </div>
          </div>
          <div>
            <div className="nav-section-label">商品管理</div>
            <div className="nav-group">
              {masterMainItems.map(it => (
                <a key={it.key} href={it.href}
                  className={`nav-item ${resource === it.key ? "active" : ""}`}
                  style={{textDecoration:"none"}}>
                  <span className="nav-icon">{it.icon}</span>
                  <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
                  <span className="nav-count">{it.count}</span>
                </a>
              ))}
              <div className="nav-section-label" style={{fontSize:"10px",color:"#999",padding:"8px 12px 4px",marginTop:"4px"}}>マスター</div>
              {masterSubItems.map(it => (
                <a key={it.key} href={it.href}
                  className={`nav-item ${resource === it.key ? "active" : ""}`}
                  style={{textDecoration:"none"}}>
                  <span className="nav-icon">{it.icon}</span>
                  <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
                  <span className="nav-count">{it.count}</span>
                </a>
              ))}
            </div>
          </div>
          <div className="sidebar-footer">
            <a href="login.html" className="nav-item nav-logout" style={{textDecoration:"none"}}>
              <span className="nav-icon">↩</span><span>ログアウト</span>
            </a>
          </div>
        </aside>
      );
    }

    const DUP_FIELDS = [
      { k: "guest", lab: "ゲスト名" },
      { k: "date", lab: "ツアー日" },
      { k: "time", lab: "開始時間" },
      { k: "code", lab: "TourOption" },
      { k: "channel", lab: "チャネル" },
      { k: "ext", lab: "外部予約番号" },
    ];
    const DUP_PAIRS = [
      { pid: "001",
        a: { id: "BK-260601-00002", guest: "Smith John", date: "2026/06/15", time: "09:00", code: "G-WAK-001-2-GR", channel: "Viator", ext: "VTR-8923401" },
        b: { id: "BK-260603-00015", guest: "Smith J.",   date: "2026/06/15", time: "09:00", code: "G-WAK-001-2-GR", channel: "Viator", ext: "VTR-8923388" },
        matchKeys: ["date", "time", "code", "channel"], reason: "同一ゲスト・同一ツアー日時・同一TourOption（外部予約番号は別）" },
    ];

    function App() {
      const [toast, setToast] = useState(null);
      const toastTimer = useRef(null);

      const showToast = (msg) => {
        setToast(msg);
        clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(null), 2200);
      };

      return (
        <div className="app-shell">
          <Sidebar resource="bookings" counts={{}} />

          <main className="workspace">
            <div className="topbar">
              <div>
                <div className="crumbs">予約オペレーション</div>
                <h1>予約一覧</h1>
              </div>
            </div>
            <div className="tab-bar">
              <a href="bookings.html" className="tab-btn">全予約</a>
              <a href="booking-errors.html" className="tab-btn">データ不備<span className="tab-count alert">3</span></a>
              <a href="booking-duplicates.html" className="tab-btn active">重複疑い</a>
              <a href="booking-import-log.html" className="tab-btn">取込ログ</a>
            </div>
            {DUP_PAIRS.length === 0 && (
              <div className="empty-ok">現在、重複疑いの予約はありません。</div>
            )}
            <div className="dup-stack">
              {DUP_PAIRS.map(p => (
                <div className="dup-card" key={p.pid}>
                  <div className="dup-head">
                    <span className="dh-title">重複疑いペア #{p.pid}</span>
                    <span className="status-pill coral"><span className="dot"></span>重複疑い</span>
                  </div>
                  <div className="dup-grid">
                    <div className="dg lab"></div>
                    <div className="dg head">予約A：{p.a.id}</div>
                    <div className="dg head">予約B：{p.b.id}</div>
                    {DUP_FIELDS.map(f => {
                      const m = p.matchKeys.includes(f.k);
                      return (
                        <React.Fragment key={f.k}>
                          <div className="dg lab">{f.lab}</div>
                          <div className={`dg val ${m ? "match" : ""}`}>{p.a[f.k]}</div>
                          <div className={`dg val ${m ? "match" : ""}`}>{p.b[f.k]}</div>
                        </React.Fragment>
                      );
                    })}
                  </div>
                  <div className="dup-foot">
                    <span className="dup-reason">🔴 重複の可能性：{p.reason}</span>
                    <div className="dup-actions">
                      <a href={`booking-detail.html?id=${p.a.id}`} className="btn">予約A詳細</a>
                      <a href={`booking-detail.html?id=${p.b.id}`} className="btn">予約B詳細</a>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </main>

          <div className={`toast ${toast ? "show" : ""}`}>
            <span className="t-dot"></span>{toast}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
