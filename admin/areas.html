<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>エリア管理 | deep_Admin</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="css/common.css">
  </head>
  <body data-density="regular" data-side="default">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <script src="js/master-data.js"></script>
    <script type="text/babel" data-presets="react">
const { useState } = React;

const SEED_PREFECTURES = [
  { id: "pref-1", nameJa: "京都府",   nameEn: "Kyoto Prefecture",   slug: "kyoto",   areas: [
    { id: "area-1", nameJa: "祇園・東山エリア", nameEn: "Gion / Higashiyama" },
    { id: "area-2", nameJa: "嵐山エリア",       nameEn: "Arashiyama" },
    { id: "area-3", nameJa: "金閣寺・北野エリア", nameEn: "Kinkakuji / Kitano" },
    { id: "area-4", nameJa: "伏見稲荷エリア",   nameEn: "Fushimi Inari" },
  ]},
  { id: "pref-2", nameJa: "大阪府",   nameEn: "Osaka Prefecture",   slug: "osaka",   areas: [
    { id: "area-5", nameJa: "大阪難波エリア", nameEn: "Osaka Namba" },
    { id: "area-6", nameJa: "大阪梅田エリア", nameEn: "Osaka Umeda" },
  ]},
  { id: "pref-3", nameJa: "兵庫県",   nameEn: "Hyogo Prefecture",   slug: "hyogo",   areas: [
    { id: "area-7", nameJa: "神戸元町エリア", nameEn: "Kobe Motomachi" },
  ]},
  { id: "pref-4", nameJa: "奈良県",   nameEn: "Nara Prefecture",    slug: "nara",    areas: [
    { id: "area-8", nameJa: "奈良中心エリア", nameEn: "Central Nara" },
  ]},
  { id: "pref-5", nameJa: "東京都",   nameEn: "Tokyo",              slug: "tokyo",   areas: [] },
];

// ── Sidebar ─────────────────────────────────────────────────────────────────
function Sidebar() {
  const items = [
    { key: "dashboard",      href: "index.html",           icon: "⊞", label: "ダッシュボード" },
    { key: "tourOption",     href: "tour-options.html",    icon: "TO", label: "TourOption",       hint: "ツアーの実体" },
    { key: "productPage",    href: "products.html",        icon: "PG", label: "商品ページ",          hint: "顧客表示" },
    { key: "resource",       href: "resources.html",       icon: "RS", label: "リソース管理",         hint: "機材・車両等" },
    { key: "area",           href: "areas.html",           icon: "AR", label: "エリア管理",           hint: "都道府県・エリア" },
    { key: "guideDoc",       href: "guide-materials.html", icon: "GD", label: "ガイド資料",          hint: "運営注意・行程" },
    { key: "cancelTemplate", href: "cancel-policies.html", icon: "CP", label: "キャンセルポリシー",  hint: "キャンセル文言" },
  ];
  return (
    <aside className="side-nav">
      <div className="brand-block">
        <div className="brand-mark">d.</div>
        <div>
          <div className="brand-name">deep_Admin</div>
          <div className="brand-caption">Product &amp; Sales · Phase 1</div>
        </div>
      </div>
      <div>
        <div className="nav-section-label">Manage</div>
        <div className="nav-group">
          {items.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${it.key === "area" ? "active" : ""}`}
              style={{textDecoration:"none"}}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1,minWidth:0}}>
                <div>{it.label}</div>
              </span>
            </a>
          ))}
        </div>
      </div>
      <div className="side-note">
        <strong>エリア管理</strong>
        都道府県とそれに紐づくエリアを管理します。TourOptionのエリア選択に使用されます。
      </div>
    </aside>
  );
}

// ── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [prefectures] = useState(SEED_PREFECTURES);

  return (
    <div className="app-shell">
      <Sidebar />
      <div style={{flex:1,padding:'var(--sp-5)',display:'flex',flexDirection:'column',gap:14,minWidth:0,overflowY:'auto'}}>
      <div className="list-shell">
        <div className="topbar list-topbar">
          <div>
            <div className="crumbs">
              <a href="index.html" className="crumb-link">deep_Admin</a>
              <span className="sep">/</span>
              <span className="current">エリア管理</span>
            </div>
          </div>
        </div>

        <div className="list-view">
          <div className="list-header">
            <div>
              <h1>エリア管理</h1>
              <p className="list-desc">都道府県とそれに紐づくエリアを管理します。TourOptionのエリア選択に使用されます。</p>
            </div>
            <div style={{alignSelf:'flex-start'}}>
              <a href="area-detail.html?mode=create" className="btn primary">＋ 都道府県を追加</a>
            </div>
          </div>

          <div className="list-table-wrap">
            <table className="list-table">
              <thead>
                <tr>
                  <th>都道府県名（日本語）</th>
                  <th>スラッグ</th>
                  <th style={{width:100,textAlign:'center'}}>エリア数</th>
                  <th className="actions" style={{width:80}}></th>
                </tr>
              </thead>
              <tbody>
                {prefectures.map(p => (
                  <tr key={p.id} className="list-row" onClick={() => { window.location.href = `area-detail.html?id=${p.id}`; }}>
                    <td><strong>{p.nameJa}</strong></td>
                    <td style={{color:'var(--muted)',fontFamily:'monospace',fontSize:12}}>{p.slug || '—'}</td>
                    <td style={{textAlign:'center'}}>
                      <span style={{display:'inline-block',padding:'2px 10px',borderRadius:99,fontSize:11,background:'#e0e7ff',color:'#3730a3',fontWeight:600}}>
                        {p.areas.length}
                      </span>
                    </td>
                    <td className="actions">
                      <a href={`area-detail.html?id=${p.id}`} className="btn sm" onClick={e => e.stopPropagation()}>編集</a>
                    </td>
                  </tr>
                ))}
                {prefectures.length === 0 && (
                  <tr>
                    <td colSpan={4} className="list-empty">都道府県が登録されていません</td>
                  </tr>
                )}
              </tbody>
            </table>
          </div>
        </div>
      </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
