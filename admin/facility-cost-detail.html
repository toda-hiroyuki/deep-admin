<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>経費項目 登録・編集 | deep_Admin</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="css/common.css">
</head>
  <body data-density="regular" data-side="default">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <script src="js/master-data.js"></script>
    <script type="text/babel" data-presets="react">
const { useState } = React;

const PAYMENT_TYPES = [
  { value: "A", label: "A：施設へ月末一括（会社払い）" },
  { value: "B", label: "B：施設へ都度払い（会社払い）" },
  { value: "C", label: "C：ガイドが現地立替（後日精算）" },
  { value: "D", label: "D：お客様が現地直接払い" },
];

const COST_TYPES = [
  { value: "fixed",      label: "固定費（1催行）",         hint: "1回あたりの合計金額を入力してください。" },
  { value: "per-person", label: "変動・人数比例（1名）",   hint: "1人あたりの単価を入力してください。" },
  { value: "slide",      label: "変動・スライド",           hint: "" },
  { value: "full-var",   label: "完全変動（要入力）",       hint: "" },
];

const SEED_COSTS = {
  "c1": { id: "c1", name: "入場料（大人）", costType: "per-person", unitPrice: 1500, paymentType: "A", tiers: [], basePrice: "", notes: "" },
  "c2": { id: "c2", name: "竹細工体験料",  costType: "per-person", unitPrice: 2000, paymentType: "A", tiers: [], basePrice: "", notes: "" },
  "c3": { id: "c3", name: "着物レンタル",  costType: "fixed",      unitPrice: 3500, paymentType: "B", tiers: [], basePrice: "", notes: "" },
};

const FACILITY_NAMES = {
  "fac-1": "嵐山竹林体験センター",
  "fac-2": "伏見稲荷大社",
  "fac-3": "金閣寺（鹿苑寺）",
  "fac-4": "京町家体験 山田屋",
  "fac-5": "宇治茶農家 田中園",
};

// ── Sidebar ──────────────────────────────────────────────────────────────────
function Sidebar({ resource, counts = {} }) {
  const opsItems = [
    { key: "bookings",      href: "bookings.html",       icon: "BK", label: "予約一覧" },
    { key: "unassigned",    href: "unassigned.html",     icon: "↳",  label: "未割り当て一覧", child: true },
    { key: "sessions",      href: "sessions.html",       icon: "SS", label: "催行回一覧" },
    { key: "unarranged",    href: "unarranged.html",     icon: "↳",  label: "未手配一覧", child: true },
    { key: "todayTomorrow", href: "today-tomorrow.html", icon: "↳",  label: "当日/翌日案件", child: true },
  ];
  const payItems = [
    { key: "settlement", href: "monthly-settlement.html", icon: "ST", label: "月次締め確認" },
    { key: "ota",      href: "ota-payment-matching.html", icon: "OT", label: "OTA入金照合" },
    { key: "revenue",  href: "revenue-summary.html",      icon: "RV", label: "収支一覧" },
  ];
  const guideItems = [
    { key: "guides", href: "guides.html", icon: "GM", label: "ガイド一覧" },
  ];
  const facilityItems = [
    { key: "facility",       href: "facilities.html",      icon: "FC", label: "施設一覧" },
  ];
  const masterMainItems = [
    { key: "tourOption",     href: "tour-options.html",    icon: "TO", label: "TourOption",       count: counts.to },
    { key: "productPage",    href: "products.html",        icon: "PG", label: "商品ページ",          count: counts.pg },
  ];
  const masterSubItems = [
    { key: "resource",       href: "resources.html",       icon: "RS", label: "リソース管理" },
    { key: "area",           href: "areas.html",           icon: "AR", label: "エリア管理" },
    { key: "language",       href: "languages.html",       icon: "LG", label: "言語マスター管理" },
    { key: "guideDoc",       href: "guide-materials.html", icon: "GD", label: "ガイド資料",         count: counts.gd },
    { key: "cancelTemplate", href: "cancel-policies.html", icon: "CP", label: "キャンセルポリシー" },
    { key: "channelFee",     href: "channel-fees.html",    icon: "FE", label: "チャネル・手数料設定" },
  ];
  return (
    <aside className="side-nav">
      <div className="brand-block">
        <div className="brand-mark">d.</div>
        <div>
          <div className="brand-name">deep_Admin</div>
          <div className="brand-caption">Product &amp; Sales · Phase 1</div>
        </div>
      </div>
      <div className="nav-group" style={{marginBottom:"8px"}}>
        <a href="index.html" className={`nav-item ${resource === "dashboard" ? "active" : ""}`} style={{textDecoration:"none"}}>
          <span className="nav-icon">⊞</span>
          <span style={{flex:1,minWidth:0}}><div>ダッシュボード</div></span>
        </a>
      </div>
      <div>
        <div className="nav-section-label">予約オペレーション</div>
        <div className="nav-group">
          {opsItems.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${resource === it.key ? "active" : ""}${it.child ? " nav-child" : ""}`}
              style={{textDecoration:"none"}}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
            </a>
          ))}
        </div>
      </div>
      <div>
        <div className="nav-section-label">精算・経営</div>
        <div className="nav-group">
          {payItems.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${resource === it.key ? "active" : ""}`}
              style={{textDecoration:"none"}}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
            </a>
          ))}
        </div>
      </div>
      <div>
        <div className="nav-section-label">ガイド管理</div>
        <div className="nav-group">
          {guideItems.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${resource === it.key ? "active" : ""}`}
              style={{textDecoration:"none"}}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
            </a>
          ))}
        </div>
      </div>
      <div>
        <div className="nav-section-label">施設管理</div>
        <div className="nav-group">
          {facilityItems.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${resource === it.key ? "active" : ""}`}
              style={{textDecoration:"none"}}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
            </a>
          ))}
        </div>
      </div>
      <div>
        <div className="nav-section-label">商品管理</div>
        <div className="nav-group">
          {masterMainItems.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${resource === it.key ? "active" : ""}`}
              style={{textDecoration:"none"}}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
              <span className="nav-count">{it.count}</span>
            </a>
          ))}
          <div className="nav-section-label" style={{fontSize:"10px",color:"#999",padding:"8px 12px 4px",marginTop:"4px"}}>マスター</div>
          {masterSubItems.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${resource === it.key ? "active" : ""}`}
              style={{textDecoration:"none"}}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1,minWidth:0}}><div>{it.label}</div></span>
              <span className="nav-count">{it.count}</span>
            </a>
          ))}
        </div>
      </div>
      <div className="sidebar-footer">
        <a href="login.html" className="nav-item nav-logout" style={{textDecoration:"none"}}>
          <span className="nav-icon">↩</span><span>ログアウト</span>
        </a>
      </div>
    </aside>
  );
}

// ── Field helpers ─────────────────────────────────────────────────────────────
function Field({ label, required, children }) {
  return (
    <div className="field">
      <label className="field-label">{label}{required && <span style={{color:'var(--danger)',marginLeft:2}}>*</span>}</label>
      {children}
    </div>
  );
}

function SelectField({ label, required, value, onChange, options, hint }) {
  return (
    <Field label={label} required={required}>
      <div style={{position:"relative",display:"flex",alignItems:"center"}}>
        <select value={value} onChange={e => onChange(e.target.value)} style={{width:"100%",paddingRight:28,appearance:"none",WebkitAppearance:"none"}}>
          {options.map(o => (
            <option key={o.value ?? o} value={o.value ?? o}>{o.label ?? o}</option>
          ))}
        </select>
        <span style={{position:"absolute",right:10,pointerEvents:"none",fontSize:10,color:"var(--muted)"}}>▼</span>
      </div>
      {hint && <div style={{fontSize:12,color:'var(--muted)',marginTop:3}}>{hint}</div>}
    </Field>
  );
}

function TierTable({ tiers, onChange }) {
  const addRow = () => onChange([...tiers, { maxPax: "", price: "" }]);
  const removeRow = i => onChange(tiers.filter((_, idx) => idx !== i));
  const updRow = (i, k, v) => onChange(tiers.map((r, idx) => idx === i ? { ...r, [k]: v } : r));
  return (
    <div>
      <div style={{fontSize:12,color:'var(--muted)',marginBottom:8}}>
        人数帯ごとの1人あたり単価を設定してください。最終行の最大人数は空欄で「上限なし」になります。
      </div>
      <table className="list-table" style={{marginBottom:8}}>
        <thead>
          <tr>
            <th style={{textAlign:'center'}}>最大人数（空欄=上限なし）</th>
            <th style={{textAlign:'center'}}>単価（円/人）</th>
            <th style={{width:40}}></th>
          </tr>
        </thead>
        <tbody>
          {tiers.map((r, i) => (
            <tr key={i}>
              <td><input type="number" min="1" value={r.maxPax} onChange={e => updRow(i,"maxPax",e.target.value)} style={{width:100}} /></td>
              <td><input type="number" min="0" value={r.price} onChange={e => updRow(i,"price",e.target.value)} placeholder="例：2000" style={{width:120}} /></td>
              <td style={{textAlign:'center'}}>
                <button type="button" className="btn sm ghost" onClick={() => removeRow(i)} disabled={tiers.length <= 1}>×</button>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
      <button type="button" className="btn ghost sm" onClick={addRow}>＋ 行を追加</button>
    </div>
  );
}

// ── App ──────────────────────────────────────────────────────────────────────
function App() {
  const params     = new URLSearchParams(window.location.search);
  const facilityId = params.get("facilityId") || "";
  const costId     = params.get("id");
  const isCreate   = params.get("mode") === "create" || !costId;
  const seed       = isCreate ? null : (SEED_COSTS[costId] || null);

  const backUrl = facilityId
    ? `facility-detail.html?id=${facilityId}&tab=costs`
    : "facilities.html";

  const facilityName = FACILITY_NAMES[facilityId] || facilityId;

  const [form, setForm] = useState(seed || {
    name: "", costType: "fixed", unitPrice: "", paymentType: "A", tiers: [{ maxPax: "", price: "" }], basePrice: "", notes: "",
  });
  const [saved, setSaved] = useState(false);

  const upd = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const costTypeInfo = COST_TYPES.find(c => c.value === form.costType) || COST_TYPES[0];

  const handleSave = () => {
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  return (
    <div className="app-shell">
      <Sidebar />
      <main className="workspace">

        {/* Topbar */}
        <div className="topbar">
          <div>
            <div className="crumbs">
              <a href="index.html" className="crumb-link">deep_Admin</a>
              <span className="sep">/</span>
              <a href="facilities.html" className="crumb-link">施設管理</a>
              <span className="sep">/</span>
              <a href={`facility-detail.html?id=${facilityId}&tab=costs`} className="crumb-link">{facilityName}</a>
              <span className="sep">/</span>
              <span className="current">{isCreate ? "経費項目を追加" : form.name}</span>
            </div>
            <div className="title-row">
              <button className="btn ghost sm back-btn" onClick={() => { window.location.href = backUrl; }}>← 施設詳細に戻る</button>
              <h1>経費項目 {isCreate ? "登録" : "編集"}</h1>
            </div>
          </div>
          <div className="status-actions" style={{marginLeft:"auto"}}>
            <button className="btn primary" onClick={handleSave}>
              {saved ? "✓ 保存しました" : "変更保存"}
            </button>
          </div>
        </div>

        {/* Editor */}
        <div className="content-grid" data-no-preview="true">
          <section className="editor-pane">
            <div className="editor-content">
              <div className="form-section">
                <div className="field-grid">
                  <div className="field-wide">
                    <Field label="経費項目名" required>
                      <input type="text" value={form.name} onChange={e => upd("name", e.target.value)} placeholder="例：入館料、竹細工体験料、着物レンタル料" />
                    </Field>
                  </div>

                  <SelectField
                    label="費用区分" required
                    value={form.costType}
                    onChange={v => upd("costType", v)}
                    options={COST_TYPES}
                  />

                  <SelectField
                    label="支払区分" required
                    value={form.paymentType}
                    onChange={v => upd("paymentType", v)}
                    options={PAYMENT_TYPES}
                  />

                  <div className="field-wide" style={{marginTop:-8}}>
                    <div style={{fontSize:12,color:'var(--muted)'}}>
                      固定費（1催行）：一定額 ／ 変動・人数比例（1名）：人数×単価 ／ 変動・スライド：人数帯で単価変動 ／ 完全変動（要入力）：毎回異なる
                    </div>
                  </div>

                  {/* 固定費（1催行） / 変動・人数比例（1名） */}
                  {(form.costType === "fixed" || form.costType === "per-person") && (
                    <Field label="単価 / 基本料金（円）" required>
                      <input type="number" min="0" value={form.unitPrice} onChange={e => upd("unitPrice", e.target.value)} placeholder="例：1200" />
                      {costTypeInfo.hint && <div style={{fontSize:12,color:'var(--muted)',marginTop:3}}>{costTypeInfo.hint}</div>}
                    </Field>
                  )}

                  {/* 変動・スライド */}
                  {form.costType === "slide" && (
                    <div className="field-wide">
                      <Field label="人数帯単価テーブル" required>
                        <TierTable
                          tiers={form.tiers.length ? form.tiers : [{ maxPax: "", price: "" }]}
                          onChange={v => upd("tiers", v)}
                        />
                      </Field>
                    </div>
                  )}

                  {/* 完全変動 */}
                  {form.costType === "full-var" && (
                    <div className="field-wide">
                      <div style={{background:'#fffbeb',border:'1px solid #fde68a',borderRadius:'var(--radius)',padding:'8px 12px',fontSize:12,color:'#92400e',marginBottom:8}}>
                        完全変動費はツアー実施ごとにガイドが実費を申請します。ここで設定する金額は参考となる基準価格です。
                      </div>
                      <Field label="基準価格（円）">
                        <input type="number" min="0" value={form.basePrice} onChange={e => upd("basePrice", e.target.value)} placeholder="例：3000" />
                        <div style={{fontSize:12,color:'var(--muted)',marginTop:3}}>任意入力。実費との差異をガイドが都度申請します。</div>
                      </Field>
                    </div>
                  )}

                  <div className="field-wide">
                    <Field label="備考">
                      <textarea value={form.notes} onChange={e => upd("notes", e.target.value)} rows={3} placeholder="適用条件・注意事項など" />
                    </Field>
                  </div>
                </div>
              </div>

              <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:8}}>
                <button className="btn ghost" onClick={() => { window.location.href = backUrl; }}>キャンセル</button>
                <button className="btn primary" onClick={handleSave}>
                  {saved ? "✓ 保存しました" : "変更保存"}
                </button>
              </div>
            </div>
          </section>
        </div>

      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
