                  <div className="modal-body">
                    <div className="csv-channel-info">
                      <span>対象チャネル:</span>
                      <span className="badge blue sq">{channel.label}</span>
                      <span>入金登録時の設定から自動表示</span>
                    </div>
                    <div
                      className={`drop-zone${dragOver?" drag-over":""}`}
                      onDragOver={e=>{e.preventDefault();setDragOver(true);}}
                      onDragLeave={()=>setDragOver(false)}
                      onDrop={handleDrop}
                      onClick={()=>fileInputRef.current?.click()}
                    >
                      <div className="drop-icon">⬆</div>
                      <div className="drop-main">ここにCSVファイルをドラッグ＆ドロップ</div>
                      <div className="drop-or">または</div>
                      <button className="btn" onClick={e=>{e.stopPropagation();fileInputRef.current?.click();}}>ファイルを選択</button>
                      <div className="drop-hint">対応形式：.csv / .tsv（UTF-8 または Shift-JIS）</div>
                      <input ref={fileInputRef} type="file" accept=".csv,.tsv" style={{display:"none"}} onChange={handleFileChange} />
                    </div>
                    <div className="csv-tip">
                      <span className="csv-tip-icon">💡</span>
                      <span>{tip}</span>
                    </div>
                  </div>
                  <div className="modal-foot">
                    <div></div>
                    <div className="modal-foot-right">
                      <button className="btn" onClick={onClose}>キャンセル</button>
                    </div>
                  </div>
                </>
              )}

              {/* ── STEP 2: 内容確認 ── */}
              {step === 2 && (
                <>
                  <div className="modal-body">
                    <div className="preview-summary">
                      <span>ファイル: <b>{fileName}</b></span>
                      <span>読み込み件数: <b>{PREVIEW_ROWS.length}件</b></span>
                    </div>
                    <div className="preview-scroll">
                      <table className="preview-table">
                        <thead>
                          <tr>
                            <th>OTA予約番号</th>
                            <th>ゲスト名</th>
                            <th>ツアー日</th>
                            <th className="right">グロス額</th>
                            <th className="right">手数料</th>
                            <th className="right">ネット額</th>
                          </tr>
                        </thead>
                        <tbody>
                          {PREVIEW_ROWS.map((r,i)=>(
                            <tr key={i}>
                              <td style={{fontFamily:"monospace",fontSize:11.5,fontWeight:600}}>{r.resNo}</td>
                              <td>{r.guest}</td>
                              <td>{r.date}</td>
                              <td className="right">{yen(r.gross)}</td>
                              <td className="right">{yen(r.fee)}</td>
                              <td className="right">{yen(r.net)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                    <div className="csv-tip" style={{marginTop:14}}>
                      <span className="csv-tip-icon">💡</span>
                      <span>「インポートして照合を開始」を押すと、この内容がOTAレポート行として追加されます。</span>
                    </div>
                  </div>
                  <div className="modal-foot">
                    <button className="btn" onClick={()=>setStep(1)}>← 戻る</button>
                    <div className="modal-foot-right">
                      <button className="btn" onClick={onClose}>キャンセル</button>
                      <button className="btn primary" onClick={()=>{ onImport(PREVIEW_ROWS); onClose(); }}>インポートして照合を開始 →</button>
                    </div>
                  </div>
                </>
              )}
            </div>
          </div>
        );
      }

      /* ── 照合検索パネル ── */
      function SearchPanel({ row, ch, onConfirm, onCancel }) {
        return (
          <div className="search-panel">
            <div className="sp-head">社内予約を検索して照合 — OTA予約番号: {row.resNo} / ゲスト: {row.guest}</div>
            <div className="cand-list">
              {CANDIDATES.map(c => {
                const expNet = Math.round(c.sale * (1 - ch.feeRate));
                const isMatch = expNet === row.net;
                return (
                  <div key={c.id} className="cand-item">
                    <span className="ci-id">{c.id}</span>
                    <span className="ci-guest">{c.guest}　{c.date}</span>
                    <span className="ci-amount">{yen(c.sale)}</span>
                    {isMatch && <span className="ci-match">金額一致</span>}
                    <button className="btn sm primary" onClick={() => onConfirm(c)}>照合する</button>
                  </div>
                );
              })}
            </div>
            <div style={{marginTop:10,display:"flex",gap:8}}>
              <button className="btn sm" onClick={onCancel}>キャンセル</button>
            </div>
          </div>
        );
      }

      /* ── 差異詳細パネル ── */
      function DiffDetail({ row, onSave, onCancel }) {
        const [memo, setMemo] = useState(row.diff?.memo || "");
        const [reason, setReason] = useState(row.diff?.reason || "金額修正あり");
        return (
          <div className="diff-inner">
            <div className="diff-row">
              <span className="diff-label">差異理由</span>
              <select className="ctrl" style={{maxWidth:240}} value={reason} onChange={e=>setReason(e.target.value)}>
                {["金額修正あり","キャンセル処理の違い","為替差","その他"].map(r=><option key={r}>{r}</option>)}
              </select>
            </div>
            <div className="diff-row">
              <span className="diff-label">期待ネット額</span>
              <div className="diff-vals">
                <span className="diff-val-exp">{yen(row.diff?.expected ?? row.net)}</span>
                <span style={{color:"var(--muted)"}}>→</span>
                <span className="diff-val-act">{yen(row.net)}</span>
              </div>
            </div>
            <div className="diff-row">
              <span className="diff-label">運営メモ</span>
              <textarea className="ctrl" style={{minHeight:56}} value={memo} onChange={e=>setMemo(e.target.value)} placeholder="差異の経緯・対応内容を記録..." />
            </div>
            <div style={{display:"flex",gap:8}}>
              <button className="btn sm primary" onClick={()=>onSave({reason,memo})}>保存</button>
              <button className="btn sm" onClick={onCancel}>キャンセル</button>
            </div>
          </div>
        );
      }

      /* ── 行追加フォーム ── */
      function AddRowForm({ feeRate, onAdd, onCancel }) {
        const [f, setF] = useState({ resNo:"", guest:"", date:"", gross:"" });
        const s = k => v => setF(p=>({...p,[k]:v}));
        const gross = num(f.gross);
        const fee = Math.round(gross * feeRate);
        const net = gross - fee;
        const canAdd = f.resNo && f.date && f.gross !== "";
        return (
          <div style={{padding:"14px 20px",background:"var(--green-bg, #f1f8f3)",borderBottom:"1px solid var(--line)"}}>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,minmax(0,1fr))",gap:12,marginBottom:10}}>
              <div className="field"><label className="field-label">OTA予約番号<span className="req"></span></label>
                <input className="ctrl" placeholder="VTR-XXXXXXX" value={f.resNo} onChange={e=>s("resNo")(e.target.value)} /></div>
              <div className="field"><label className="field-label">ゲスト名</label>
                <input className="ctrl" placeholder="Smith John" value={f.guest} onChange={e=>s("guest")(e.target.value)} /></div>
              <div className="field"><label className="field-label">ツアー日<span className="req"></span></label>
                <input type="date" className="ctrl" value={f.date} onChange={e=>s("date")(e.target.value)} /></div>
              <div className="field"><label className="field-label">グロス額<span className="req"></span></label>
                <div className="num-affix"><span className="pfx">¥</span>
                  <input className="ctrl" inputMode="numeric" placeholder="0" value={f.gross} onChange={e=>s("gross")(e.target.value)} /></div></div>
            </div>
            {f.gross !== "" && <div style={{fontSize:12,color:"var(--muted)",marginBottom:10}}>
              手数料 {yen(fee)}（{Math.round(feeRate*100)}%）→ ネット {yen(net)}
            </div>}
            <div style={{display:"flex",gap:8}}>
              <button className="btn sm primary" disabled={!canAdd} onClick={()=>onAdd({...f,fee,net})}>追加</button>
              <button className="btn sm" onClick={onCancel}>キャンセル</button>
            </div>
          </div>
        );
      }

      /* ── App ── */
      function App() {
        const isNew = new URLSearchParams(window.location.search).get("mode") === "new";
        const [rows, setRows] = useState(() => isNew ? [] : buildRows());
        const [deposit, setDeposit] = useState(() => isNew ? {
          id:"OTA-NEW-001", channel:"viator", monthLabel:"新規登録分",
          periodStart:"2026-06-04", periodEnd:"2026-06-05", bankDate:"2026-06-17",
          status:"unmatched", completedBy:"", completedAt:"", completed: false,
          bankAmount: 0, otaReportTotal: 0,
        } : DEPOSIT);
        const [editInfo, setEditInfo] = useState(false);
        const [addRowOpen, setAddRowOpen] = useState(false);
        const [searchRowId, setSearchRowId] = useState(null);
        const [diffOpenId, setDiffOpenId] = useState(null);
        const [toast, setToast] = useState(null);
        const [csvModalOpen, setCsvModalOpen] = useState(false);
        const toastTimer = useRef(null);

        const showToast = msg => { setToast(msg); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(()=>setToast(null),2400); };

        const ch = CHANNEL[deposit.channel];

        const counts = useMemo(()=>{
          const c={unmatched:0,matched:0,diff:0};
          rows.forEach(r=>{ c[r.result]=(c[r.result]||0)+1; });
          return c;
        },[rows]);
        const total = rows.length;
        const doneCount = counts.matched + counts.diff;
        const pct = total ? Math.round(doneCount/total*100) : 0;
        const reportTotal = rows.reduce((s,r)=>s+r.net,0);
        const bankAmount = isNew ? 0 : reportTotal;
        const bankDelta = bankAmount - reportTotal;

        const confirmMatch = (rid, cand) => {
          setRows(rs => rs.map(r => {
            if(r.rid !== rid) return r;
            const expected = Math.round(cand.sale*(1-ch.feeRate));
            if(expected === r.net) return {...r, result:"matched", intId:cand.id, diff:null};
            return {...r, result:"diff", intId:cand.id, diff:{reason:"金額修正あり",expected,memo:""}};
          }));
          setSearchRowId(null);
          showToast(`${cand.id} と照合しました`);
        };
        const unmatch = rid => {
          setRows(rs=>rs.map(r=>r.rid===rid?{...r,result:"unmatched",intId:null,diff:null}:r));
          setDiffOpenId(null);
          showToast("照合を解除しました");
        };
        const saveDiff = (rid, patch) => {
          setRows(rs=>rs.map(r=>r.rid===rid?{...r,diff:{...r.diff,...patch}}:r));
          setDiffOpenId(null);
          showToast("差異内容を保存しました");
        };
        const addRow = data => {
          setRows(rs=>[...rs,{rid:++_rid,...data,result:"unmatched",intId:null,diff:null}]);
          setAddRowOpen(false);
          showToast("OTAレポート行を追加しました");
        };
        const importCsv = (rows) => {
          const newRows = rows.map(r => {
            const fee = r.fee;
            const net = r.net;
            return { rid: ++_rid, resNo: r.resNo, guest: r.guest, date: r.date,
              gross: r.gross, fee, net, result: "unmatched", intId: null, diff: null };
          });
          setRows(rs => [...rs, ...newRows]);
          showToast(`${newRows.length}件のOTAレポート行をインポートしました`);
        };

        const completeReconcile = () => {
          setDeposit(d=>({...d,completed:true,status:counts.diff>0?"diff":"matched",
            completedBy:"佐藤 美咲",completedAt:nowStr()}));
          showToast("照合を完了しました");
        };

        const statusS = STATUS[deposit.completed?(counts.diff>0?"diff":"matched"):deposit.status];

        return (
          <div className="app-shell">
            <SideNav />
            <main className="detail-main">
              {/* パンくず */}
              <div className="crumbs">
                <a href="ota-payment-matching.html">OTA入金照合</a>
                <span className="sep">›</span>
                <span className="current">{ch.label} {deposit.monthLabel}</span>
              </div>

              {/* サマリーカード */}
              <div className="sum-card">
                <div className="sum-head">
                  <div>
                    <div className="sum-title">
                      <span className="badge blue sq">{ch.label}</span>
                      <h2>{ch.label} {deposit.monthLabel}</h2>
                      <span className={`badge ${statusS.cls}`}><span className="dot"></span>{statusS.label}</span>
                    </div>
                    <div className="sum-meta">
                      <span>対象期間: <b>{deposit.periodStart} 〜 {deposit.periodEnd}</b></span>
                      <span>入金日: <b>{deposit.bankDate}</b></span>
                    </div>
                  </div>
                  <button className="btn sm" onClick={()=>setEditInfo(v=>!v)}>
                    {editInfo ? "× 閉じる" : "▼ 編集"}
                  </button>
                </div>

                {editInfo && (
                  <div className="edit-panel">
                    <div className="ep-inner">
                      <div className="form-grid-2">
                        <div className="field"><label className="field-label">銀行入金日</label>
                          <input type="text" className="ctrl" defaultValue={deposit.bankDate} /></div>
                        <div className="field"><label className="field-label">銀行入金額</label>
                          <div className="num-affix"><span className="pfx">¥</span>
                            <input className="ctrl" defaultValue={String(bankAmount)} /></div></div>
                      </div>
                      <div className="form-actions-sm">
                        <button className="btn sm primary" onClick={()=>{setEditInfo(false);showToast("入金基本情報を更新しました");}}>保存</button>
                        <button className="btn sm" onClick={()=>setEditInfo(false)}>キャンセル</button>
                      </div>
                    </div>
                  </div>
                )}

                <div className="sum-figures">
                  <div className="sum-fig">
                    <span className="sf-lab">銀行入金額</span>
                    <span className="sf-val">{yen(bankAmount)}</span>
                  </div>
                  <div className="sum-fig">
                    <span className="sf-lab">OTAレポート合計</span>
                    <span className="sf-val">{yen(reportTotal)}</span>
                  </div>
                  <div className="sum-fig diff-fig">
                    <span className="sf-lab">照合差額</span>
                    <span className={`sf-val ${bankDelta===0?"ok":"bad"}`}>{bankDelta===0?"¥0（一致）":yen(bankDelta)}</span>
                  </div>
                </div>

                <div className="sum-progress">
                  <div className="sp-top">
                    <span className="sp-label">照合進捗: <b>{doneCount}/{total}</b>件 照合済み</span>
                    <span className="sp-pct">{pct}%</span>
                  </div>
                  <div className="sp-bar"><div className="sp-fill" style={{width:pct+"%"}}></div></div>
                  <div className="sp-counts">
                    <span className="c-muted">未照合: <b>{counts.unmatched}</b>件</span>
                    <span className="c-coral">差異あり: <b>{counts.diff}</b>件</span>
                    <span className="c-green">照合済み: <b>{counts.matched}</b>件</span>
                  </div>
                </div>
              </div>

              {/* テーブルカード */}
              <div className="tbl-card">
                <div className="tbl-toolbar">
                  <span className="tt-title">OTAレポート行</span>
                  <div style={{display:"flex",gap:8}}>
                    <button className="btn sm primary" onClick={()=>setCsvModalOpen(true)}>📂 OTAレポートCSVをアップロード</button>
                    <button className="btn sm" onClick={()=>setAddRowOpen(v=>!v)}>
                      {addRowOpen?"× 追加をやめる":"＋ 行を手動追加"}
                    </button>
                  </div>
                </div>

                {addRowOpen && <AddRowForm feeRate={ch.feeRate} onAdd={addRow} onCancel={()=>setAddRowOpen(false)} />}

                <div className="tbl-scroll">
                  <table className="recon-table">
                    <thead>
                      <tr>
                        <th>OTA予約番号</th>
                        <th>ゲスト名</th>
                        <th>ツアー日</th>
                        <th className="right">グロス額</th>
                        <th className="right">手数料</th>
                        <th className="right">ネット額</th>
                        <th>社内予約ID</th>
                        <th>照合結果</th>
                        <th className="right">操作</th>
                      </tr>
                    </thead>
                    <tbody>
                      {rows.length === 0 && (
                        <tr>
                          <td colSpan={9} style={{padding:"48px 20px",textAlign:"center"}}>
                            <div style={{color:"var(--muted)",fontSize:14,fontWeight:600,marginBottom:6}}>OTAレポート行がまだありません</div>
                            <div style={{color:"var(--muted-soft)",fontSize:13}}>「+ 行を手動追加」からレポートの予約行を登録してください。</div>
                          </td>
                        </tr>
                      )}
                      {rows.map(r => {
                        const rr = ROW_RESULT[r.result];
                        return (
                          <React.Fragment key={r.rid}>
                            <tr className={r.result==="diff"?"r-diff":""}>
                              <td><span className="res-no">{r.resNo}</span></td>
                              <td>{r.guest}</td>
                              <td>{r.date}</td>
                              <td className="right"><span className="money">{yen(r.gross)}</span></td>
                              <td className="right"><span className="money">{yen(r.fee)}</span></td>
                              <td className="right"><span className="money net">{yen(r.net)}</span></td>
                              <td>{r.intId ? <span className="int-id">{r.intId}</span> : <span style={{color:"var(--muted-soft)"}}>——</span>}</td>
                              <td>
                                <span className={`badge ${rr.cls}`}><span className="dot"></span>{rr.label}</span>
                              </td>
                              <td style={{textAlign:"right"}}>
                                {r.result==="unmatched" && (
                                  <button className="btn sm" onClick={()=>setSearchRowId(searchRowId===r.rid?null:r.rid)}>照合する</button>
                                )}
                                {r.result==="matched" && (
                                  <button className="btn sm" style={{color:"var(--coral)"}} onClick={()=>unmatch(r.rid)}>解除</button>
                                )}
                                {r.result==="diff" && (
                                  <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}>
                                    <button className="btn sm" onClick={()=>setDiffOpenId(diffOpenId===r.rid?null:r.rid)}>修正</button>
                                    <button className="btn sm" style={{color:"var(--coral)"}} onClick={()=>unmatch(r.rid)}>解除</button>
                                  </div>
                                )}
                              </td>
                            </tr>
                            {searchRowId===r.rid && (
                              <tr><td colSpan={9} style={{padding:"10px 14px",background:"var(--blue-soft)"}}>
                                <SearchPanel row={r} ch={ch} onConfirm={c=>confirmMatch(r.rid,c)} onCancel={()=>setSearchRowId(null)} />
                              </td></tr>
                            )}
                            {diffOpenId===r.rid && r.result==="diff" && (
                              <tr className="diff-expand"><td colSpan={9}>
                                <DiffDetail row={r} onSave={p=>saveDiff(r.rid,p)} onCancel={()=>setDiffOpenId(null)} />
                              </td></tr>
                            )}
                          </React.Fragment>
                        );
                      })}
                    </tbody>
                  </table>
                </div>

                {/* 照合完了エリア */}
                <div className="complete-bar">
                  {deposit.completed ? (
                    <div className="cb-done">
                      <span className={`badge ${counts.diff>0?"coral":"green"}`}><span className="dot"></span>
                        {counts.diff>0?"差異あり（承認済み）で完了":"照合済み"}</span>
                      <span className="cbd-meta">照合担当者: {deposit.completedBy} ／ 照合日時: {deposit.completedAt}</span>
                    </div>
                  ) : counts.unmatched > 0 ? (
                    <div className="cb-actions">
                      <span className="cb-hint">未照合 {counts.unmatched}件が残っています。すべての行を照合すると完了できます。</span>
                    </div>
                  ) : counts.diff > 0 ? (
                    <React.Fragment>
                      <div className="cb-warn">
                        <span className="cbw-ic">!</span>
                        <div>差異あり件数：<b>{counts.diff}件</b>。差異を確認・承認して照合完了にしてください。</div>
                      </div>
                      <div className="cb-actions">
                        <button className="btn primary" onClick={completeReconcile}>差異を承認して完了にする</button>
                      </div>
                    </React.Fragment>
                  ) : (
                    <div className="cb-actions">
                      <button className="btn primary" onClick={completeReconcile}>照合を完了にする</button>
                    </div>
                  )}
                </div>
              </div>
            </main>

            {/* CSVアップロードモーダル */}
            {csvModalOpen && (
              <CsvUploadModal
                channel={{...ch, key: deposit.channel}}
                onClose={()=>setCsvModalOpen(false)}
                onImport={importCsv}
              />
            )}

            {/* トースト */}
            <div style={{
              position:"fixed",bottom:26,left:"50%",transform:`translateX(-50%) translateY(${toast?"0":"12px"})`,
              background:"var(--ink)",color:"#fff",padding:"10px 18px",borderRadius:999,
              fontSize:13,fontWeight:550,opacity:toast?1:0,pointerEvents:"none",
              transition:"opacity 0.2s,transform 0.2s",zIndex:320,whiteSpace:"nowrap"
            }}>{toast}</div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
