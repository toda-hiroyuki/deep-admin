      function Caret() {
        return (
          <svg width="12" height="12" viewBox="0 0 12 12" style={{color:"var(--muted)"}}>

      function MultiSelect({ options, selected, onToggle }) {
        const [open, setOpen] = useState(false);
        const ref = useRef(null);
        useEffect(() => {
          if (!open) return;
          const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
          document.addEventListener("mousedown", onDoc);
          return () => document.removeEventListener("mousedown", onDoc);
        }, [open]);
        const label = selected.length === 0 ? "すべて" : selected.length === options.length ? "すべて選択中" : selected.join(" / ");
        return (
          <div className="ms" ref={ref}>
            <button type="button" className={`ms-trigger ${open ? "open" : ""}`} onClick={() => setOpen(o => !o)}>
              <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{label}</span>
              <span style={{display:"flex",alignItems:"center",gap:7,flexShrink:0}}>
                {selected.length > 0 && <span className="ms-count">{selected.length}</span>}
                <Caret />
              </span>
            </button>
            {open && (
              <div className="ms-pop">
                {options.map(o => (
                  <label key={o} className="ms-opt">
                    <input type="checkbox" checked={selected.includes(o)} onChange={() => onToggle(o)} />
                    <span>{o}</span>
                  </label>
                ))}
              </div>
            )}
          </div>
        );
      }

        }, []);

          setToast(msg);
          clearTimeout(toastTimer.current);
          toastTimer.current = setTimeout(() => setToast(null), 2200);
        };

        const toggleStatus = (o) => setStatusSel(s => s.includes(o) ? s.filter(x => x !== o) : [...s, o]);
        const toggleSort = (key) => {
          if (sortKey === key) setSortDir(d => d === "asc" ? "desc" : "asc");
          else { setSortKey(key); setSortDir("asc"); }
        };

                <div className="filter-row">
                  <div className="filter-field">
                    <span className="filter-label">予約ID / 外部予約番号</span>
                    <input className="ctrl" style={{width:260}} placeholder="例：BK-260601-00001"
                      value={idQuery} onChange={e => setIdQuery(e.target.value)} />
                  </div>
                  <div className="filter-field">
                    <span className="filter-label">TourOption</span>
                    <input className="ctrl" style={{width:200}} placeholder="コード・名称で検索"
                      value={tourQuery} onChange={e => setTourQuery(e.target.value)} />
                  </div>
                  <div className="filter-field">
                    <span className="filter-label">ツアー日</span>
                    <div className="date-range">
                      <input type="date" className="ctrl" value={from} onChange={e => setFrom(e.target.value)} />
                      <span className="sep">–</span>
                      <input type="date" className="ctrl" value={to} onChange={e => setTo(e.target.value)} />
                    </div>
                  </div>
                </div>
                <div className="filter-row">
                  <div className="filter-field">
                    <span className="filter-label">予約元 / チャネル</span>
                    <select className="ctrl" style={{width:160}} value={channel} onChange={e => setChannel(e.target.value)}>
                      {CHANNEL_OPTIONS.map(o => <option key={o} value={o}>{o}</option>)}
                    </select>
                  </div>
                  <div className="filter-field">
                    <span className="filter-label">ゲスト言語</span>
                    <select className="ctrl" style={{width:140}} value={lang} onChange={e => setLang(e.target.value)}>
                      <option>すべて</option><option>日本語</option><option>英語</option>
                      <option>中国語(簡体)</option><option>韓国語</option><option>フランス語</option>
                    </select>
                  </div>
                  <div className="filter-field">
                    <span className="filter-label">予約ステータス</span>
                    <MultiSelect options={STATUS_OPTIONS} selected={statusSel} onToggle={toggleStatus} />
                  </div>
                  <div className="filter-field">
                    <span className="filter-label">手配状況</span>
                    <select className="ctrl" style={{width:140}} value={arrange} onChange={e => setArrange(e.target.value)}>
                      {ARRANGE_OPTIONS.map(o => <option key={o} value={o}>{o}</option>)}
                    </select>
                  </div>
                  <label className="check-filter">
                    <input type="checkbox" checked={unassignedOnly} onChange={e => setUnassignedOnly(e.target.checked)} />
                    未割り当てのみ
                  </label>
                  <div className="filter-actions">
                    <button className="btn-link" onClick={reset}>リセット</button>
                    <button className="btn primary" onClick={() => showToast("絞り込みを適用しました")}>絞り込む</button>
                  </div>
                </div>
              </div>

              <div className="result-meta">
                <span><strong>1–{rows.length}</strong> / {ROWS.length}件</span>
                <span>ツアー日時 {sortDir === "asc" ? "昇順" : "降順"}で表示中</span>
              </div>

              <div className="list-table-wrap">
                <div className="table-scroll">
                  <table className="list-table" style={{minWidth:1100}}>
                    <thead>
                      <tr>
                        <th>予約ID</th>
                        <th>ゲスト名</th>
                        <th>TourOption</th>
                        <th style={{cursor:"pointer"}} onClick={() => toggleSort("tour")}>
                          ツアー日時<span className={`sort-arrow ${sortKey === "tour" ? "" : "idle"}`}>{sortKey === "tour" ? (sortDir === "asc" ? "▲" : "▼") : "▲▼"}</span>
                        </th>
                        <th>参加人数</th>
                        <th>予約元</th>
                        <th>予約ステータス</th>
                        <th>催行回紐付け</th>
                        <th>手配状況</th>
                      </tr>
                    </thead>
                    <tbody>
                      {rows.map(r => (
                        <tr key={r.id} onClick={() => showToast(`予約詳細: ${r.id}`)} style={{cursor:"pointer"}}>
                          <td><span className="code-mono" style={{fontSize:12,color:"var(--ink-soft)",fontWeight:600}}>{r.id}</span></td>
                          <td><strong>{r.guest}</strong></td>
                          <td>
                            {r.code
                              ? <React.Fragment><div className="code-mono" style={{fontSize:12,color:"var(--ink-soft)",fontWeight:600}}>{r.code}</div><div className="cell-sub">{r.tour}</div></React.Fragment>
                              : <React.Fragment><span className="badge amber">⚠ 未設定</span><div className="cell-sub">{r.tour}</div></React.Fragment>}
                          </td>
                          <td className="cell-date">
                            <div>{r.date.replace(/-/g, "/")}</div>
                            <div className="time">{r.time}</div>
                          </td>
                          <td className="pax">{r.pax}</td>
                          <td>
                            <span className="channel">
                              <span className={`ch-dot ${channelClass(r.channel)}`}></span>{r.channel}
                            </span>
                          </td>
                          <td><span className={`status-pill ${r.status.cls}`}><span className="dot"></span>{r.status.label}</span></td>
                          <td><span className={`status-pill ${r.link.cls}`}><span className="dot"></span>{r.link.label}</span></td>
                          <td>{r.arrange.cls === "dash" ? <span className="muted-dash">—</span> : <span className={`status-pill ${r.arrange.cls}`}><span className="dot"></span>{r.arrange.label}</span>}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              <div className="pagination">
                <button className="page-btn nav">← 前へ</button>
                <button className="page-btn active">1</button>
                <button className="page-btn" onClick={() => showToast("2ページ目へ")}>2</button>
                <button className="page-btn" onClick={() => showToast("3ページ目へ")}>3</button>
                <button className="page-btn nav" onClick={() => showToast("2ページ目へ")}>次へ →</button>
              </div>
            </main>

            <div className={`toast ${toast ? "show" : ""}`}>
              <span className="t-dot"></span>{toast}
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
