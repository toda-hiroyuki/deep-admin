        const [y,m]=month.split("-").map(Number);
        const d=new Date(y,m-1+delta);
        setMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);
        setClosed(false);
      };
      const toggle=(id)=>setExpanded(p=>({...p,[id]:!p[id]}));
      const confirmSession=(id)=>setSessConfirmed(p=>({...p,[id]:true}));
      const unconfirm=(id)=>setSessConfirmed(p=>({...p,[id]:false}));
      const visibleRes=(s)=>fChannel==="all"?s.reservations:s.reservations.filter(b=>b.channel===fChannel);
      const issueText=(s)=>{const o=[];if(guidePending(s))o.push("ガイド精算 未確定");if(facilityPending(s))o.push("施設費 未確定");if(otaPendingRes(s).length)o.push(`OTA照合 未完了${otaPendingRes(s).length}件`);return o.join("・");};
      const issueChips=(s)=>{
        if(sessConfirmed[s.id])return[{cls:"green",label:"確認済み",dot:true}];
        if(sessReady(s))return[{cls:"green",label:"確認可",dot:true}];
        const o=[];
        if(guidePending(s))o.push({cls:"amber",label:"ガイド精算"});
        if(facilityPending(s))o.push({cls:"amber",label:"施設費"});
        const op=otaPendingRes(s).length;
        if(op)o.push({cls:"coral",label:`OTA照合${op}`});
        return o;
      };
      const sumS=(fn)=>monthSessions.reduce((t,s)=>t+fn(s),0);
      const sessionCount=monthSessions.length;
      const bookingCount=sumS(s=>activeRes(s).length);
      const grossTotal=sumS(s=>sumB(s,"gross"));
      const otaFeeTotal=sumS(s=>sumB(s,"otaFee"));
      const payFeeTotal=sumS(s=>sumB(s,"payFee"));
      const netTotal=sumS(netTotalOf);
      const guideRewardConf=sumS(s=>guidePending(s)?0:s.guideReward.total);
      const facilityConf=sumS(s=>facilityPending(s)?0:(s.facility||0));
      const profitTotal=sumS(s=>sessReady(s)?profitOf(s):0);
      const pendingSessions=monthSessions.filter(s=>!sessReady(s)).length;
      const confirmedCount=monthSessions.filter(s=>sessConfirmed[s.id]).length;
      const unconfirmedCount=sessionCount-confirmedCount;
      const display=monthSessions.filter(s=>
        (fChannel==="all"||s.reservations.some(b=>b.channel===fChannel))&&
        (!tFacility||facilityPending(s))&&(!tGuide||guidePending(s))&&(!tOta||otaPendingRes(s).length>0)
      );
      const allOpen=display.length>0&&display.every(s=>expanded[s.id]);
      const toggleAll=()=>{const v=!allOpen;const n={...expanded};display.forEach(s=>{n[s.id]=v;});setExpanded(n);};
      const canClose=sessionCount>0&&unconfirmedCount===0&&!closed;
      const STATS=[
        {lab:"催行回数",note:"（当月実施分）",val:<span>{sessionCount}<span className="stat-unit">回</span></span>},
        {lab:"総予約件数",val:<span>{bookingCount}<span className="stat-unit">件</span></span>},
        {lab:"グロス売上合計",val:yen(grossTotal)},
        {lab:"チャネル手数料合計",val:yen(otaFeeTotal)},
        {lab:"決済手数料合計",val:yen(payFeeTotal)},
        {lab:"ネット受取額合計",val:yen(netTotal),cls:"accent"},
        {lab:"ガイド報酬合計",note:"（確定分）",val:yen(guideRewardConf)},
        {lab:"施設費合計",note:"（確定分）",val:yen(facilityConf)},
        {lab:"粗利合計",note:`（確定分）※未確定${pendingSessions}催行回を除く`,val:yen(profitTotal),cls:"accent"},
      ];
      return(
        <div className="app-shell">
          <Sidebar/>
          <main className="workspace">
            <div className="crumbs"><span>精算・経営</span><span className="sep">›</span><span className="current">月次締め確認</span></div>
            <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",gap:16,flexWrap:"wrap"}}>
              <div className="page-title"><h1>月次締め確認</h1><div className="sub">催行回ごとに当月の収支を確認し、月次締めを完了します</div></div>
            </div>
            <section className="card">
              <div className="card-head">
                <div className="card-title">月次サマリー<span style={{fontSize:11.5,fontWeight:500,color:"var(--muted)",marginLeft:6}}>当月のツアー実施済み催行回の収支</span></div>
                <div style={{display:"inline-flex",alignItems:"center",gap:4}}>
                  <button className="mn-btn" onClick={()=>adjMonth(-1)}>‹</button>
                  <span className="mn-label">{monthLabel}</span>
                  <button className="mn-btn" onClick={()=>adjMonth(1)}>›</button>
                </div>
              </div>
              <div className="card-body">
                <div className="stat-row">
                  {STATS.map((s,i)=>(
                    <div className={`stat ${s.cls||""}`} key={i}>
                      <span className="stat-num">{s.val}</span>
                      <span className="stat-lab">{s.lab}{s.note&&<span className="lab-note">{s.note}</span>}</span>
                    </div>
                  ))}
                  <div className={`stat alert${pendingSessions===0?" zero":""}`}>
                    <span className="stat-num">{pendingSessions}<span className="stat-unit">回</span></span>
                    <span className="stat-lab">未確定催行回{pendingSessions===0?"（なし）":"（要対応）"}</span>
                  </div>
                </div>
              </div>
            </section>
            <section className="card">
              <div className="filter-bar">
                <div><span className="ff-lab">期間</span>
                  <select className="ctrl select-arrow" value={month} onChange={e=>{setMonth(e.target.value);setClosed(false);}}>
                    <option value="2026-04">2026年04月</option>
                    <option value="2026-05">2026年05月</option>
                    <option value="2026-06">2026年06月</option>
                    <option value="2026-07">2026年07月</option>
                  </select>
                </div>
                <div><span className="ff-lab">チャネル</span>
                  <select className="ctrl select-arrow" value={fChannel} onChange={e=>setFChannel(e.target.value)}>
                    <option value="all">すべて</option>
                    <option value="direct">自社サイト</option>
                    <option value="viator">Viator</option>
                    <option value="getyourguide">GetYourGuide</option>
                    <option value="klook">Klook</option>
                    <option value="airbnb">Airbnb</option>
                  </select>
                </div>
                <div><span className="ff-lab">絞り込み</span>
                  <div className="toggles">
                    <label className="toggle"><input type="checkbox" checked={tFacility} onChange={e=>setTFacility(e.target.checked)}/><span className="track"></span><span className="t-label">施設費・未確定のみ</span></label>
                    <label className="toggle"><input type="checkbox" checked={tGuide} onChange={e=>setTGuide(e.target.checked)}/><span className="track"></span><span className="t-label">ガイド精算・未確定のみ</span></label>
                    <label className="toggle"><input type="checkbox" checked={tOta} onChange={e=>setTOta(e.target.checked)}/><span className="track"></span><span className="t-label">OTA照合・未完了のみ<span className="t-note">（OTA経由のみ）</span></span></label>
                  </div>
                </div>
                {display.length>0&&<div style={{alignSelf:"flex-end"}}><button className="btn" onClick={toggleAll}>{allOpen?"すべて折りたたむ":"すべて展開"}</button></div>}
                <span className="result-count">{display.length} / {sessionCount}催行回</span>
              </div>
              {fChannel!=="all"&&<div className="filter-note"><span className="badge blue" style={{borderRadius:4}}>絞り込み中</span>チャネル「{CHANNEL[fChannel].label}」の予約を含む催行回のみ表示。</div>}
              {sessionCount===0?(
                <div className="empty-state"><div className="es-ic">◷</div><div className="es-main">{monthLabel}にツアー実施済みの催行回はありません</div><div className="es-sub">対象月を変更してください。</div></div>
              ):display.length===0?(
                <div className="empty-state"><div className="es-ic">⌕</div><div className="es-main">条件に一致する催行回がありません</div><div className="es-sub">フィルター条件を変更してください。</div></div>
              ):(
                <div className="tbl-scroll">
                  <table className="settle-table master">
                    <thead><tr>
                      <th className="c-exp"></th><th>日付</th><th>ツアー</th><th>ガイド</th>
                      <th className="right">予約·人数</th><th className="right">グロス売上</th>
                      <th className="right">チャネル手数料</th><th className="right">決済手数料</th>
                      <th className="right calc">ネット受取</th><th className="right">ガイド報酬</th>
                      <th className="right">施設費</th><th className="right calc">粗利</th>
                      <th>状態</th><th className="right">確認</th>
                    </tr></thead>
                    <tbody>
                      {display.map(s=>{
                        const att=sessAttention(s);const exp=!!expanded[s.id];const confirmed=!!sessConfirmed[s.id];const profit=profitOf(s);
                        const stop=(e)=>e.stopPropagation();
                        return(
                          <React.Fragment key={s.id}>
                            <tr className={`master-row${att?" attention":""}`} onClick={()=>toggle(s.id)}>
                              <td className="c-exp"><Caret open={exp}/></td>
                              <td className="c-date">{s.date.slice(5)}<span className="d-time">{s.time}</span></td>
                              <td className="c-tour"><span className="t-name">{s.tour}</span><span className="t-code">{s.code}</span></td>
                              <td className="c-guide">{s.guide?s.guide.name:<span className="muted-dash">未定</span>}</td>
                              <td className="right">{activeRes(s).length}予約 / {paxOf(s)}名</td>
                              <td className="right"><span className="money">{yen(sumB(s,"gross"))}</span></td>
                              <td className="right">{sumB(s,"otaFee")?<span className="money">{yen(sumB(s,"otaFee"))}</span>:<span className="muted-dash">—</span>}</td>
                              <td className="right">{sumB(s,"payFee")?<span className="money">{yen(sumB(s,"payFee"))}</span>:<span className="muted-dash">—</span>}</td>
                              <td className="right calc"><span className="money calc-val">{yen(netTotalOf(s))}</span></td>
                              <td className="right">{guidePending(s)&&<span className="cost-dot amber"></span>}<span className="money">{yen(s.guideReward.total)}</span></td>
                              <td className="right">{facilityPending(s)?<span className="muted-dash">未</span>:<span className="money">{yen(s.facility)}</span>}</td>
                              <td className="right calc"><span className={`money calc-val${profit<0?" neg":""}`}>{yen(profit)}</span></td>
                              <td><span className="state-chips">{issueChips(s).map((c,i)=><span className={`chip-mini ${c.cls}`} key={i}>{c.dot&&<span className="dot"></span>}{c.label}</span>)}</span></td>
                              <td className="right" onClick={stop}>
                                <span className="act-cell">
                                  {confirmed?<button className="btn" disabled={closed} onClick={()=>unconfirm(s.id)}>取消</button>
                                    :sessReady(s)?<button className="btn primary" disabled={closed} onClick={()=>confirmSession(s.id)}>この回を確認</button>
                                    :<button className="btn" disabled title={issueText(s)}>確認不可</button>}
                                </span>
                              </td>
                            </tr>
                            {exp&&(
                              <tr className="expand-row"><td colSpan={14}>
                                <div className="exp-body">
                                  <div className="exp-head">
                                    <span className="code-mono">{s.id}</span>
                                    <span className="badge green"><span className="dot"></span>実施済み</span>
                                    <span className="exp-meta">{LANG_LABEL[s.lang]||s.lang} · ガイド {s.guide?s.guide.name:"未定"}</span>
                                  </div>
                                  <div>
                                    <div className="sub-label">予約内訳<span className="sl-hint">予約ごとの売上・チャネル手数料</span></div>
                                    <div className="inner-wrap">
                                      <table className="settle-table inner">
                                        <thead><tr>
                                          <th>予約ID</th><th>チャネル</th><th className="right">人数</th>
                                          <th className="right">グロス売上</th><th className="right">チャネル手数料</th>
                                          <th className="right">決済手数料</th><th className="right calc">ネット受取</th>
                                          <th>OTA照合</th><th className="right">アクション</th>
                                        </tr></thead>
                                        <tbody>
                                          {visibleRes(s).map(b=>{
                                            const ch=CHANNEL[b.channel];const om=b.ota?OTA_META[b.ota]:null;
                                            const bAtt=!b.cancelled&&isOta(b)&&b.ota!=="matched";
                                            return(
                                              <tr key={b.id} className={b.cancelled?"row-cancelled":bAtt?"attention":"confirmed"}>
                                                <td><span className="code-mono">{b.id}</span></td>
                                                <td><span className={`badge ${ch.cls}`} style={{borderRadius:4}}>{ch.label}</span></td>
                                                <td className="right">{b.pax}名</td>
                                                <td className="right"><span className="money">{yen(b.gross)}</span></td>
                                                <td className="right">{b.otaFee?<span className="money">{yen(b.otaFee)}</span>:<span className="muted-dash">—</span>}</td>
                                                <td className="right">{b.payFee?<span className="money">{yen(b.payFee)}</span>:<span className="muted-dash">—</span>}</td>
                                                <td className="right calc"><span className="money calc-val">{yen(netOf(b))}</span></td>
                                                <td>{om?<span className={`badge ${om.cls}`}><span className="dot"></span>{om.label}</span>:<span className="muted-dash">—</span>}</td>
                                                <td className="right"><span className="act-cell">{isOta(b)&&<a className="lnk" href="ota-payment-matching.html">OTA照合</a>}</span></td>
                                              </tr>
                                            );
                                          })}
                                        </tbody>
                                        <tfoot><tr>
                                          <td colSpan={2}>予約合計</td><td className="right">{paxOf(s)}名</td>
                                          <td className="right"><span className="money">{yen(sumB(s,"gross"))}</span></td>
                                          <td className="right"><span className="money">{yen(sumB(s,"otaFee"))}</span></td>
                                          <td className="right"><span className="money">{yen(sumB(s,"payFee"))}</span></td>
                                          <td className="right calc"><span className="money calc-val">{yen(netTotalOf(s))}</span></td>
                                          <td colSpan={2}></td>
                                        </tr></tfoot>
                                      </table>
                                    </div>
                                  </div>
                                  <div className="sess-cost">
                                    <div className="cost-row">
                                      <div className="cost-label">ガイド報酬<span className="badge" style={{borderRadius:4,background:"var(--bg-sunken)",color:"var(--ink-soft)"}}>催行回1回</span><span className={`badge ${GUIDE_META[s.guideStatus].cls}`}><span className="dot"></span>{GUIDE_META[s.guideStatus].label}</span></div>
                                      <div className="cost-val"><span className="money">{yen(s.guideReward.total)}</span></div>
                                      <div className="cost-breakdown">{s.guideReward.total>0?`ツアー報酬 ${yen(s.guideReward.wage)} ＋ 交通費 ${yen(s.guideReward.transport)}${s.guideReward.other?` ＋ その他 ${yen(s.guideReward.other)}`:""}` :"このツアーはガイド報酬の発生なし"}</div>
                                    </div>
                                    <div className="cost-row">
                                      <div className="cost-label">施設費<span className="badge" style={{borderRadius:4,background:"var(--bg-sunken)",color:"var(--ink-soft)"}}>実績</span><span className={`badge ${FACILITY_META[s.facilityStatus].cls}`}><span className="dot"></span>{FACILITY_META[s.facilityStatus].label}</span></div>
                                      <div className="cost-val">{facilityPending(s)?<span className="muted-dash">未入力</span>:<span className="money">{yen(s.facility)}</span>}</div>
                                      <div className="cost-breakdown">施設の固定費・変動費・変更時のキャンセル料を含む実績額<span className="bd-note">別画面で確定した金額が反映されます</span></div>
                                    </div>
                                  </div>
                                  <div className="sess-formula">
                                    <span className="fx-term"><span className="fx-lab">ネット受取合計</span><span className="fx-num">{yen(netTotalOf(s))}</span></span>
                                    <span className="fx-op">−</span>
                                    <span className="fx-term"><span className="fx-lab">ガイド報酬</span><span className="fx-num">{yen(s.guideReward.total)}</span></span>
                                    <span className="fx-op">−</span>
                                    <span className="fx-term"><span className="fx-lab">施設費</span><span className="fx-num">{yen(s.facility||0)}</span></span>
                                    <span className="fx-op">=</span>
                                    <span className="fx-term result"><span className="fx-lab">催行回粗利</span><span className={`fx-num${profit<0?" neg":""}`}>{yen(profit)}</span></span>
                                  </div>
                                </div>
                              </td></tr>
                            )}
                          </React.Fragment>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
              {sessionCount>0&&(
                <div className="close-bar">
                  <div className="close-status">
                    {closed?<><span className="badge green"><span className="dot"></span>締め完了</span><span className="cs-strong">{monthLabel}は締め処理済みです</span></>
                      :unconfirmedCount===0?<><span className="badge green"><span className="dot"></span>全催行回 確認済み</span><span>すべての催行回が確認済みです。月次締めを実行できます。</span></>
                      :<><span className="badge amber"><span className="dot"></span>未確認 {unconfirmedCount}催行回</span><span>{pendingSessions>0?`うち${pendingSessions}催行回はガイド精算・施設費・OTA照合が未確定です。`:"各催行回の収支を確認してください。"}</span></>}
                  </div>
                  <div className="close-right">
                    {!closed&&(unconfirmedCount===0?<span className="close-hint ok">締め可能</span>:<span className="close-hint">{unconfirmedCount}催行回 未確認</span>)}
                    <button className="btn primary lg" disabled={!canClose} onClick={()=>{setClosed(true);showToast(`${monthLabel}を締めました`);}}>
                      {closed?"締め処理済み":"この月を締める"}
                    </button>
                  </div>
                </div>
              )}
            </section>
          </main>
          {toast&&<div className="toast show"><span className="t-dot"></span>{toast}</div>}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
