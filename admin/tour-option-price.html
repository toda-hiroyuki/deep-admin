<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>料金区分 編集 | deep_Admin</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="css/common.css">
  </head>
  <body data-density="regular" data-side="default">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <script src="js/master-data.js"></script>
    <script type="text/babel" data-presets="react">
const { useState, useCallback, useRef, useEffect } = React;

// ── Helpers ───────────────────────────────────────────────────────────────────

function getParam(key) {
  try {
    return new URLSearchParams(window.location.search).get(key);
  } catch (e) {
    return null;
  }
}

// Participant category master (マスター管理)
const PARTICIPANT_CATEGORY_MASTER = [
  { id: "cat-adult",  label: "大人" },
  { id: "cat-child",  label: "小人" },
  { id: "cat-senior", label: "シニア" },
  { id: "cat-infant", label: "乳幼児" },
  { id: "cat-none",   label: "区別なし" },
];

// Load existing categories from SEED
function getSeedCategories() {
  try {
    return window.SEED?.tourOption?.pricingCategories || [];
  } catch (e) {
    return [];
  }
}

function getSeedTourOption() {
  try {
    return window.SEED?.tourOption || {};
  } catch (e) {
    return {};
  }
}

// ── Sidebar ───────────────────────────────────────────────────────────────────

function Sidebar() {
  const items = [
    { key: "dashboard",      href: "index.html",           icon: "⊞", label: "ダッシュボード" },
    { key: "tourOption",     href: "tour-options.html",    icon: "TO", label: "TourOption",            count: 24 },
    { key: "product",        href: "products.html",        icon: "PP", label: "商品ページ",             count: 8  },
    { key: "guideDoc",       href: "guide-materials.html", icon: "GD", label: "ガイド資料",             count: 16 },
    { key: "cancelTemplate", href: "cancel-policies.html", icon: "CP", label: "キャンセルポリシー文言", count: 5  },
  ];
  return (
    <aside className="side-nav">
      <div className="brand-block">
        <div className="brand-mark">d.</div>
        <div>
          <div className="brand-name">deep_Admin</div>
          <div className="brand-caption">Product &amp; Sales · Phase 1</div>
        </div>
      </div>
      <div>
        <div className="nav-section-label">Manage</div>
        <div className="nav-group">
          {items.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${it.key === "tourOption" ? "active" : ""}`}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1, minWidth:0}}>
                <div>{it.label}</div>
              </span>
              {it.count && <span className="nav-count">{it.count}</span>}
            </a>
          ))}
        </div>
      </div>
      <div>
        <div className="nav-section-label">Tools</div>
        <div className="nav-group">
          <button className="nav-item"><span className="nav-icon" style={{fontSize:11}}>⌕</span><span>検索</span></button>
          <button className="nav-item"><span className="nav-icon" style={{fontSize:11}}>≡</span><span>変更履歴</span></button>
          <button className="nav-item"><span className="nav-icon" style={{fontSize:11}}>?</span><span>ヘルプ</span></button>
        </div>
      </div>
      <div className="side-note">
        <strong>Phase 1 設計原則</strong>
        同じTourOptionを複数ページに紐付ける場合、全ページで同じ表示内容を使います。
      </div>
    </aside>
  );
}

// ── Tier card row ─────────────────────────────────────────────────────────────

function getUpperLimit(tiers, index) {
  const sorted = [...tiers].sort((a, b) => a.min - b.min);
  const sortedIndex = sorted.findIndex(t => t.id === tiers[index].id);
  const next = sorted[sortedIndex + 1];
  return next ? next.min - 1 : null;
}

function TierRow({ tier, tiers, index, onChange, onDelete, onDragStart, onDragOver, onDrop }) {
  const rowRef = useRef(null);
  const upperLimit = getUpperLimit(tiers, index);
  const isLast = upperLimit === null;

  return (
    <div
      ref={rowRef}
      draggable
      onDragStart={e => onDragStart(e, index)}
      onDragOver={e => { e.preventDefault(); onDragOver(e, index); }}
      onDrop={e => onDrop(e, index)}
      style={{
        display:"flex", alignItems:"center", gap:0,
        background:"var(--bg-card, #fff)", border:"1px solid var(--line)",
        borderRadius:8, marginBottom:8, overflow:"hidden",
        cursor:"grab",
      }}
    >
      {/* Drag handle */}
      <div style={{padding:"14px 12px", color:"var(--muted)", fontSize:16, cursor:"grab", flexShrink:0}}>
        ⠿
      </div>
      {/* Step number badge */}
      <div style={{
        width:32, height:32, borderRadius:"50%",
        background:"var(--accent)", color:"#fff",
        display:"flex", alignItems:"center", justifyContent:"center",
        fontWeight:700, fontSize:13, flexShrink:0, marginRight:12,
      }}>
        {index + 1}
      </div>
      {/* 人数帯 */}
      <div style={{flex:"0 0 220px", display:"flex", alignItems:"center", gap:4}}>
        <input
          type="number"
          min={1}
          value={tier.min}
          onChange={e => onChange(tier.id, "min", parseInt(e.target.value, 10) || 1)}
          style={{width:72, textAlign:"right"}}
        />
        <span style={{fontSize:13, color:"var(--muted)", whiteSpace:"nowrap"}}>名〜</span>
        {isLast ? (
          <span style={{fontSize:13, color:"var(--accent)", fontWeight:600, whiteSpace:"nowrap"}}>上限なし</span>
        ) : (
          <span style={{fontSize:13, color:"var(--muted)", whiteSpace:"nowrap"}}>{upperLimit}名</span>
        )}
      </div>
      {/* 区切り */}
      <div style={{width:1, height:40, background:"var(--line)", flexShrink:0, margin:"0 16px"}} />
      {/* 単価 */}
      <div style={{flex:1, display:"flex", alignItems:"center", gap:4}}>
        <span style={{fontSize:12, color:"var(--muted)", whiteSpace:"nowrap"}}>1名あたり</span>
        <span style={{fontSize:13, color:"var(--muted)"}}>¥</span>
        <input
          type="number"
          min={0}
          step={100}
          value={tier.price}
          onChange={e => onChange(tier.id, "price", parseInt(e.target.value, 10) || 0)}
          style={{width:120, fontWeight:600}}
        />
        <span style={{fontSize:12, color:"var(--muted)", whiteSpace:"nowrap"}}>/人（税込）</span>
      </div>
      {/* 削除 */}
      <div style={{padding:"0 12px", flexShrink:0}}>
        <button
          className="btn sm"
          onClick={() => onDelete(tier.id)}
          style={{color:"var(--coral)"}}
        >削除</button>
      </div>
    </div>
  );
}

// ── Price preview ─────────────────────────────────────────────────────────────

function PricePreview({ tiers, enabled, basePrice }) {
  const [pax, setPax] = useState(6);

  const sorted = [...tiers].sort((a, b) => a.min - b.min);

  let appliedTier = null;
  let pricePerPerson = null;
  let totalPrice = null;
  let tierLabel = "";

  if (enabled && tiers.length > 0) {
    for (let i = sorted.length - 1; i >= 0; i--) {
      if (pax >= sorted[i].min) { appliedTier = sorted[i]; break; }
    }
    if (appliedTier) {
      pricePerPerson = appliedTier.price;
      totalPrice = pricePerPerson * pax;
      const tierIndex = sorted.findIndex(t => t.id === appliedTier.id);
      const next = sorted[tierIndex + 1];
      tierLabel = next
        ? `${appliedTier.min}〜${next.min - 1}名帯`
        : `${appliedTier.min}名以上帯`;
    }
  } else if (!enabled) {
    pricePerPerson = basePrice;
    totalPrice = basePrice * pax;
    tierLabel = "基準販売価格";
  }

  return (
    <div style={{
      background:"#f0faf8",
      border:"1.5px solid #5bbfaa",
      borderRadius:10,
      padding:"14px 20px",
      marginTop:4,
    }}>
      {/* Header row */}
      <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:10}}>
        <span style={{
          background:"#3aab94",
          color:"#fff",
          fontWeight:700,
          fontSize:12,
          padding:"3px 10px",
          borderRadius:5,
          letterSpacing:"0.04em",
          whiteSpace:"nowrap",
          flexShrink:0,
        }}>計算プレビュー</span>
        <span style={{fontSize:12.5, color:"#4a7a70"}}>
          人数を変更すると、適用される単価帯がハイライトされます。
        </span>
      </div>
      {/* Calculation row */}
      <div style={{display:"flex", alignItems:"center", gap:6, flexWrap:"wrap"}}>
        <span style={{fontSize:13, color:"#4a7a70", marginRight:2}}>例：</span>
        <input
          type="number"
          min={1}
          value={pax}
          onChange={e => setPax(Math.max(1, parseInt(e.target.value, 10) || 1))}
          style={{width:64, textAlign:"right", background:"#fff", border:"1px solid #9fd4c9", borderRadius:5, padding:"4px 8px", fontSize:14}}
        />
        <span style={{fontSize:13, color:"#4a7a70"}}>名 で予約</span>
        {totalPrice !== null ? (
          <>
            <span style={{fontSize:13, color:"#333", margin:"0 4px"}}>
              <strong>{pax}名 × ¥{pricePerPerson.toLocaleString()}</strong>
              <span style={{color:"#6aab96", fontSize:12, marginLeft:4}}>（{tierLabel}）</span>
            </span>
            <span style={{fontSize:15, color:"#4a7a70", margin:"0 2px"}}>=</span>
            <span style={{fontSize:20, fontWeight:800, color:"#1a6b5a", letterSpacing:"-0.01em"}}>
              ¥{totalPrice.toLocaleString()}
            </span>
          </>
        ) : (
          <span style={{color:"#9abfba", fontSize:13, marginLeft:8}}>
            {enabled ? "この人数に適用できる段階がありません。" : "段階価格が無効です。"}
          </span>
        )}
      </div>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────

let nextId = 100;
function genId() { return `tp-${nextId++}`; }

function App() {
  const catId = getParam("id");
  const isNew = getParam("mode") === "new";

  const seedCats = getSeedCategories();
  const seedTo = getSeedTourOption();

  // Find existing category or create new
  const existingCat = catId ? seedCats.find(c => c.id === catId) : null;

  const [catName, setCatName] = useState(existingCat?.name || "");
  const [basePrice, setBasePrice] = useState(existingCat?.basePrice ?? 10000);
  const [costPrice, setCostPrice] = useState(existingCat?.costPrice ?? 0);
  const [enabled, setEnabled] = useState(existingCat?.tieredEnabled ?? false);
  const [tiers, setTiers] = useState(existingCat?.tiers || []);
  const [saved, setSaved] = useState(false);
  const [catNameErr, setCatNameErr] = useState("");

  const dragSrcIndex = useRef(null);

  const handleChange = useCallback((id, field, value) => {
    setTiers(prev => prev.map(t => t.id === id ? {...t, [field]: value} : t));
  }, []);

  const handleDelete = useCallback((id) => {
    setTiers(prev => prev.filter(t => t.id !== id));
  }, []);

  const handleAdd = useCallback(() => {
    const maxMin = tiers.length > 0 ? Math.max(...tiers.map(t => t.min)) + 3 : 1;
    setTiers(prev => [...prev, { id: genId(), min: maxMin, price: 10000 }]);
  }, [tiers]);

  const handleDragStart = useCallback((e, index) => {
    dragSrcIndex.current = index;
    e.dataTransfer.effectAllowed = "move";
  }, []);

  const handleDragOver = useCallback((e, index) => {
    e.preventDefault();
  }, []);

  const handleDrop = useCallback((e, dropIndex) => {
    e.preventDefault();
    const srcIndex = dragSrcIndex.current;
    if (srcIndex === null || srcIndex === dropIndex) return;
    setTiers(prev => {
      const next = [...prev];
      const [moved] = next.splice(srcIndex, 1);
      next.splice(dropIndex, 0, moved);
      return next;
    });
    dragSrcIndex.current = null;
  }, []);

  const handleSave = () => {
    if (!catName.trim()) { setCatNameErr("参加者区分名は必須です"); return; }
    setCatNameErr("");
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  // Used categories (to avoid duplicates)
  const usedNames = seedCats.filter(c => !existingCat || c.id !== existingCat.id).map(c => c.name);

  const isEditing = !!existingCat;
  const pageTitle = isEditing ? `料金区分 編集 — ${existingCat.name}` : "料金区分 新規追加";

  return (
    <div className="app-shell">
      <Sidebar />
      <main className="workspace">
        {/* Topbar */}
        <div className="topbar">
          <div>
            <div className="crumbs">
              <a href="index.html" style={{color:"inherit", textDecoration:"none"}}>deep_Admin</a>
              <span className="sep">›</span>
              <a href="tour-options.html" style={{color:"inherit", textDecoration:"none"}}>TourOption一覧</a>
              <span className="sep">›</span>
              <a href="tour-option-detail.html?tab=sales" style={{color:"inherit", textDecoration:"none"}}>TourOption編集</a>
              <span className="sep">›</span>
              <span className="current">{isEditing ? `料金区分：${existingCat.name}` : "料金区分 新規追加"}</span>
            </div>
            <h1>{pageTitle}</h1>
          </div>
          <div className="topbar-actions">
            <a href="tour-option-detail.html?tab=sales" className="btn ghost">
              ← 販売条件に戻る
            </a>
            <button className="btn primary" onClick={handleSave}>
              {saved ? "✓ 保存しました" : "保存"}
            </button>
          </div>
        </div>

        {/* TourOption info strip */}
        <div className="to-info-strip">
          <div>
            <div style={{fontSize:11, color:"var(--muted)", marginBottom:3, letterSpacing:"0.06em", textTransform:"uppercase", fontWeight:600}}>TourOption</div>
            <div style={{fontSize:15, fontWeight:650}}>{seedTo.name || "祇園夜の食べ歩きツアー 貸切3時間プラン"}</div>
          </div>
          <span className="code">{seedTo.code || "G-KYO-003-1-PR"}</span>
        </div>

        {/* Category name card */}
        <div className="card">
          <div className="card-header">
            <div>
              <h2>参加者区分</h2>
              <p style={{margin:"4px 0 0", color:"var(--muted)", fontSize:12.5}}>
                マスターから選択してください。
              </p>
            </div>
          </div>
          <div className="card-body">
            <div style={{display:"flex", gap:16, flexWrap:"wrap", alignItems:"flex-start"}}>
              <div style={{minWidth:220}}>
                <label style={{fontSize:12, color:"var(--muted)", fontWeight:600, display:"block", marginBottom:6}}>
                  参加者区分 <span style={{color:"var(--coral)"}}>*</span>
                </label>
                <div className="select-wrap" style={{maxWidth:280}}>
                  <select
                    value={catName === "" || PARTICIPANT_CATEGORY_MASTER.some(m => m.label === catName) ? catName : "__custom__"}
                    onChange={e => {
                      if (e.target.value === "__custom__") {
                        setCatName("");
                      } else {
                        setCatName(e.target.value);
                        if (e.target.value) setCatNameErr("");
                      }
                    }}
                    style={{width:"100%"}}
                  >
                    <option value="">選択してください</option>
                    {PARTICIPANT_CATEGORY_MASTER.map(m => {
                      const isUsed = usedNames.includes(m.label);
                      return (
                        <option key={m.id} value={m.label} disabled={isUsed}>
                          {m.label}{isUsed ? "（設定済）" : ""}
                        </option>
                      );
                    })}
                    <option value="__custom__">カスタム入力...</option>
                  </select>
                </div>
              </div>
              {(catName !== "" && !PARTICIPANT_CATEGORY_MASTER.some(m => m.label === catName)) && (
                <div style={{minWidth:200}}>
                  <label style={{fontSize:12, color:"var(--muted)", fontWeight:600, display:"block", marginBottom:6}}>
                    カスタム区分名 <span style={{color:"var(--coral)"}}>*</span>
                  </label>
                  <input
                    type="text"
                    value={catName}
                    onChange={e => { setCatName(e.target.value); if (e.target.value) setCatNameErr(""); }}
                    placeholder="例：ファミリー、グループなど"
                    style={{width:240}}
                  />
                </div>
              )}
            </div>
            {catNameErr && (
              <div style={{color:"var(--coral)", fontSize:12, marginTop:8}}>{catNameErr}</div>
            )}
          </div>
        </div>

        {/* Price card */}
        <div className="card">
          <div className="card-header">
            <div>
              <h2>価格設定</h2>
            </div>
          </div>
          <div className="card-body">
            <div style={{display:"flex", gap:24, flexWrap:"wrap"}}>
              <div>
                <label style={{fontSize:12, color:"var(--muted)", fontWeight:600, display:"block", marginBottom:6}}>
                  販売価格（基準）<span style={{color:"var(--coral)", marginLeft:2}}>*</span>
                </label>
                <div style={{display:"flex", alignItems:"center", gap:6}}>
                  <span style={{color:"var(--muted)", fontSize:13}}>¥</span>
                  <input
                    type="number"
                    min={0}
                    step={100}
                    value={basePrice}
                    onChange={e => setBasePrice(parseInt(e.target.value, 10) || 0)}
                    style={{width:140}}
                  />
                  <span style={{fontSize:13, color:"var(--muted)"}}>/人（税込）</span>
                </div>
              </div>
              <div>
                <label style={{fontSize:12, color:"var(--muted)", fontWeight:600, display:"block", marginBottom:6}}>
                  原価
                </label>
                <div style={{display:"flex", alignItems:"center", gap:6}}>
                  <span style={{color:"var(--muted)", fontSize:13}}>¥</span>
                  <input
                    type="number"
                    min={0}
                    step={100}
                    value={costPrice}
                    onChange={e => setCostPrice(parseInt(e.target.value, 10) || 0)}
                    style={{width:140}}
                  />
                  <span style={{fontSize:13, color:"var(--muted)"}}>/人</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        {/* Enable toggle card */}
        <div className="card">
          <div className="card-body">
            <div className="toggle-wrap">
              <label className="toggle">
                <input type="checkbox" checked={enabled} onChange={e => setEnabled(e.target.checked)} />
                <span className="toggle-slider" />
              </label>
              <div>
                <div className="toggle-label">段階価格を有効にする</div>
                <div className="toggle-desc">
                  {enabled
                    ? "有効：予約時の人数に応じて以下の段階価格が適用されます。"
                    : `無効：基準販売価格（¥${basePrice.toLocaleString()}/人）が全人数に適用されます。`}
                </div>
              </div>
            </div>
            {!enabled && tiers.length > 0 && (
              <div className="info-box amber" style={{marginTop:12}}>
                段階価格が無効のため、設定は保存されますが予約には適用されません。
              </div>
            )}
          </div>
        </div>

        {/* Tiered pricing table card */}
        <div className="card">
          <div className="card-header">
            <div>
              <h2>段階価格設定</h2>
              <p style={{margin:"4px 0 0", color:"var(--muted)", fontSize:12.5, lineHeight:1.55}}>
                下限のみを設定します。上限は次の段階の下限から自動計算されます。最後の段階は「上限なし」になります。
              </p>
            </div>
            <button className="btn sm primary" onClick={handleAdd} disabled={!enabled} style={!enabled ? {opacity:0.45} : {}}>
              ＋ 段階を追加
            </button>
          </div>
          <div style={{padding:"16px 20px", opacity: !enabled ? 0.45 : 1, pointerEvents: !enabled ? "none" : "auto"}}>
            {tiers.length === 0 ? (
              <div style={{padding:"32px 0", textAlign:"center", color:"var(--muted)", fontSize:13, border:"2px dashed var(--line)", borderRadius:8}}>
                {enabled ? "段階価格が設定されていません。「段階を追加」ボタンで追加してください。" : "段階価格が無効です。"}
              </div>
            ) : (
              <>
                {/* Column header */}
                <div style={{display:"flex", alignItems:"center", gap:0, padding:"0 0 6px 56px", fontSize:11, color:"var(--muted)", fontWeight:600, letterSpacing:"0.05em", textTransform:"uppercase"}}>
                  <div style={{flex:"0 0 220px"}}>人数帯</div>
                  <div style={{width:1, height:12, background:"transparent", margin:"0 16px"}} />
                  <div style={{flex:1}}>1名あたり単価（税込）</div>
                </div>
                {tiers.map((tier, index) => (
                  <TierRow
                    key={tier.id}
                    tier={tier}
                    tiers={tiers}
                    index={index}
                    onChange={handleChange}
                    onDelete={handleDelete}
                    onDragStart={handleDragStart}
                    onDragOver={handleDragOver}
                    onDrop={handleDrop}
                  />
                ))}
                <div className="info-box" style={{marginTop:8}}>
                  <strong>ドラッグ＆ドロップ</strong>で段階を並び替えられます。上限は次の段階の下限 − 1名として自動計算されます。
                </div>
              </>
            )}
          </div>
        </div>

        {/* Preview calculator card */}
        {(enabled || basePrice > 0) && (
          <div className="card">
            <div className="card-header">
              <div>
                <h2>計算プレビュー</h2>
                <p style={{margin:"4px 0 0", color:"var(--muted)", fontSize:12.5}}>人数を入力すると、適用される1名あたり単価と合計額を確認できます。</p>
              </div>
            </div>
            <div className="card-body">
              <PricePreview tiers={tiers} enabled={enabled} basePrice={basePrice} />
            </div>
          </div>
        )}

        {/* Bottom actions */}
        <div style={{display:"flex", justifyContent:"flex-end", gap:8, padding:"0 4px 16px"}}>
          <a href="tour-option-detail.html?tab=sales" className="btn ghost">
            ← 販売条件に戻る
          </a>
          <button className="btn primary" onClick={handleSave}>
            {saved ? "✓ 保存しました" : "保存"}
          </button>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
