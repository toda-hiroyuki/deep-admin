<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>段階価格 編集 | deep_Admin</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="css/common.css">
  </head>
  <body data-density="regular" data-side="default">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <script type="text/babel" data-presets="react">
const { useState, useCallback, useRef } = React;

// ── Initial data ─────────────────────────────────────────────────────────────

const TOUR_OPTION = {
  code: "G-KYO-003-1-PR",
  name: "祇園夜の食べ歩きツアー 貸切3時間プラン",
  basePrice: 18000,
};

const INITIAL_TIERS = [
  { id: "tp-1", min: 1, price: 18000 },
  { id: "tp-2", min: 3, price: 14000 },
  { id: "tp-3", min: 6, price: 10000 },
];

let nextId = 10;
function genId() { return `tp-${nextId++}`; }

// ── Sidebar ───────────────────────────────────────────────────────────────────

function Sidebar() {
  const items = [
    { key: "dashboard",       href: "index.html",           icon: "⊞", label: "ダッシュボード" },
    { key: "tourOption",      href: "tour-options.html",    icon: "TO", label: "TourOption",             count: 24 },
    { key: "product",         href: "products.html",        icon: "PP", label: "商品ページ",              count: 8  },
    { key: "guideDoc",        href: "guide-materials.html", icon: "GD", label: "ガイド資料",              count: 16 },
    { key: "cancelTemplate",  href: "cancel-policies.html", icon: "CP", label: "キャンセルポリシー文言",  count: 5  },
  ];
  return (
    <aside className="side-nav">
      <div className="brand-block">
        <div className="brand-mark">d.</div>
        <div>
          <div className="brand-name">deep_Admin</div>
          <div className="brand-caption">Product &amp; Sales · Phase 1</div>
        </div>
      </div>
      <div>
        <div className="nav-section-label">Manage</div>
        <div className="nav-group">
          {items.map(it => (
            <a key={it.key} href={it.href}
              className={`nav-item ${it.key === "tourOption" ? "active" : ""}`}>
              <span className="nav-icon">{it.icon}</span>
              <span style={{flex:1, minWidth:0}}>
                <div>{it.label}</div>
              </span>
              <span className="nav-count">{it.count}</span>
            </a>
          ))}
        </div>
      </div>
      <div>
        <div className="nav-section-label">Tools</div>
        <div className="nav-group">
          <button className="nav-item"><span className="nav-icon" style={{fontSize:11}}>⌕</span><span>検索</span></button>
          <button className="nav-item"><span className="nav-icon" style={{fontSize:11}}>≡</span><span>変更履歴</span></button>
          <button className="nav-item"><span className="nav-icon" style={{fontSize:11}}>?</span><span>ヘルプ</span></button>
        </div>
      </div>
      <div className="side-note">
        <strong>Phase 1 設計原則</strong>
        同じTourOptionを複数ページに紐付ける場合、全ページで同じ表示内容を使います。ページごとの見せ方変更は将来フェーズで設計します。
      </div>
    </aside>
  );
}

// ── Auto upper limit label ────────────────────────────────────────────────────

function UpperLimitLabel({ tiers, index }) {
  const next = tiers[index + 1];
  if (!next) {
    return <span className="tier-auto-limit open">上限なし（○名以上）</span>;
  }
  return <span className="tier-auto-limit">{next.min - 1}名まで（自動）</span>;
}

// ── Tiered price row ──────────────────────────────────────────────────────────

function TierRow({ tier, tiers, index, onChange, onDelete, onDragStart, onDragOver, onDrop }) {
  const rowRef = useRef(null);

  return (
    <tr
      ref={rowRef}
      draggable
      onDragStart={e => onDragStart(e, index)}
      onDragOver={e => { e.preventDefault(); onDragOver(e, index); }}
      onDrop={e => onDrop(e, index)}
      style={{cursor: "grab"}}
    >
      <td style={{width: 32, textAlign: "center"}}>
        <span className="drag-handle" title="ドラッグして並び替え">⠿</span>
      </td>
      <td style={{width: 140}}>
        <div style={{display:"flex", alignItems:"center", gap:6}}>
          <input
            type="number"
            className="narrow"
            min={1}
            value={tier.min}
            onChange={e => onChange(tier.id, "min", parseInt(e.target.value, 10) || 1)}
            style={{width: 80}}
          />
          <span style={{fontSize:13, color:"var(--muted)", whiteSpace:"nowrap"}}>名から</span>
        </div>
      </td>
      <td style={{width: 180}}>
        <UpperLimitLabel tiers={tiers} index={index} />
      </td>
      <td>
        <div style={{display:"flex", alignItems:"center", gap:6}}>
          <span style={{color:"var(--muted)", fontSize:13}}>¥</span>
          <input
            type="number"
            min={0}
            step={100}
            value={tier.price}
            onChange={e => onChange(tier.id, "price", parseInt(e.target.value, 10) || 0)}
            style={{width: 120}}
          />
          <span style={{fontSize:12.5, color:"var(--muted)", whiteSpace:"nowrap"}}>/人（税込）</span>
        </div>
      </td>
      <td style={{width: 60, textAlign:"center"}}>
        <button
          className="btn sm danger icon"
          onClick={() => onDelete(tier.id)}
          title="この段階を削除"
          style={{width:28}}
        >✕</button>
      </td>
    </tr>
  );
}

// ── Preview calculator ────────────────────────────────────────────────────────

function PricePreview({ tiers, enabled, basePrice }) {
  const [pax, setPax] = useState(2);

  let appliedTier = null;
  let pricePerPerson = null;
  let totalPrice = null;

  if (enabled && tiers.length > 0) {
    const sorted = [...tiers].sort((a, b) => a.min - b.min);
    for (let i = sorted.length - 1; i >= 0; i--) {
      if (pax >= sorted[i].min) {
        appliedTier = sorted[i];
        break;
      }
    }
    if (appliedTier) {
      pricePerPerson = appliedTier.price;
      totalPrice = pricePerPerson * pax;
    }
  } else if (!enabled) {
    pricePerPerson = basePrice;
    totalPrice = basePrice * pax;
  }

  return (
    <div>
      <div className="section-title">
        <div>
          <h2>計算プレビュー</h2>
          <p>人数を入力すると、適用される1名あたり単価と合計額を確認できます。</p>
        </div>
      </div>
      <div className="price-preview-box">
        <div style={{display:"flex", alignItems:"center", gap:8}}>
          <label style={{fontSize:13, color:"var(--muted)", whiteSpace:"nowrap"}}>人数</label>
          <input
            type="number"
            min={1}
            value={pax}
            onChange={e => setPax(Math.max(1, parseInt(e.target.value, 10) || 1))}
            style={{width:80}}
          />
          <span style={{fontSize:13, color:"var(--muted)"}}>名</span>
        </div>
        <div style={{borderLeft:"1px solid var(--line)", height:40}} />
        {totalPrice !== null ? (
          <>
            <div>
              <div className="price-preview-result">
                ¥{pricePerPerson.toLocaleString()}<span style={{fontSize:14, fontWeight:500, color:"var(--muted)"}}>/人</span>
              </div>
              <div className="price-preview-sub">
                {enabled && appliedTier ? `${appliedTier.min}名から適用` : "基準販売価格が適用"}
              </div>
            </div>
            <div style={{borderLeft:"1px solid var(--line)", height:40}} />
            <div>
              <div className="price-preview-result">
                ¥{totalPrice.toLocaleString()}
              </div>
              <div className="price-preview-sub">{pax}名合計（税込）</div>
            </div>
          </>
        ) : (
          <div style={{color:"var(--muted)", fontSize:13}}>
            {enabled ? "この人数に適用できる段階がありません。" : "段階価格が無効です。"}
          </div>
        )}
      </div>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────

function App() {
  const [tiers, setTiers] = useState(INITIAL_TIERS);
  const [enabled, setEnabled] = useState(true);
  const [saved, setSaved] = useState(false);

  const dragSrcIndex = useRef(null);

  const handleChange = useCallback((id, field, value) => {
    setTiers(prev => prev.map(t => t.id === id ? {...t, [field]: value} : t));
  }, []);

  const handleDelete = useCallback((id) => {
    setTiers(prev => prev.filter(t => t.id !== id));
  }, []);

  const handleAdd = useCallback(() => {
    const maxMin = tiers.length > 0 ? Math.max(...tiers.map(t => t.min)) + 3 : 1;
    setTiers(prev => [...prev, { id: genId(), min: maxMin, price: 10000 }]);
  }, [tiers]);

  const handleDragStart = useCallback((e, index) => {
    dragSrcIndex.current = index;
    e.dataTransfer.effectAllowed = "move";
  }, []);

  const handleDragOver = useCallback((e, index) => {
    e.preventDefault();
  }, []);

  const handleDrop = useCallback((e, dropIndex) => {
    e.preventDefault();
    const srcIndex = dragSrcIndex.current;
    if (srcIndex === null || srcIndex === dropIndex) return;
    setTiers(prev => {
      const next = [...prev];
      const [moved] = next.splice(srcIndex, 1);
      next.splice(dropIndex, 0, moved);
      return next;
    });
    dragSrcIndex.current = null;
  }, []);

  const handleSave = () => {
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  return (
    <div className="app-shell">
      <Sidebar />
      <main className="workspace">
        {/* Topbar */}
        <div className="topbar">
          <div>
            <div className="crumbs">
              <a href="index.html" style={{color:"inherit", textDecoration:"none"}}>deep_Admin</a>
              <span className="sep">›</span>
              <a href="tour-options.html" style={{color:"inherit", textDecoration:"none"}}>TourOption一覧</a>
              <span className="sep">›</span>
              <a href="tour-option-detail.html" style={{color:"inherit", textDecoration:"none"}}>TourOption編集</a>
              <span className="sep">›</span>
              <span className="current">段階価格</span>
            </div>
            <h1>段階価格 編集</h1>
          </div>
          <div className="topbar-actions">
            <a href="tour-option-detail.html" className="btn ghost">
              ← TourOption編集に戻る
            </a>
            <button className="btn primary" onClick={handleSave}>
              {saved ? "✓ 保存しました" : "保存"}
            </button>
          </div>
        </div>

        {/* TourOption info strip */}
        <div className="to-info-strip">
          <div>
            <div style={{fontSize:11, color:"var(--muted)", marginBottom:3, letterSpacing:"0.06em", textTransform:"uppercase", fontWeight:600}}>TourOption</div>
            <div style={{fontSize:15, fontWeight:650}}>{TOUR_OPTION.name}</div>
          </div>
          <span className="code">{TOUR_OPTION.code}</span>
          <div className="base-price">
            基準販売価格：<strong>¥{TOUR_OPTION.basePrice.toLocaleString()}</strong><span style={{fontSize:12, color:"var(--muted)"}}> /人</span>
          </div>
        </div>

        {/* Enable toggle card */}
        <div className="card">
          <div className="card-body">
            <div className="toggle-wrap">
              <label className="toggle">
                <input type="checkbox" checked={enabled} onChange={e => setEnabled(e.target.checked)} />
                <span className="toggle-slider" />
              </label>
              <div>
                <div className="toggle-label">段階価格を有効にする</div>
                <div className="toggle-desc">
                  {enabled
                    ? "有効：基準販売価格の代わりに、下記の段階価格が予約時に適用されます。"
                    : "無効：基準販売価格（¥" + TOUR_OPTION.basePrice.toLocaleString() + "/人）が全人数に適用されます。"}
                </div>
              </div>
            </div>
            {!enabled && (
              <div className="info-box amber" style={{marginTop: 12}}>
                段階価格が無効のため、下記の設定は保存されますが予約には適用されません。基準販売価格 <strong>¥{TOUR_OPTION.basePrice.toLocaleString()}/人</strong> が使われます。
              </div>
            )}
          </div>
        </div>

        {/* Tiered pricing table card */}
        <div className="card">
          <div className="card-header">
            <div>
              <h2>段階価格設定</h2>
              <p style={{margin:"4px 0 0", color:"var(--muted)", fontSize:12.5, lineHeight:1.55}}>
                下限のみを設定します。上限は次の行の下限から自動計算されます。最後の行は「上限なし」（○名以上）になります。
              </p>
            </div>
            <button className="btn sm primary" onClick={handleAdd} disabled={!enabled} style={!enabled ? {opacity:0.45} : {}}>
              ＋ 段階を追加
            </button>
          </div>
          <div className={`tier-table-wrap${!enabled ? " disabled" : ""}`}>
            {tiers.length === 0 ? (
              <div style={{padding:"32px 20px", textAlign:"center", color:"var(--muted)", fontSize:13}}>
                段階価格が設定されていません。「段階を追加」ボタンで追加してください。
              </div>
            ) : (
              <table className="tier-table">
                <thead>
                  <tr>
                    <th style={{width:32}}></th>
                    <th>下限（人数）</th>
                    <th>上限（自動計算）</th>
                    <th>1名あたり単価</th>
                    <th style={{width:60}}></th>
                  </tr>
                </thead>
                <tbody>
                  {tiers.map((tier, index) => (
                    <TierRow
                      key={tier.id}
                      tier={tier}
                      tiers={tiers}
                      index={index}
                      onChange={handleChange}
                      onDelete={handleDelete}
                      onDragStart={handleDragStart}
                      onDragOver={handleDragOver}
                      onDrop={handleDrop}
                    />
                  ))}
                </tbody>
              </table>
            )}
          </div>
          {tiers.length > 0 && (
            <div style={{padding:"12px 20px", borderTop:"1px solid var(--line-soft)"}}>
              <div className="info-box">
                <strong>ドラッグ＆ドロップ</strong>で行を並び替えられます。上限は次の行の下限 − 1名として自動計算されます。最後の行は常に「上限なし」です。
              </div>
            </div>
          )}
        </div>

        {/* Preview calculator card */}
        <div className="card">
          <div className="card-body">
            <PricePreview tiers={tiers} enabled={enabled} basePrice={TOUR_OPTION.basePrice} />
          </div>
        </div>

        {/* Bottom actions */}
        <div style={{display:"flex", justifyContent:"flex-end", gap:8, padding:"0 4px 16px"}}>
          <a href="tour-option-detail.html" className="btn ghost">
            ← TourOption編集に戻る
          </a>
          <button className="btn primary" onClick={handleSave}>
            {saved ? "✓ 保存しました" : "保存"}
          </button>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
