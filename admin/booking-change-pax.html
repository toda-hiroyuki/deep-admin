<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>人数変更処理 | deep_Admin</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="css/common.css" />
    <style>

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body { background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.5; }
      button, input, select, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; }
      ::selection { background: var(--accent-soft); color: var(--accent-strong); }

      /* ── Shell ── */
      .app-shell { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; }
      .side-nav {
        background: var(--side-bg); color: var(--side-ink); padding: 20px 16px;
        display: flex; flex-direction: column; gap: 20px;
        position: sticky; top: 0; height: 100vh; min-height: 0; overflow-y: auto; border-right: 1px solid var(--side-line);
      }
      .brand-block { display: flex; align-items: center; gap: 10px; padding-bottom: 16px; border-bottom: 1px solid var(--side-line); }
      .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; background: var(--accent); color: #fff; font-weight: 800; font-size: 13px; border-radius: 8px; letter-spacing: -0.02em; }
      .brand-name { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
      .brand-caption { font-size: 11px; color: var(--side-ink-soft); margin-top: 2px; }
      .nav-group { display: flex; flex-direction: column; gap: 2px; }
      .nav-section-label { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--side-ink-soft); padding: 0 8px 6px; }
      .nav-item { appearance: none; border: 0; background: transparent; color: var(--side-ink); display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 6px 10px; border-radius: 7px; text-align: left; font-size: 13.5px; font-weight: 500; position: relative; transition: background 0.12s; width: 100%; }
      .nav-item:hover { background: rgba(255, 255, 255, 0.06); }
      .nav-item.active { background: rgba(255, 255, 255, 0.10); font-weight: 650; }
      .nav-child { padding-left: 30px !important; }
      .nav-child .nav-icon { font-size: 11px !important; opacity: 0.55; width: 18px; }
      .nav-item.active::before { content: ""; position: absolute; left: -16px; top: 8px; bottom: 8px; width: 3px; background: var(--accent); border-radius: 0 3px 3px 0; }
      .nav-icon { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 5px; background: rgba(255, 255, 255, 0.08); font-size: 10px; font-weight: 700; letter-spacing: 0.02em; color: var(--side-ink-soft); flex-shrink: 0; }
      .nav-item.active .nav-icon { background: var(--accent); color: #fff; }
      .nav-count { margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums; color: var(--side-ink-soft); background: rgba(255, 255, 255, 0.06); padding: 1px 6px; border-radius: 4px; }
      .nav-count.alert { background: var(--amber); color: #fff; font-weight: 700; }
      .side-note { margin-top: auto; border-top: 1px solid var(--side-line); padding-top: 16px; color: var(--side-ink-soft); font-size: 11.5px; line-height: 1.55; }
      .side-note strong { display: block; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--side-ink); margin-bottom: 6px; font-weight: 700; }

      /* ── Workspace ── */
      .workspace { padding: 20px 24px 56px; display: flex; flex-direction: column; gap: 16px; min-width: 0; max-width: 1000px; }
      .crumbs { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
      .crumbs .sep { color: var(--muted-soft); }
      .crumbs a { color: var(--muted); text-decoration: none; }
      .crumbs a:hover { color: var(--accent); text-decoration: underline; }
      .crumbs .current { color: var(--ink); font-weight: 600; }
      .page-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-top: 2px; }
      .page-title h1 { margin: 0; font-size: 22px; font-weight: 750; letter-spacing: -0.01em; }
      .page-title .sub { font-size: 12.5px; color: var(--muted); }

      /* ── Badges & pills ── */
      .status-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 11px 4px 9px; border-radius: 999px; background: var(--bg-sunken); color: var(--muted); white-space: nowrap; }
      .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .status-pill.teal { background: var(--accent-soft); color: var(--accent-strong); }
      .status-pill.green { background: var(--green-soft); color: var(--green); }
      .status-pill.amber { background: var(--amber-soft); color: var(--amber); }
      .status-pill.muted { background: var(--bg-sunken); color: var(--muted); }
      .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 4px; background: var(--bg-sunken); color: var(--ink-soft); white-space: nowrap; }
      .badge.blue { background: var(--blue-soft); color: var(--blue); }
      .badge.teal { background: var(--accent-soft); color: var(--accent-strong); }
      .badge.coral { background: var(--coral-soft); color: var(--coral); }

      /* ── Buttons ── */
      .btn { height: var(--field-h); padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; font-weight: 600; transition: background 0.1s, border-color 0.1s; white-space: nowrap; }
      .btn:hover { background: var(--surface-tint); border-color: var(--ink-soft); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
      .btn.lg { height: 44px; padding: 0 24px; font-size: 14px; }
      .btn.sm { height: 32px; padding: 0 14px; font-size: 12.5px; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }

      /* ── Cards ── */
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); overflow: hidden; }
      .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line-soft); background: var(--surface-warm); }
      .card-title { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; letter-spacing: -0.005em; }
      .card-title .sec-no { width: 22px; height: 22px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; font-size: 11px; font-weight: 800; }
      .card-title .sec-hint { font-size: 11.5px; font-weight: 500; color: var(--muted); margin-left: 2px; }
      .card-body { padding: 20px; }
      .card-foot { padding: 14px 20px; border-top: 1px solid var(--line-soft); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .card-foot.split { justify-content: space-between; }
      .card-foot.end { justify-content: flex-end; }

      /* ── Target summary card (compact) ── */
      .summary-card { display: flex; align-items: center; gap: 0; flex-wrap: wrap; padding: 12px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); }
      .summary-card .s-item { display: flex; flex-direction: column; gap: 2px; padding: 0 18px; position: relative; }
      .summary-card .s-item + .s-item::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 1px; background: var(--line-soft); }
      .summary-card .s-item:first-child { padding-left: 0; }
      .summary-card .s-lab { font-size: 10.5px; font-weight: 600; color: var(--muted-soft); letter-spacing: 0.03em; text-transform: uppercase; }
      .summary-card .s-val { font-size: 13px; font-weight: 650; color: var(--ink); }
      .summary-card .s-val.mono { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; font-weight: 650; }
      .summary-card .s-val .sub { color: var(--muted); font-weight: 500; }

      /* ── Step indicator ── */
      .stepper { display: flex; align-items: flex-start; padding: 18px 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); }
      .step { display: flex; align-items: center; flex: 1 1 0; min-width: 0; }
      .step-node { display: flex; align-items: center; gap: 10px; }
      .step-dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; flex-shrink: 0; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--muted-soft); transition: all 0.18s; font-variant-numeric: tabular-nums; }
      .step-meta { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
      .step-kicker { font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted-soft); }
      .step-label { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
      .step-line { flex: 1 1 auto; height: 1.5px; background: var(--line-strong); margin: 0 12px; border-radius: 2px; min-width: 16px; }
      /* states */
      .step.is-current .step-dot { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: var(--ring); }
      .step.is-current .step-label { color: var(--ink); font-weight: 700; }
      .step.is-current .step-kicker { color: var(--accent-strong); }
      .step.is-done .step-dot { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); }
      .step.is-done .step-label { color: var(--ink-soft); }
      .step.is-done .step-line { background: var(--accent); }
      .step.is-skipped .step-dot { border-style: dashed; }
      .step.is-skipped .step-label { text-decoration: line-through; color: var(--muted-soft); }

      /* ── Radio group ── */
      .radio-row { display: flex; flex-direction: column; gap: 0; }
      .radio-opt { display: flex; align-items: flex-start; gap: 11px; font-size: 14px; color: var(--ink-soft); user-select: none; cursor: pointer; padding: 11px 12px; border: 1px solid var(--line-soft); border-radius: var(--radius); transition: background 0.1s, border-color 0.1s; }
      .radio-opt + .radio-opt { margin-top: 8px; }
      .radio-opt:hover { border-color: var(--line-strong); background: var(--surface-tint); }
      .radio-opt.checked { border-color: var(--accent); background: var(--accent-soft); }
      .radio-opt input { width: 17px; height: 17px; accent-color: var(--accent); margin-top: 1px; flex-shrink: 0; }
      .radio-opt .ro-main { font-weight: 600; }
      .radio-opt .ro-sub { color: var(--muted); font-size: 12px; font-weight: 500; display: block; margin-top: 2px; }
      .radio-opt.checked .ro-sub { color: var(--accent-strong); }

      .field-block { display: flex; flex-direction: column; gap: 18px; }
      .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      @media (max-width: 720px) { .field-grid { grid-template-columns: 1fr; } }
      .form-section-title { font-size: 12px; font-weight: 700; color: var(--ink-soft); letter-spacing: 0.01em; margin-bottom: 11px; display: flex; align-items: center; gap: 8px; }
      .form-section-title .req { color: var(--coral); }
      .form-section + .form-section { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--line-soft); }

      .filter-label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; margin-bottom: 6px; display: block; }
      .ctrl { height: var(--field-h); border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); color: var(--ink); padding: 0 10px; font-size: 13px; transition: border-color 0.1s, box-shadow 0.1s; width: 100%; }
      .ctrl::placeholder { color: var(--muted-soft); }
      .ctrl:hover { border-color: var(--ink-soft); }
      .ctrl:focus, .ctrl:focus-visible { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
      textarea.ctrl { min-height: 88px; padding: 10px 12px; resize: vertical; line-height: 1.5; height: auto; }
      .input-affix { position: relative; display: flex; align-items: center; width: 100%; }
      .input-affix .pfx { position: absolute; left: 12px; color: var(--muted); font-size: 13px; pointer-events: none; }
      .input-affix .ctrl { padding-left: 24px; font-variant-numeric: tabular-nums; font-weight: 600; }

      /* ── Current value callout ── */
      .now-box { display: flex; align-items: center; gap: 12px; padding: 13px 16px; background: var(--surface-tint); border: 1px solid var(--line-soft); border-radius: var(--radius); margin-bottom: 20px; }
      .now-box .nb-lab { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.03em; text-transform: uppercase; }
      .now-box .nb-val { font-size: 14px; font-weight: 700; color: var(--ink); }

      /* ── Amount table ── */
      .amt-table { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; font-variant-numeric: tabular-nums; }
      .amt-table th { text-align: left; font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface-tint); }
      .amt-table th.right { text-align: right; }
      .amt-table td { padding: 13px 16px; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; vertical-align: middle; }
      .amt-table tr:last-child td { border-bottom: 0; }
      .amt-table td.lab { color: var(--ink-soft); font-weight: 600; }
      .amt-table td.lab .lab-sub { display: block; font-size: 11.5px; color: var(--muted-soft); font-weight: 500; margin-top: 2px; }
      .amt-table td.val { text-align: right; font-weight: 700; font-size: 15px; }
      .amt-table td.input-cell { text-align: right; }
      .amt-table tr.diff-row { background: var(--surface-warm); }
      .amt-table tr.diff-row td { border-top: 1px solid var(--line); }
      .amt-input-wrap { display: inline-flex; justify-content: flex-end; width: 200px; margin-left: auto; }
      .diff-amount { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
      .diff-amount.pos { color: var(--coral); }
      .diff-amount.neg { color: var(--green); }
      .diff-amount.zero { color: var(--muted); }

      /* ── 区分 badges + legend ── */
      .kbadge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; letter-spacing: 0.01em; }
      .kbadge.kb-fixed { background: var(--green-soft); color: var(--green); }
      .kbadge.kb-estimate { background: var(--amber-soft); color: var(--amber); }
      .kbadge.kb-pending { background: var(--bg-sunken); color: var(--muted); border: 1px solid var(--line-strong); }
      .kbadge.kb-record { background: var(--blue-soft); color: var(--blue); }
      .kubun-legend { display: flex; flex-wrap: wrap; gap: 10px 18px; padding: 13px 16px; background: var(--surface-tint); border: 1px solid var(--line-soft); border-radius: var(--radius); margin-bottom: 16px; }
      .kubun-legend .kl-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); line-height: 1.4; }
      .auto-detect { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
      .auto-detect .ad-lab { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted-soft); }
      .auto-detect .ad-val { font-weight: 700; color: var(--accent-strong); background: var(--accent-soft); padding: 2px 10px; border-radius: 999px; }

      /* ── Amount table extensions ── */
      .amt-table td.kb-cell { width: 132px; white-space: nowrap; }
      .amt-table td.val-cell { text-align: right; }
      .amt-table .kb-dash { color: var(--muted-soft); }
      .val-amt { font-weight: 700; font-size: 15px; }
      .amt-note { font-size: 12.5px; font-weight: 600; }
      .amt-note.est { color: var(--amber); }
      .amt-note.pend { color: var(--muted); }
      .amt-note.rec { color: var(--blue); }
      /* 販売チャネル 読み取り専用バッジ（サマリー内） */
      .chan-badge { display: inline-flex; align-items: center; font-size: 12px; font-weight: 700; color: var(--accent-strong); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); padding: 3px 11px; border-radius: 999px; }
      /* 反映先：チャネルにより不要な行のグレーアウト */
      .reflect-table tr.row-muted td { opacity: 0.55; }
      .reflect-table .r-sub { display: block; font-size: 11.5px; color: var(--muted-soft); font-weight: 500; margin-top: 2px; }
      /* 催行回の扱い：自動判定インフォメーションバナー（読み取り専用） */
      .auto-tag { display: inline-flex; align-items: center; margin-left: 8px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; color: var(--accent-strong); background: var(--accent-soft); padding: 2px 9px; border-radius: 999px; vertical-align: middle; }
      .info-banner { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-radius: var(--radius); border: 1px solid; }
      .info-banner.warn { background: var(--amber-soft); border-color: color-mix(in srgb, var(--amber) 35%, transparent); }
      .info-banner.ok { background: var(--green-soft); border-color: color-mix(in srgb, var(--green) 30%, transparent); }
      .info-banner .ib-ic { font-size: 18px; line-height: 1.3; flex: none; }
      .info-banner .ib-body { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
      .info-banner .ib-main { font-size: 14px; font-weight: 700; color: var(--ink); }
      .info-banner.warn .ib-main { color: var(--amber); }
      .info-banner.ok .ib-main { color: var(--green); }
      .info-banner .ib-sub { font-size: 12px; color: var(--muted); line-height: 1.5; }
      .info-banner .ib-readonly { flex: none; align-self: center; font-size: 10.5px; font-weight: 700; color: var(--muted); background: var(--surface); border: 1px solid var(--line-strong); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
      .amt-note .an-sub { display: block; font-size: 11px; font-weight: 500; color: var(--muted-soft); margin-top: 2px; }
      .amt-table tr.memo-row td { padding: 0 16px 14px; border-bottom: 1px solid var(--line-soft); }
      .amt-table tr.memo-row + tr td { border-top: 0; }
      .memo-box { background: var(--surface-tint); border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 11px 13px; }
      .memo-box .memo-lab { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 7px; }
      .memo-box .memo-lab .kbadge { font-size: 10px; padding: 2px 7px; }
      .memo-box input.ctrl { background: var(--surface); height: 34px; font-size: 12.5px; }

      /* ── Reflection checklist table ── */
      .reflect-table { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
      .reflect-table th { text-align: left; font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface-tint); }
      .reflect-table td { padding: 14px 16px; border-bottom: 1px solid var(--line-soft); font-size: 13px; vertical-align: top; }
      .reflect-table tr:last-child td { border-bottom: 0; }
      .reflect-table td.r-target { font-weight: 700; color: var(--ink); white-space: nowrap; width: 130px; }
      .reflect-table td.r-target .r-ic { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; background: var(--bg-sunken); color: var(--muted); font-size: 10px; font-weight: 800; margin-right: 9px; vertical-align: middle; }
      .reflect-table td.r-status { white-space: nowrap; width: 130px; }
      .reflect-table .r-content { color: var(--ink-soft); line-height: 1.5; }
      .reflect-table .r-content .arrow { color: var(--muted-soft); margin: 0 5px; }

      /* ── Summary review ── */
      .review-grid { display: grid; grid-template-columns: 160px 1fr; gap: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
      .review-grid .rv-dt { background: var(--surface-tint); color: var(--muted); font-size: 12px; font-weight: 700; padding: 13px 16px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; letter-spacing: 0.02em; }
      .review-grid .rv-dd { padding: 13px 16px; border-bottom: 1px solid var(--line-soft); font-size: 14px; font-weight: 650; color: var(--ink); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .review-grid .rv-dt:nth-last-child(2), .review-grid .rv-dd:last-child { border-bottom: 0; }
      .review-grid .rv-dd .placeholder { color: var(--muted-soft); font-weight: 500; font-style: italic; }
      .exec-note { display: flex; gap: 11px; padding: 14px 16px; background: var(--amber-bg); border: 1px solid var(--amber-soft); border-radius: var(--radius); margin-top: 18px; font-size: 12.5px; color: var(--amber); line-height: 1.5; }
      .exec-note .en-ic { font-weight: 800; flex-shrink: 0; }

      /* ── Completion screen ── */
      .done-banner { display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: var(--green-soft); border: 1px solid color-mix(in srgb, var(--green) 30%, transparent); border-radius: var(--radius-lg); margin-bottom: 22px; }
      .done-banner .db-ic { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--green); color: #fff; font-weight: 800; font-size: 18px; display: flex; align-items: center; justify-content: center; }
      .done-banner .db-title { font-size: 16px; font-weight: 800; color: var(--green); }

    <script type="text/babel" data-presets="react">
      const { useState, useRef, useMemo } = React;

      const STEPS_CHANGE = [
        { kicker: "Step 1", label: "変更内容" },
        { kicker: "Step 2", label: "実行確認" },
        { kicker: "Step 3", label: "処理完了" },
      ];

      const BEFORE_AMOUNT = 75000;
      const UNIT_PRICE = { adult: 16000, child: 11000 };
      const FREE_CANCEL_DEADLINE = "2026/06/13（土）23:59";
      const CANCEL_POLICY_NAME = "標準キャンセルポリシー（7日前まで無料）";

      const BASE_BOOKING = {
        bookingId: "BK-260601-00002",
        guest: "Smith John",
        tour: "G-WAK-001-2-PR 里山ハイキング",
        date: "2026/06/20（土）09:00〜12:00",
        pax: "大人4 子供1",
      };
      const SCENARIOS = {
        direct_active:    { salesChannel: "direct", sessionActiveBookings: 3 },
        direct_cancelled: { salesChannel: "direct", sessionActiveBookings: 1 },
        ota_active:       { salesChannel: "ota",    sessionActiveBookings: 3 },
        ota_cancelled:    { salesChannel: "ota",    sessionActiveBookings: 1 },
      };
      const scenarioKey = (channel, fate) => channel + "_" + (fate === "cancelled" ? "cancelled" : "active");

      const yen = (n) => "¥" + Number(n || 0).toLocaleString("ja-JP");

      const KUBUN = {
        fixed:    { t: "確定", c: "kb-fixed" },
        estimate: { t: "概算", c: "kb-estimate" },
        pending:  { t: "要確認後入力", c: "kb-pending" },
        record:   { t: "記録のみ", c: "kb-record" },
      };
      function Kubun({ k }) {
        const m = KUBUN[k];
        return <span className={`kbadge ${m.c}`}>{m.t}</span>;
      }

      const CHANNEL_CONFIG = {
        direct: {
          label: "自社サイト直販",
          short: "直販",
          otaFeeRate: null,
          paymentFeeRate: 0.036,
          showRefund: true,
          showPriceDiff: true,
        },
        ota: {
          label: "OTA経由",
          short: "OTA",
          otaFeeRate: 0.20,
          paymentFeeRate: null,
          showRefund: false,
          showPriceDiff: false,
        },
      };

      function Stepper({ current, steps }) {
        return (
          <div className="stepper">
            {steps.map((s, i) => {
              let cls = "step";
              if (i === current) cls += " is-current";
              else if (i < current) cls += " is-done";
              const done = i < current;
              return (
                <div className={cls} key={i}>
                  <div className="step-node">
                    <span className="step-dot">{done ? "✓" : (i + 1)}</span>
                    <span className="step-meta">
                      <span className="step-kicker">{s.kicker}</span>
                      <span className="step-label">{s.label}</span>
                    </span>
                  </div>
                  {i < steps.length - 1 && <span className="step-line"></span>}
                </div>
              );
            })}
          </div>
        );
      }

      function App() {
        const [toast, setToast] = useState(null);
        const toastTimer = useRef(null);
        const [step, setStep] = useState(0);

        const [scenario, setScenario] = useState("direct_active");
        const sc = SCENARIOS[scenario];
        const BOOKING_DATA = { ...BASE_BOOKING, salesChannel: sc.salesChannel };
        const SESSION_ACTIVE_BOOKINGS = sc.sessionActiveBookings;

        // 種別選択画面（booking-change.html）から引き継ぐ発生元・変更理由
        const qp = new URLSearchParams(window.location.search);
        const [changeType, setChangeType] = useState("increase"); // increase | decrease
        const [origin, setOrigin] = useState(qp.get("origin") || "guest");
        const [reason, setReason] = useState(qp.get("reason") || "");

        // Step 2 — headcount
        const [newAdults, setNewAdults] = useState("");
        const [newChildren, setNewChildren] = useState("");

        // Step 3 — increase / decrease
        const [addCharge, setAddCharge] = useState("");
        const [refundInput, setRefundInput] = useState("");
        const [cancelRate, setCancelRate] = useState("");

        // 変更フロー STEP 4（処理完了）
        const [notifyGuide, setNotifyGuide] = useState(true);
        const [completionMemo, setCompletionMemo] = useState("");
        const [executed, setExecuted] = useState(false);

        // キャンセル期限（減員のキャンセル料計算に使用）
        const [cancelDeadline, setCancelDeadline] = useState("within");
        // 修正3/4：追加請求の決済リンク
        const [chargeStatus, setChargeStatus] = useState("unsent");
        const [payUrl, setPayUrl] = useState("");
        const [payExpiry, setPayExpiry] = useState("");
        const [paySentAt, setPaySentAt] = useState("");
        const [payMethod, setPayMethod] = useState("email");
        // 修正4：OTA当日現地増員フラグ
        const [otaSameDay, setOtaSameDay] = useState(false);

        const selectScenario = (key) => {
          if (key === scenario) return;
          setScenario(key);
          setStep(0);
          setChangeType("increase");
          setOrigin(qp.get("origin") || "guest");
          setReason(qp.get("reason") || "");
          setNewAdults(""); setNewChildren("");
          setAddCharge(""); setRefundInput(""); setCancelRate("");
          setNotifyGuide(true); setCompletionMemo("");
          setExecuted(false);
          setChargeStatus("unsent"); setPayUrl(""); setPayExpiry(""); setPaySentAt(""); setPayMethod("email");
          setOtaSameDay(false);
          const s = SCENARIOS[key];
          showToast(`シナリオを「${CHANNEL_CONFIG[s.salesChannel].label} × 催行回${s.sessionActiveBookings <= 1 ? "中止" : "存続"}」に切替えました`);
        };

        const salesChannel = BOOKING_DATA.salesChannel;
        const channel = CHANNEL_CONFIG[salesChannel];

        const otherActiveBookings = Math.max(0, SESSION_ACTIVE_BOOKINGS - 1);
        const sessionFate = SESSION_ACTIVE_BOOKINGS <= 1 ? "cancelled" : "remains";

        const showToast = (msg) => {
          setToast(msg);
          clearTimeout(toastTimer.current);
          toastTimer.current = setTimeout(() => setToast(null), 2400);
        };

        const changeTypeLabel = changeType === "increase" ? "人数変更（増員）" : "人数変更（減員）";
        const originLabel = { guest: "ゲスト都合", operator: "運営都合", thirdparty: "第三者都合（OTA・旅行代理店など）" }[origin];

        const num = (v) => {
          const n = parseInt(String(v).replace(/[^0-9-]/g, ""), 10);
          return isNaN(n) ? null : n;
        };

        // 増員：変更後合計 = 変更前 + 追加請求額
        const increaseTotal = useMemo(() => {
          const a = num(addCharge);
          return a === null ? null : BEFORE_AMOUNT + a;
        }, [addCharge]);

        const suggestedRate = cancelDeadline === "within" ? 0 : 50;
        const effectiveCancelRate = (() => {
          if (origin === "operator") return 0;
          const r = parseFloat(String(cancelRate).replace(/[^0-9.]/g, ""));
          return (cancelRate === "" || isNaN(r)) ? suggestedRate : r;
        })();

        // 減員：変更後販売金額 = 変更後人数 × 単価（自動計算）
        const afterAmount = useMemo(() => {
          const a = num(newAdults); const c = num(newChildren);
          if (a === null && c === null) return null;
          return (a || 0) * UNIT_PRICE.adult + (c || 0) * UNIT_PRICE.child;
        }, [newAdults, newChildren]);
        // 減員：キャンセル対象金額 = 変更前後の販売金額の差額（自動計算・編集可）

                                : decRefund > 0 ? <strong className="diff-amount neg" style={{ fontSize: 14 }}>{yen(decRefund)} 返金</strong>
                                : <span>返金なし</span>}
                            </div>
                            <div className="rv-dt">変更後販売金額</div>
                            <div className="rv-dd">{decreaseTotal === null ? <span className="placeholder">未入力</span> : <strong>{yen(decreaseTotal)}</strong>}</div>
                          </React.Fragment>
                        )}
                        <div className="rv-dt">ガイド通知</div>
                        <div className="rv-dd">{notifyGuide ? "通知する" : "通知しない"}</div>
                      </div>
                    </div>
                    {reflectInner}
                    <div className="exec-note">
                      <span className="en-ic">⚠️</span>
                      <span>処理を実行すると取り消せません。リソース・催行回・ガイド手配へ即時反映されます。</span>
                    </div>
                  </div>
                  <div className="card-foot split">
                    <button className="btn" onClick={prev}>← 前へ</button>
                    <button className="btn primary lg" onClick={() => { setExecuted(true); next(); showToast(`${changeTypeLabel}の処理を実行しました（変更ログに記録）`); }}>処理を実行する →</button>
                  </div>
                </section>
              )}

              {/* ════════ STEP 4 ════════ */}
              {step === 2 && (
                <section className="card" data-screen-label="Step 3 処理完了">
                  <div className="card-head">
                    <div className="card-title"><span className="sec-no">3</span>処理完了</div>
                  </div>
                  <div className="card-body">
                    <div className="done-banner">
                      <span className="db-ic">✓</span>
                      <div>
                        <div className="db-title">処理が完了しました</div>
                        <div className="db-sub">{changeTypeLabel}の処理を実行し、変更ログに記録しました。</div>
                      </div>
                    </div>

                    {showChargeIssue && (
                      <div className="charge-card">
                        <div className="cc-head">
                          <div className="cc-title">💳 追加請求の発行</div>
                          <div className="cc-amt">{yen(additionalChargeAmount)}</div>
                        </div>
                        <div className="cc-body">
                          <div>
                            <label className="filter-label">追加請求ステータス</label>
                            <select className="ctrl" value={chargeStatus} onChange={e => setChargeStatus(e.target.value)}>
                              <option value="unsent">⬜ 未送付</option>
                              <option value="invoiced">📤 請求済み（未払い）</option>
                              <option value="paid">✅ 支払い済み</option>
                              <option value="expired">⏰ 期限切れ</option>
                              <option value="cancelled">🚫 取消</option>
                            </select>
                          </div>
                          {(chargeStatus === "invoiced" || chargeStatus === "paid") && (
                            <div className="field-grid reveal">
                              <div>
                                <label className="filter-label">決済リンク URL</label>
                                <input className="ctrl" placeholder="https://buy.stripe.com/..." value={payUrl} onChange={e => setPayUrl(e.target.value)} />
                              </div>
                              <div>
                                <label className="filter-label">リンク有効期限</label>
                                <input type="date" className="ctrl" value={payExpiry} onChange={e => setPayExpiry(e.target.value)} />
                              </div>
                              <div>
                                <label className="filter-label">送付日時</label>
                                <input type="datetime-local" className="ctrl" value={paySentAt} onChange={e => setPaySentAt(e.target.value)} />
                              </div>
                              <div>
                                <label className="filter-label">送付手段</label>
                                <select className="ctrl" value={payMethod} onChange={e => setPayMethod(e.target.value)}>
                                  <option value="email">メール</option>
                                  <option value="line">LINE</option>
                                  <option value="whatsapp">WhatsApp</option>
                                  <option value="other">その他</option>
                                </select>
                              </div>
                            </div>
                          )}
                          {chargeStatus === "expired" && (
                            <div className="lbanner alert reveal"><div className="lb-sub" style={{ color: "var(--coral)", fontWeight: 600 }}>⚠️ 決済リンクの有効期限が切れています。Stripe 管理画面で新しいリンクを発行し、URLを更新してください。</div></div>
                          )}
                          <div className="lbanner note"><div className="lb-sub">決済リンクは Stripe 管理画面で発行し、URL をここに記録してください。ゲストにリンクを送付後、ステータスを「請求済み」に更新してください。</div></div>
                        </div>
                      </div>
                    )}

                    <p style={{ margin: "20px 0 12px", fontSize: 13, fontWeight: 700, color: "var(--ink-soft)" }}>以下の対応を行ってください</p>
                    <table className="reflect-table">
                      <thead>
                        <tr><th>対応項目</th><th>内容</th><th>状態</th></tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td className="r-target"><span className="r-ic">GD</span>ガイド手配</td>
                          <td className="r-content">再手配要否フラグが<strong>ON</strong>になっています。{changeType === "increase" ? "増員後の" : "減員後の"}ガイドアサインを確認してください</td>
                          <td className="r-status"><span className="status-pill amber"><span className="dot"></span>⚠️ 要確認</span></td>
                        </tr>
                        {channel.showRefund && changeType === "decrease" && (
                          <tr>
                            <td className="r-target"><span className="r-ic">RF</span>返金処理</td>
                            <td className="r-content">返金レコードが<strong>作成されました（未処理）</strong>。返金操作を実施してください</td>
                            <td className="r-status"><span className="status-pill amber"><span className="dot"></span>⚠️ 未処理</span></td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                    <div className="auto-line">販売金額・チャネル手数料・ゲスト立替経費・決済手数料は自動更新されました。</div>
                    <div className="pend-line">
                      <span className="pl-ic">⏳</span>
                      施設費など未確定の項目は、<strong>月次締め確認画面で後日確認してください。</strong>
                    </div>
                  </div>
                  <div className="card-foot end">
                    <button className="btn primary" onClick={() => { window.location.href = "booking-detail.html"; }}>予約詳細に戻る</button>
                  </div>
                </section>
              )}
            </div></main>

            <div className={`toast ${toast ? "show" : ""}`}>
              <span className="t-dot"></span>{toast}
            </div>
            </div>
          </React.Fragment>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
